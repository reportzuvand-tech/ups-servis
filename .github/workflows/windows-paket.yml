name: Windows paketi

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Paketləri quraşdır
        run: npm install

      - name: Kitabxanaları köçür
        run: npm run copy-libs

      - name: Windows paketini yığ (proqram + lokal server)
        run: |
          P=pkg/UPS-Servis-Windows
          mkdir -p $P/app $P/server
          cp -r www/* $P/app/
          if [ -f server/server.js ]; then cp server/server.js $P/server/; else cp server.js $P/server/; fi
          for f in Qurasdir.bat Server-baslat.bat Server-avtostart.bat zuvand.ico; do
            if [ -f windows/$f ]; then cp windows/$f $P/; else cp $f $P/; fi
          done
          ls -R pkg

      - uses: actions/upload-artifact@v4
        with:
          name: UPS-Servis-Windows
          path: pkg/
