name: Windows paketi

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Paketləri quraşdır
        run: npm install

      - name: Kitabxanaları köçür
        run: npm run copy-libs

      - name: Windows paketini yığ (proqram + lokal server)
        run: |
          P=pkg/UPS-Servis-Windows
          mkdir -p $P/app
          cp -r www/* $P/app/
          cp -r server $P/server
          cp windows/* $P/

      - uses: actions/upload-artifact@v4
        with:
          name: UPS-Servis-Windows
          path: pkg/
