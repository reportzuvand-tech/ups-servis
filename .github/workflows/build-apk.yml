name: APK yığ

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Paketləri quraşdır
        run: npm install

      - name: Android layihəsini yarat və sinxronla
        run: |
          npx cap add android
          npm run sync

      - name: APK yığ
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK-nı adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk UPS-Servis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UPS-Servis-APK
          path: UPS-Servis.apk
