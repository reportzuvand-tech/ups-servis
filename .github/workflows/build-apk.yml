name: APK yığ

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Paketləri quraşdır
        run: npm install

      - name: Android layihəsini yarat və sinxronla
        run: |
          npx cap add android
          npm run sync
          M=android/app/src/main/AndroidManifest.xml
          # işçinin yeri (proqram bağlı olanda da): GPS icazələri və ön plan xidməti
          grep -q ACCESS_FINE_LOCATION "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n</manifest>#' "$M"
          grep -q ACCESS_FINE_LOCATION "$M"
          S=android/app/src/main/res/values/strings.xml
          grep -q capacitor_background_geolocation_notification_channel_name "$S" || sed -i 's#</resources>#    <string name="capacitor_background_geolocation_notification_channel_name">Yerin izlənməsi</string>\n</resources>#' "$S"

      - name: APK yığ
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK-nı adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk UPS-Servis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UPS-Servis-APK
          path: UPS-Servis.apk
