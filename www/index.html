|периодов}","{0} dönem"],["dövrdən əvvəl ({0} {1})","before the period ({0} {1})","до периода ({0} {1})","dönemden önce ({0} {1})"],["{0} siqnal","{0} {0|signal|signals}","{0} {0|сигнал|сигнала|сигналов}","{0} sinyal"],["Jurnalda {0} kritik və {1} xəbərdarlıq xarakterli məsələ müəyyən edilmişdir.","Issues identified in the log: {0} critical, {1} requiring attention.","В журнале выявлено проблем: критических – {0}, требующих внимания – {1}.","Kayıtta {0} kritik ve {1} uyarı niteliğinde konu tespit edildi."],["Jurnalda {0} kritik məsələ müəyyən edilmişdir.","{0} critical {0|issue was|issues were} identified in the log.","В журнале выявлено критических проблем: {0}.","Kayıtta {0} kritik konu tespit edildi."],["Jurnalda {0} xəbərdarlıq xarakterli məsələ müəyyən edilmişdir.","{0} {0|issue|issues} requiring attention {0|was|were} identified in the log.","В журнале выявлено проблем, требующих внимания: {0}.","Kayıtta {0} uyarı niteliğinde konu tespit edildi."],["Yük <b>{0} dəfə qidasız qalıb</b> (Load not supplied) – hər halın planlı olub-olmadığı müştəri ilə dəqiqləşdirilməli, plansızdırsa səbəbi araşdırılmalıdır.","The load <b>was left unsupplied {0} {0|time|times}</b> (Load not supplied) – whether each case was planned should be clarified with the customer, and if unplanned the cause investigated.","Нагрузка <b>оставалась без питания {0} {0|раз|раза|раз}</b> (Load not supplied) – необходимо уточнить у заказчика, был ли каждый случай плановым, а если нет – выяснить причину.","Yük <b>{0} kez beslemesiz kaldı</b> (Load not supplied) – her durumun planlı olup olmadığı müşteri ile netleştirilmeli, plansızsa nedeni araştırılmalıdır."],["<b>Kritik alarmlar</b> var ({0}) – batareya dövrəsi (qoruyucular, batareya açarı QF) və idarəetmə kartları yoxlanmalıdır.","There are <b>critical alarms</b> ({0}) – the battery circuit (fuses, QF battery switch) and control boards should be checked.","Есть <b>критические аварии</b> ({0}) – необходимо проверить цепь батарей (предохранители, выключатель QF) и платы управления.","<b>Kritik alarmlar</b> var ({0}) – akü devresi (sigortalar, QF akü şalteri) ve kontrol kartları kontrol edilmelidir."],["<b>Yük {0} ərzində UPS tərəfindən qorunmayıb</b> ({1} – {2}; bypass / invertor dayanıb). Bu müddətdə hər şəbəkə kəsintisi yükü birbaşa söndürür – UPS-in invertor rejiminə qaytarılması təcili tələb olunur.","<b>The load was not protected by the UPS for {0}</b> ({1} – {2}; bypass / inverter stopped). During this time every mains failure switches the load off directly – returning the UPS to inverter mode is urgently required.","<b>Нагрузка {0} не была защищена ИБП</b> ({1} – {2}; байпас / инвертор остановлен). В это время любое отключение сети напрямую обесточивает нагрузку – требуется срочно вернуть ИБП в режим инвертора.","<b>Yük {0} boyunca UPS tarafından korunmadı</b> ({1} – {2}; baypas / invertör durdu). Bu süre boyunca her şebeke kesintisi yükü doğrudan kapatır – UPS'in acilen invertör moduna döndürülmesi gerekir."],["Yük <b>{0} dəfə bypass-a</b> keçib – keçid səbəbləri (invertor/modul nasazlığı, yüklənmə) yoxlanmalıdır.","The load <b>transferred to bypass {0} {0|time|times}</b> – the transfer causes (inverter/module fault, overload) should be checked.","Нагрузка <b>{0} {0|раз|раза|раз} переходила на байпас</b> – необходимо проверить причины перехода (неисправность инвертора/модуля, перегрузка).","Yük <b>{0} kez baypasa</b> geçti – geçiş nedenleri (invertör/modül arızası, aşırı yük) kontrol edilmelidir."],["Güc modullarında ümumi alarmlar qeydə alınıb (ən çox: Modul {0} – {1} dəfə). Modulların jurnalları ayrıca yoxlanmalıdır.","General alarms were recorded on the power modules (most: Module {0} – {1} {1|time|times}). The module logs should be checked separately.","На силовых модулях зарегистрированы общие аварии (больше всего: модуль {0} – {1} {1|раз|раза|раз}). Журналы модулей нужно проверить отдельно.","Güç modüllerinde genel alarmlar kaydedildi (en çok: Modül {0} – {1} kez). Modül kayıtları ayrıca kontrol edilmelidir."],["Batareya boşalma statistikası mövcuddur (UPS sayğacı: {0} boşalma) – batareyaların daxili müqaviməti ölçülməli, avtonomiya testi aparılmalıdır.","Battery discharge statistics are available (UPS counter: {0} {0|discharge|discharges}) – battery internal resistance should be measured and a runtime test performed.","Имеется статистика разрядов батареи (счётчик ИБП: {0}) – необходимо измерить внутреннее сопротивление батарей и провести тест автономии.","Akü deşarj istatistiği mevcut (UPS sayacı: {0} deşarj) – akülerin iç direnci ölçülmeli, otonomi testi yapılmalıdır."],["<b>Batareyalar tam boşalıb</b> (batareya rejiminə keçiddən {0} sonra) – batareyaların tutumu və daxili müqaviməti yoxlanmalı, ehtiyat vaxtı yükə görə hesablanmalıdır.","<b>The batteries were fully discharged</b> ({0} after switching to battery mode) – battery capacity and internal resistance should be checked and the backup time calculated for the load.","<b>Батареи полностью разрядились</b> (через {0} после перехода на батарею) – необходимо проверить ёмкость и внутреннее сопротивление батарей и рассчитать время автономии для нагрузки.","<b>Aküler tamamen boşaldı</b> (akü moduna geçişten {0} sonra) – akülerin kapasitesi ve iç direnci kontrol edilmeli, yedekleme süresi yüke göre hesaplanmalıdır."],["Batareya testi {0} dəfə aparılıb – nəticələri UPS panelində yoxlanmalıdır.","A battery test was performed {0} {0|time|times} – the results should be checked on the UPS panel.","Тест батареи проводился {0} {0|раз|раза|раз} – результаты необходимо проверить на панели ИБП.","Akü testi {0} kez yapıldı – sonuçlar UPS panelinde kontrol edilmelidir."],["Batareya yoxlaması (Battery Check) {0} dəfə aparılıb – nəticələri UPS panelində yoxlanmalıdır.","A Battery Check was performed {0} {0|time|times} – the results should be checked on the UPS panel.","Проверка батареи (Battery Check) проводилась {0} {0|раз|раза|раз} – результаты необходимо проверить на панели ИБП.","Akü kontrolü (Battery Check) {0} kez yapıldı – sonuçlar UPS panelinde kontrol edilmelidir."],["UPS <b>komponentlərin xidmət müddətinin bitdiyini</b> bildirir ({0}) – batareyaların, DC kondensatorların, ventilyatorların dəyişdirilməsi üçün kommersiya təklifi hazırlanmalıdır.","The UPS reports that <b>component service life has expired</b> ({0}) – a commercial offer for replacing batteries, DC capacitors and fans should be prepared.","ИБП сообщает об <b>истечении срока службы компонентов</b> ({0}) – необходимо подготовить коммерческое предложение на замену батарей, DC-конденсаторов и вентиляторов.","UPS <b>bileşenlerin kullanım ömrünün dolduğunu</b> bildiriyor ({0}) – akülerin, DC kondansatörlerin ve fanların değişimi için ticari teklif hazırlanmalıdır."],["UPS {0} dəfə tam dayandırılıb – servis işləri olmayıbsa, səbəb araşdırılmalıdır.","The UPS was completely stopped {0} {0|time|times} – if this was not for service work, the cause should be investigated.","ИБП полностью останавливался {0} {0|раз|раза|раз} – если это не было связано с сервисными работами, причину необходимо выяснить.","UPS {0} kez tamamen durduruldu – servis çalışması değilse neden araştırılmalıdır."],["UPS hesabatı – {0}","UPS report – {0}","Отчёт ИБП – {0}","UPS raporu – {0}"],["{0} kritik, {1} diqqət, {2} məlumat","{0} critical, {1} attention, {2} info","критично: {0}, внимание: {1}, информация: {2}","{0} kritik, {1} dikkat, {2} bilgi"],["Ən uzun batareya rejimi dövrləri (ilk {0})","Longest battery mode periods (top {0})","Самые длительные периоды работы от батареи (первые {0})","En uzun akü modu dönemleri (ilk {0})"],["Modul {0}","Module {0}","Модуль {0}","Modül {0}"],["{0} dəfə · {1}","{0} {0|time|times} · {1}","{0} {0|раз|раза|раз} · {1}","{0} kez · {1}"],["PDF saxlanıldı: {0}","PDF saved: {0}","PDF сохранён: {0}","PDF kaydedildi: {0}"],["PDF yaradıla bilmədi: {0} – çap pəncərəsi açılır","PDF could not be created: {0} – opening the print dialog","Не удалось создать PDF: {0} – открывается окно печати","PDF oluşturulamadı: {0} – yazdırma penceresi açılıyor"],["Bu müddətdə batareya rejiminə keçid qeydə alınmamışdır.","No transfer to battery mode was recorded during this period.","За этот период переходов в режим батареи не зарегистрировано.","Bu dönemde akü moduna geçiş kaydedilmedi."],["Avadanlığın hazırkı vəziyyəti qənaətbəxş deyil və aşağıda göstərilən yoxlama işlərinin təxirə salınmadan aparılması tələb olunur.","The current condition of the equipment is unsatisfactory, and the checks listed below must be carried out without delay.","Текущее состояние оборудования неудовлетворительное, и перечисленные ниже проверки необходимо выполнить безотлагательно.","Ekipmanın mevcut durumu yetersizdir ve aşağıda belirtilen kontrollerin gecikmeden yapılması gerekir."],["Avadanlıq işləkdir, lakin aşağıda göstərilən məsələlər növbəti texniki xidmətdə yoxlanılmalıdır.","The equipment is operational, but the issues listed below should be checked at the next maintenance visit.","Оборудование работоспособно, однако перечисленные ниже вопросы следует проверить при ближайшем техобслуживании.","Ekipman çalışır durumdadır, ancak aşağıda belirtilen konular bir sonraki bakımda kontrol edilmelidir."],["Avadanlığın işində ciddi uyğunsuzluq aşkar edilməmişdir; planlı texniki xidmət davam etdirilməlidir.","No significant deviations were found in the equipment operation; scheduled maintenance should continue.","Существенных отклонений в работе оборудования не выявлено; плановое техобслуживание следует продолжать.","Ekipmanın çalışmasında ciddi bir uygunsuzluk tespit edilmedi; planlı bakıma devam edilmelidir."],["Batareya tutumunun azalması","Reduced battery capacity","Снижение ёмкости батарей","Akü kapasitesinde azalma"],["Batareya dövrəsi","Battery circuit","Цепь батарей","Akü devresi"],["UPS yüksək tutum göstərdiyi halda batareya gərginliyi sürətlə düşmüşdür","the battery voltage dropped rapidly while the UPS was showing a high capacity","напряжение батареи быстро падало, хотя ИБП показывал высокую ёмкость","UPS yüksek kapasite gösterirken akü gerilimi hızla düştü"],["UPS-in son batareya testi batareyaların dəyişdirilməsini tələb edir","the last UPS battery test calls for battery replacement","последний тест батареи ИБП требует замены батарей","UPS'in son akü testi akülerin değiştirilmesini gerektiriyor"],["UPS batareyaların xidmət müddətinin bitdiyini bildirir","the UPS reports that the battery service life has expired","ИБП сообщает об истечении срока службы батарей","UPS akülerin kullanım ömrünün dolduğunu bildiriyor"],["UPS batareyaların dəyişdirilməsini tələb edir","the UPS requests battery replacement","ИБП требует замены батарей","UPS akülerin değiştirilmesini istiyor"],["batareya testi uğursuz olmuşdur","the battery test failed","тест батареи не пройден","akü testi başarısız oldu"],["Batareya blokunun tutumunun azalması (köhnəlmə və ya zəif bloklar)","Reduced battery string capacity (ageing or weak blocks)","Снижение ёмкости батарейной сборки (старение или слабые блоки)","Akü grubunun kapasitesinde azalma (eskime veya zayıf bloklar)"],["Hər batareya blokunun daxili müqavimətini ölçmək və nominal dəyərlə müqayisə etmək","Measure the internal resistance of each battery block and compare it with the nominal value","Измерить внутреннее сопротивление каждого блока батарей и сравнить с номинальным значением","Her akü bloğunun iç direncini ölçmek ve nominal değerle karşılaştırmak"],["Blok gərginliklərini float rejimində və yük altında ölçmək; zəif blokları müəyyən etmək","Measure block voltages in float mode and under load; identify weak blocks","Измерить напряжения блоков в буферном режиме и под нагрузкой; выявить слабые блоки","Blok gerilimlerini tampon (float) modda ve yük altında ölçmek; zayıf blokları belirlemek"],["Batareya terminallarının sıxılmasını, korroziyanı və birləşdirici kabelləri yoxlamaq","Check battery terminal tightness, corrosion and interconnecting cables","Проверить затяжку клемм батарей, наличие коррозии и соединительные кабели","Akü terminallerinin sıkılığını, korozyonu ve bağlantı kablolarını kontrol etmek"],["Real yüklə avtonomiya (boşalma) testi aparmaq və ehtiyat vaxtını qeyd etmək","Perform a runtime (discharge) test with the real load and record the backup time","Провести тест автономии (разряд) на реальной нагрузке и зафиксировать время резерва","Gerçek yükle otonomi (deşarj) testi yapmak ve yedekleme süresini kaydetmek"],["Batareyaların istehsal / quraşdırma tarixini yoxlamaq","Check the battery manufacturing / installation date","Проверить дату изготовления / установки батарей","Akülerin üretim / montaj tarihini kontrol etmek"],["Batareyaların yaşı","Battery age","Возраст батарей","Akülerin yaşı"],["Batareya bloklarının daxili müqavimətini və gərginliklərini ölçmək","Measure the internal resistance and voltages of the battery blocks","Измерить внутреннее сопротивление и напряжения блоков батарей","Akü bloklarının iç direncini ve gerilimlerini ölçmek"],["Batareya rejimləri qeydə alınıb","Battery operation recorded","Зарегистрирована работа от батареи","Akü modu kaydedildi"],["Batareyaların yüksək temperaturda istismarı","Batteries operated at high temperature","Эксплуатация батарей при повышенной температуре","Akülerin yüksek sıcaklıkta çalıştırılması"],["Batareya temperaturu tövsiyə olunan həddən (20–25 °C) uzun müddət yüksək olmuşdur; bu, batareya ömrünü əhəmiyyətli dərəcədə qısaldır.","Battery temperature was above the recommended range (20–25 °C) for a long time; this significantly shortens battery life.","Температура батарей длительное время превышала рекомендуемую (20–25 °C); это существенно сокращает срок их службы.","Akü sıcaklığı uzun süre önerilen aralığın (20–25 °C) üzerinde kaldı; bu, akü ömrünü önemli ölçüde kısaltır."],["Batareya otağının / şkafının temperaturunu və kondisionerin işini yoxlamaq","Check the battery room / cabinet temperature and air-conditioner operation","Проверить температуру в аккумуляторной / шкафу и работу кондиционера","Akü odası / kabini sıcaklığını ve klimanın çalışmasını kontrol etmek"],["Batareya temperaturu","Battery temperature","Температура батарей","Akü sıcaklığı"],["Şarj qurğusu","Charger","Зарядное устройство","Şarj cihazı"],["Şarj qurğusu (charger) dövrəsində nasazlıq","Fault in the charger circuit","Неисправность цепи зарядного устройства","Şarj cihazı devresinde arıza"],["Jurnalda şarj qurğusu nasazlığı, şarj gərginliyinin maksimum həddə çatması və ya batareya gərginliyinin yüksəlməsi qeydə alınmışdır. Bu, şarj kartının nasazlığı və ya batareya zəncirində qırılma (açıq dövrə) ilə bağlı ola bilər.","The log shows a charger fault, the charge voltage reaching its maximum limit or a rise in battery voltage. This may be caused by a faulty charger board or a break (open circuit) in the battery string.","В журнале зарегистрированы неисправность зарядного устройства, достижение максимального напряжения заряда или рост напряжения батареи. Причиной может быть неисправность платы заряда или обрыв (разомкнутая цепь) в батарейной цепочке.","Kayıtta şarj cihazı arızası, şarj geriliminin maksimum sınıra ulaşması veya akü geriliminin yükselmesi görüldü. Bu, şarj kartı arızası veya akü dizisinde kopukluk (açık devre) ile ilgili olabilir."],["Şarj gərginliyini və cərəyanını ölçmək, ayarlanmış float/boost dəyərləri ilə müqayisə etmək","Measure charge voltage and current and compare with the configured float/boost values","Измерить напряжение и ток заряда и сравнить с заданными значениями float/boost","Şarj gerilimini ve akımını ölçmek, ayarlanmış float/boost değerleriyle karşılaştırmak"],["Batareya zəncirinin bütövlüyünü (qoruyucular, açar, ara kabellər) yoxlamaq","Check the integrity of the battery string (fuses, switch, interconnecting cables)","Проверить целостность батарейной цепочки (предохранители, выключатель, перемычки)","Akü dizisinin bütünlüğünü (sigortalar, şalter, ara kablolar) kontrol etmek"],["Batareya açarı / qoruyucu dövrəsində problem","Problem in the battery switch / fuse circuit","Проблема в цепи выключателя / предохранителей батареи","Akü şalteri / sigorta devresinde sorun"],["Servis işlərindən kənarda batareya dövrəsinin açılması (açar, qoruyucu və ya köməkçi kontakt) qeydə alınmışdır.","Opening of the battery circuit (switch, fuse or auxiliary contact) outside service work was recorded.","Зарегистрировано размыкание цепи батарей (выключатель, предохранитель или вспомогательный контакт) вне сервисных работ.","Servis çalışmaları dışında akü devresinin açılması (şalter, sigorta veya yardımcı kontak) kaydedildi."],["Batareya açarının (QF) kontaktlarını, köməkçi kontaktı və qoruyucuları yoxlamaq","Check the battery switch (QF) contacts, auxiliary contact and fuses","Проверить контакты выключателя батареи (QF), вспомогательный контакт и предохранители","Akü şalterinin (QF) kontaklarını, yardımcı kontağı ve sigortaları kontrol etmek"],["PFC nasazlığı","a PFC fault","неисправность PFC","PFC arızası"],["rektifikatorun işə düşməməsi","rectifier start failure","незапуск выпрямителя","doğrultucunun çalışmaması"],["giriş şəbəkəsi normal olduğu halda UPS-in batareyadan işləməsi","the UPS running on battery while the input mains was normal","работа ИБП от батареи при нормальной входной сети","giriş şebekesi normalken UPS'in aküden çalışması"],["giriş statik açarının nasazlığı","an input static switch fault","неисправность входного статического ключа","giriş statik anahtarı arızası"],["Rektifikator / PFC","Rectifier / PFC","Выпрямитель / PFC","Doğrultucu / PFC"],["Rektifikator / PFC blokunda nasazlıq","Fault in the rectifier / PFC section","Неисправность выпрямителя / PFC","Doğrultucu / PFC bölümünde arıza"],["rektifikatorla bağlı alarmlar","rectifier-related alarms","аварии, связанные с выпрямителем","doğrultucu ile ilgili alarmlar"],["Rektifikator giriş qoruyucularını, tiristor/IGBT modullarını və PFC kartını yoxlamaq","Check the rectifier input fuses, thyristor/IGBT modules and the PFC board","Проверить входные предохранители выпрямителя, тиристорные/IGBT-модули и плату PFC","Doğrultucu giriş sigortalarını, tristör/IGBT modüllerini ve PFC kartını kontrol etmek"],["DC bus-un qalxma (precharge) dövrəsini və ön yükləmə rezistorlarını yoxlamaq","Check the DC bus precharge circuit and precharge resistors","Проверить цепь предзаряда шины DC и резисторы предзаряда","DC bara ön şarj (precharge) devresini ve ön şarj dirençlerini kontrol etmek"],["İnvertor / bypass","Inverter / bypass","Инвертор / байпас","İnvertör / baypas"],["İnvertor nasazlıq səbəbindən dayanıb, yük bypass-da qalıb","Inverter stopped due to a fault, load left on bypass","Инвертор остановлен из-за неисправности, нагрузка осталась на байпасе","İnvertör arıza nedeniyle durdu, yük baypasta kaldı"],["İnvertorun qeyri-stabil işi (qısa müddətli bypass keçidləri)","Unstable inverter operation (short transfers to bypass)","Нестабильная работа инвертора (кратковременные переходы на байпас)","İnvertörün kararsız çalışması (kısa süreli baypas geçişleri)"],["Böyük nasazlıqdan sonra UPS invertor rejiminə qayıtmamış və yük uzun müddət qorunmadan bypass xəttindən qidalanmışdır.","After a major fault the UPS did not return to inverter mode and the load was supplied from the bypass line without protection for a long time.","После серьёзной неисправности ИБП не вернулся в режим инвертора, и нагрузка длительное время питалась от линии байпаса без защиты.","Büyük arızadan sonra UPS invertör moduna dönmedi ve yük uzun süre korumasız olarak baypas hattından beslendi."],["Qısa keçidlər adətən invertorun cərəyan həddinə çatması, yükün start cərəyanları və ya IGBT sürücü dövrələri ilə bağlı olur.","Short transfers are usually related to the inverter reaching its current limit, load inrush currents or IGBT driver circuits.","Кратковременные переходы обычно связаны с достижением инвертором предела тока, пусковыми токами нагрузки или цепями драйверов IGBT.","Kısa geçişler genellikle invertörün akım sınırına ulaşması, yükün kalkış akımları veya IGBT sürücü devreleri ile ilgilidir."],["UPS panelindən aktiv və son alarmları oxumaq, invertorun dayanma səbəbini müəyyən etmək","Read the active and recent alarms from the UPS panel and determine why the inverter stopped","Считать активные и последние аварии с панели ИБП и определить причину останова инвертора","UPS panelinden aktif ve son alarmları okumak, invertörün durma nedenini belirlemek"],["Çıxış cərəyanlarını və yükün start cərəyanlarını ölçmək (klemşə / analizator)","Measure output currents and load inrush currents (clamp meter / analyser)","Измерить выходные токи и пусковые токи нагрузки (токоизмерительные клещи / анализатор)","Çıkış akımlarını ve yükün kalkış akımlarını ölçmek (pens ampermetre / analizör)"],["İnvertor IGBT modullarını, sürücü kartlarını və çıxış kondensatorlarını vizual və ölçü ilə yoxlamaq","Inspect and measure the inverter IGBT modules, driver boards and output capacitors","Проверить визуально и измерениями IGBT-модули инвертора, платы драйверов и выходные конденсаторы","İnvertör IGBT modüllerini, sürücü kartlarını ve çıkış kondansatörlerini gözle ve ölçümle kontrol etmek"],["Nasazlıq aradan qaldırıldıqdan sonra yükü invertora qaytarmaq və bypass ↔ invertor keçid testini aparmaq","After clearing the fault, return the load to the inverter and perform a bypass ↔ inverter transfer test","После устранения неисправности вернуть нагрузку на инвертор и провести тест перехода байпас ↔ инвертор","Arıza giderildikten sonra yükü invertöre geri almak ve baypas ↔ invertör geçiş testi yapmak"]]),Ta.rows([["Yük qorunmur","Load not protected","Нагрузка не защищена","Yük korunmuyor"],["Yükün qidasız qalması halları","Cases of the load left unsupplied","Случаи потери питания нагрузки","Yükün beslemesiz kaldığı durumlar"],["Jurnalda UPS çıxışında yükün qidalanmadığı dövrlər var. Planlı söndürmə olmayıbsa, səbəb batareya boşalması, invertor nasazlığı və ya bypass xəttinin olmaması ola bilər.","The log shows periods when the load at the UPS output was not supplied. If there was no planned shutdown, the cause may be battery discharge, an inverter fault or an unavailable bypass line.","В журнале есть периоды, когда нагрузка на выходе ИБП не питалась. Если планового отключения не было, причиной может быть разряд батарей, неисправность инвертора или отсутствие линии байпаса.","Kayıtta UPS çıkışındaki yükün beslenmediği dönemler var. Planlı kapatma yapılmadıysa neden akü boşalması, invertör arızası veya baypas hattının olmaması olabilir."],["Yükün qidasız qaldığı tarixləri müştəri ilə dəqiqləşdirmək (planlı / plansız)","Clarify with the customer the dates when the load was unsupplied (planned / unplanned)","Уточнить у заказчика даты, когда нагрузка оставалась без питания (планово / внепланово)","Yükün beslemesiz kaldığı tarihleri müşteriyle netleştirmek (planlı / plansız)"],["Yükün qidasız qalması","Load left unsupplied","Потеря питания нагрузки","Yükün beslemesiz kalması"],["Güc blokunda (rektifikator / invertor) nasazlıq","Fault in the power section (rectifier / inverter)","Неисправность силовой части (выпрямитель / инвертор)","Güç bölümünde (doğrultucu / invertör) arıza"],["Jurnalda güc blokuna aid nasazlıq kodları qeydə alınmışdır:","The log contains fault codes related to the power section:","В журнале зарегистрированы коды неисправностей силовой части:","Kayıtta güç bölümüne ait arıza kodları görüldü:"],["IGBT modullarını, sürücü kartlarını və güc bloku qoruyucularını yoxlamaq","Check the IGBT modules, driver boards and power section fuses","Проверить IGBT-модули, платы драйверов и предохранители силовой части","IGBT modüllerini, sürücü kartlarını ve güç bölümü sigortalarını kontrol etmek"],["Güc bloku","Power section","Силовая часть","Güç bölümü"],["UPS yaddaşındakı son dayanma səbəblərini panel üzərindən oxumaq və hər birini araşdırmaq","Read the last stop reasons stored in the UPS memory from the panel and investigate each of them","Считать с панели причины последних остановов из памяти ИБП и разобрать каждую","UPS belleğindeki son durma nedenlerini panelden okumak ve her birini incelemek"],["Dayanma səbəbləri","Stop reasons","Причины остановов","Durma nedenleri"],["DC kondensatorlar","DC capacitors","DC-конденсаторы","DC kondansatörler"],["DC bus kondensatorlarının köhnəlməsi","Ageing of DC bus capacitors","Старение конденсаторов шины DC","DC bara kondansatörlerinin eskimesi"],["İş rejimində DC bus gərginliyinin kəskin düşməsi qeydə alınmışdır.","A sharp drop of DC bus voltage during operation was recorded.","Зарегистрировано резкое падение напряжения шины DC во время работы.","Çalışma sırasında DC bara geriliminde ani düşüş kaydedildi."],["DC bus-un müsbət və mənfi yarıları arasında disbalans qeydə alınmışdır.","An imbalance between the positive and negative halves of the DC bus was recorded.","Зарегистрирован дисбаланс между положительной и отрицательной половинами шины DC.","DC baranın pozitif ve negatif yarıları arasında dengesizlik kaydedildi."],["UPS DC kondensatorların xidmət müddətinin bitdiyini bildirir.","The UPS reports that the DC capacitor service life has expired.","ИБП сообщает об истечении срока службы DC-конденсаторов.","UPS DC kondansatörlerin kullanım ömrünün dolduğunu bildiriyor."],["DC bus kondensatorlarının tutumunu / ESR-ni ölçmək, şişkinlik və sızma olub-olmadığını yoxlamaq","Measure DC bus capacitor capacitance / ESR and check for bulging and leakage","Измерить ёмкость / ESR конденсаторов шины DC, проверить на вздутие и утечку","DC bara kondansatörlerinin kapasitesini / ESR'sini ölçmek, şişme ve sızıntı olup olmadığını kontrol etmek"],["DC bus gərginliyini (+/−) və pulsasiyasını ölçmək","Measure DC bus voltage (+/−) and ripple","Измерить напряжение шины DC (+/−) и пульсации","DC bara gerilimini (+/−) ve dalgalanmasını ölçmek"],["Soyutma","Cooling","Охлаждение","Soğutma"],["Soyutma sisteminin səmərəliliyinin azalması","Reduced cooling system efficiency","Снижение эффективности системы охлаждения","Soğutma sistemi veriminde azalma"],["UPS ventilyatorların xidmət müddətinin bitdiyini bildirir.","The UPS reports that the fan service life has expired.","ИБП сообщает об истечении срока службы вентиляторов.","UPS fanların kullanım ömrünün dolduğunu bildiriyor."],["Daxili temperaturlar xəbərdarlıq həddini aşmışdır.","Internal temperatures exceeded the warning limit.","Внутренние температуры превысили порог предупреждения.","Dahili sıcaklıklar uyarı sınırını aştı."],["Ventilyatorların işini, səsini və sürətini yoxlamaq; köhnəlmiş ventilyatorları dəyişmək","Check fan operation, noise and speed; replace worn fans","Проверить работу, шум и скорость вентиляторов; заменить изношенные","Fanların çalışmasını, sesini ve hızını kontrol etmek; eskimiş fanları değiştirmek"],["Hava filtrlərini və radiatorları tozdan təmizləmək","Clean air filters and heatsinks from dust","Очистить воздушные фильтры и радиаторы от пыли","Hava filtrelerini ve soğutucuları tozdan temizlemek"],["Güc bloklarını və klemləri termovizorla yoxlamaq","Check power modules and terminals with a thermal camera","Проверить силовые блоки и клеммы тепловизором","Güç bloklarını ve klemensleri termal kamera ile kontrol etmek"],["Faza itkisi","Phase loss","Пропадание фазы","Faz kaybı"],["Giriş fazalarından birinin itməsi / zəif kontakt","Loss of an input phase / poor contact","Пропадание одной из входных фаз / плохой контакт","Giriş fazlarından birinin kaybı / zayıf temas"],["Giriş gərginliklərində kəskin faza disbalansı və faza itkisi qeydə alınmışdır. Bu, adətən giriş avtomatında, klemlərdə və ya neytral xəttdə zəif kontaktla bağlı olur.","Severe phase imbalance and phase loss were recorded in the input voltages. This is usually caused by a poor contact in the input breaker, terminals or the neutral conductor.","Во входных напряжениях зарегистрированы сильный перекос и пропадание фазы. Обычно это связано с плохим контактом во входном автомате, клеммах или нейтрали.","Giriş gerilimlerinde ciddi faz dengesizliği ve faz kaybı kaydedildi. Bu genellikle giriş şalterinde, klemenslerde veya nötr hattında zayıf temastan kaynaklanır."],["Giriş avtomatının və klemlərin sıxılmasını, kontaktların vəziyyətini termovizorla yoxlamaq","Check tightness of the input breaker and terminals and the condition of contacts with a thermal camera","Проверить затяжку входного автомата и клемм, состояние контактов тепловизором","Giriş şalterinin ve klemenslerin sıkılığını, kontakların durumunu termal kamera ile kontrol etmek"],["Neytral–torpaq gərginliyini və neytral birləşmələrini yoxlamaq","Check neutral–earth voltage and neutral connections","Проверить напряжение нейтраль–земля и соединения нейтрали","Nötr–toprak gerilimini ve nötr bağlantılarını kontrol etmek"],["Şəbəkə keyfiyyəti","Mains quality","Качество сети","Şebeke kalitesi"],["Giriş şəbəkəsinin keyfiyyətinin aşağı olması","Poor input mains quality","Низкое качество входной сети","Giriş şebekesi kalitesinin düşük olması"],["Jurnalda bir neçə şəbəkə kəsintisi, gərginlik və tezliyin tolerans xaricinə çıxması qeydə alınmışdır.","The log shows several mains failures and voltage and frequency going out of tolerance.","В журнале зарегистрированы несколько отключений сети, выходы напряжения и частоты за допуск.","Kayıtta birkaç şebeke kesintisi, gerilim ve frekansın tolerans dışına çıkması görüldü."],["Jurnalda bir neçə şəbəkə kəsintisi qeydə alınmışdır.","The log shows several mains failures.","В журнале зарегистрированы несколько отключений сети.","Kayıtta birkaç şebeke kesintisi görüldü."],["Giriş şəbəkəsini analizatorla (24–48 saat) qeydə almaq: gərginlik, tezlik, harmoniklər, kəsintilər","Record the input mains with an analyser (24–48 h): voltage, frequency, harmonics, interruptions","Записать входную сеть анализатором (24–48 ч): напряжение, частота, гармоники, отключения","Giriş şebekesini analizörle kaydetmek (24–48 sa): gerilim, frekans, harmonikler, kesintiler"],["Generator varsa, onun gərginlik və tezlik tənzimlənməsini, ATS keçid parametrlərini yoxlamaq","If there is a generator, check its voltage and frequency regulation and the ATS transfer settings","При наличии генератора проверить регулировку его напряжения и частоты, параметры переключения АВР","Jeneratör varsa gerilim ve frekans ayarını, ATS geçiş parametrelerini kontrol etmek"],["Bypass xəttində gərginlik / sinxronizasiya problemi","Bypass line voltage / synchronisation problem","Проблема напряжения / синхронизации линии байпаса","Baypas hattında gerilim / senkronizasyon sorunu"],["Bypass şəbəkəsinin gərginliyi və ya tezliyi tolerans xaricinə çıxmış, bəzi hallarda invertor bypass ilə sinxronlaşa bilməmişdir. Bu vəziyyətdə nasazlıq olarsa, yük bypass-a ötürülə bilməz.","The bypass mains voltage or frequency went out of tolerance, and in some cases the inverter could not synchronise with bypass. If a fault occurs in this state, the load cannot be transferred to bypass.","Напряжение или частота сети байпаса выходили за допуск, в ряде случаев инвертор не мог синхронизироваться с байпасом. При неисправности в таком состоянии нагрузку невозможно перевести на байпас.","Baypas şebekesinin gerilimi veya frekansı tolerans dışına çıktı, bazı durumlarda invertör baypas ile senkronize olamadı. Bu durumda arıza olursa yük baypasa aktarılamaz."],["Bypass girişinin gərginliyini, qoruyucularını və faza ardıcıllığını yoxlamaq","Check the bypass input voltage, fuses and phase rotation","Проверить напряжение, предохранители и чередование фаз входа байпаса","Baypas girişinin gerilimini, sigortalarını ve faz sırasını kontrol etmek"],["Bypass tolerans parametrlərini (gərginlik/tezlik) yerli şəbəkəyə uyğunluğunu yoxlamaq","Check that the bypass tolerance settings (voltage/frequency) suit the local mains","Проверить соответствие допусков байпаса (напряжение/частота) местной сети","Baypas tolerans parametrelerinin (gerilim/frekans) yerel şebekeye uygunluğunu kontrol etmek"],["Güc modullarından birində nasazlıq","Fault in one of the power modules","Неисправность одного из силовых модулей","Güç modüllerinden birinde arıza"],["Güc modullarının ümumi alarmları və modulun işdən çıxması qeydə alınmışdır.","Power module general alarms and a module dropping out were recorded.","Зарегистрированы общие аварии силовых модулей и выход модуля из работы.","Güç modülü genel alarmları ve modülün devreden çıkması kaydedildi."],["Hər güc modulunun jurnalını ayrıca oxumaq, ən çox alarm verən modulu yoxlamaq","Read the log of each power module separately and check the module with the most alarms","Считать журнал каждого силового модуля отдельно и проверить модуль с наибольшим числом аварий","Her güç modülünün kaydını ayrı okumak, en çok alarm veren modülü kontrol etmek"],["Güc modulları","Power modules","Силовые модули","Güç modülleri"],["İdarəetmə","Control","Управление","Kontrol"],["İdarəetmə / daxili rabitə dövrələrində qeyri-stabillik","Instability in control / internal communication circuits","Нестабильность цепей управления / внутренней связи","Kontrol / dahili iletişim devrelerinde kararsızlık"],["Daxili rabitə xətaları, idarəetmə kartının itməsi və ya tez-tez yenidən başlama qeydə alınmışdır.","Internal communication errors, loss of the control board or frequent restarts were recorded.","Зарегистрированы ошибки внутренней связи, потеря платы управления или частые перезапуски.","Dahili iletişim hataları, kontrol kartının kaybolması veya sık yeniden başlatma kaydedildi."],["Daxili rabitə kabellərini və konnektorları yoxlamaq, idarəetmə qidasını ölçmək","Check internal communication cables and connectors, measure the control supply","Проверить кабели и разъёмы внутренней связи, измерить питание управления","Dahili iletişim kablolarını ve konnektörleri kontrol etmek, kontrol beslemesini ölçmek"],["Proşivka versiyalarını yoxlamaq, lazım olduqda yeniləmək","Check firmware versions and update if necessary","Проверить версии прошивки и при необходимости обновить","Yazılım (firmware) sürümlerini kontrol etmek, gerekirse güncellemek"],["UPS-in tarix/saat ayarını düzəltmək, RTC batareyasını yoxlamaq","Correct the UPS date/time setting and check the RTC battery","Исправить дату/время ИБП и проверить батарейку RTC","UPS tarih/saat ayarını düzeltmek, RTC pilini kontrol etmek"],["UPS-in həddən artıq yüklənməsi","UPS overload","Перегрузка ИБП","UPS'in aşırı yüklenmesi"],["Faza yüklərinin balanssız paylanması","Unbalanced distribution of phase loads","Несимметричное распределение нагрузки по фазам","Faz yüklerinin dengesiz dağılımı"],["Faza yükü nominal gücü aşmışdır.","Phase load exceeded the rated power.","Нагрузка фазы превысила номинальную мощность.","Faz yükü nominal gücü aştı."],["Fazalar arasında yük fərqi böyükdür.","The load difference between phases is large.","Разница нагрузки между фазами велика.","Fazlar arasındaki yük farkı büyük."],["Faza yüklərini klemşə ilə ölçmək və yükləri fazalar arasında bərabər paylamaq","Measure phase loads with a clamp meter and distribute the loads evenly across phases","Измерить нагрузку фаз токоизмерительными клещами и равномерно распределить нагрузку по фазам","Faz yüklerini pens ampermetreyle ölçmek ve yükleri fazlara eşit dağıtmak"],["Yük","Load","Нагрузка","Yük"],["Xidmət müddəti bitmiş komponentlərin (batareya, DC kondensator, ventilyator, qida kartı) siyahısını və dəyişdirilmə planını hazırlamaq","Prepare a list and replacement plan for components whose service life has expired (batteries, DC capacitors, fans, power supply board)","Подготовить перечень и план замены компонентов с истёкшим сроком службы (батареи, DC-конденсаторы, вентиляторы, плата питания)","Kullanım ömrü dolan bileşenlerin (akü, DC kondansatör, fan, besleme kartı) listesini ve değişim planını hazırlamak"],["Komponent resursu","Component service life","Ресурс компонентов","Bileşen ömrü"],["Profilaktik xidmət sayğacını yoxlamaq və xidmətdən sonra sıfırlamaq","Check the preventive maintenance counter and reset it after service","Проверить счётчик профилактического обслуживания и сбросить его после ТО","Önleyici bakım sayacını kontrol etmek ve bakımdan sonra sıfırlamak"],["Profilaktika","Preventive maintenance","Профилактика","Önl ],["Batareyada işləmə vaxtı","Time on battery","Время работы от батареи","Aküden çalışma süresi"],["Həddən artıq yük vaxtı","Time in overload","Время в перегрузке","Aşırı yük süresi"],["overload sayğacı","overload counter","счётчик перегрузки","aşırı yük sayacı"],["Bypass-da işləmə vaxtı","Time on bypass","Время работы на байпасе","Baypasta çalışma süresi"],["X oxu: jurnal qeydləri (zaman sırası ilə) · qırmızı işarələr – kritik hadisələr","X axis: log records (in time order) · red marks – critical events","Ось X: записи журнала (по времени) · красные метки – критические события","X ekseni: kayıt girdileri (zaman sırasıyla) · kırmızı işaretler – kritik olaylar"],["Giriş V (kəsilən an)","Input V (at failure)","Вход, В (в момент отключения)","Giriş V (kesinti anı)"],["Yük %","Load %","Нагрузка %","Yük %"],["Nəticə","Outcome","Итог","Sonuç"],["Batareya boşaldı","Battery discharged","Батарея разрядилась","Akü boşaldı"],["UPS söndü","UPS shut down","ИБП отключился","UPS kapandı"],["Şəbəkə bərpa olundu","Mains restored","Сеть восстановлена","Şebeke geri geldi"],["Məlum deyil","Unknown","Неизвестно","Bilinmiyor"],["Çıxış rejimi","Output mode","Режим выхода","Çıkış modu"],["Giriş V L1/L2/L3","Input V L1/L2/L3","Вход, В L1/L2/L3","Giriş V L1/L2/L3"],["Çıxış V","Output V","Выход, В","Çıkış V"],["Çıxış I (A)","Output I (A)","Выход I (А)","Çıkış I (A)"],["Bypass V","Bypass V","Байпас, В","Baypas V"],["DC bus +/−","DC bus +/−","Шина DC +/−","DC bara +/−"],["Bat. V / I","Batt. V / I","Бат. В / А","Akü V / I"],["Tutum %","Capacity %","Ёмкость %","Kapasite %"],["T maks °C","T max °C","T макс °C","T maks °C"],["Alarm","Alarm","Авария","Alarm"],["Bu kod Makelsan çevirmə nümunələrində olmayıb – mənası kontekstdən müəyyən edilib","This code was not in the Makelsan conversion samples – its meaning was determined from context","Этого кода не было в образцах конвертации Makelsan – значение определено по контексту","Bu kod Makelsan dönüşüm örneklerinde yoktu – anlamı bağlamdan belirlendi"],["Batareya testi heç vaxt aparılmayıb – <b>batareya testi aparılmalı</b> və batareyaların daxili müqaviməti ölçülməlidir.","A battery test has never been performed – <b>a battery test should be carried out</b> and the battery internal resistance measured.","Тест батареи ни разу не проводился – <b>необходимо провести тест батареи</b> и измерить внутреннее сопротивление батарей.","Akü testi hiç yapılmamış – <b>akü testi yapılmalı</b> ve akülerin iç direnci ölçülmelidir."],["UPS batareya tutumunu yüksək göstərdiyi halda gərginlik sürətlə düşüb – <b>zəif / nasaz batareya blokları</b> ehtimalı. Hər bloku ayrıca ölçün (gərginlik + daxili müqavimət), zəif blokları dəyişin.","The voltage dropped rapidly while the UPS was showing a high battery capacity – <b>weak / faulty battery blocks</b> are likely. Measure each block separately (voltage + internal resistance) and replace the weak ones.","Напряжение быстро падало, хотя ИБП показывал высокую ёмкость – вероятны <b>слабые / неисправные блоки батарей</b>. Измерьте каждый блок отдельно (напряжение + внутреннее сопротивление), слабые замените.","UPS yüksek akü kapasitesi gösterirken gerilim hızla düştü – <b>zayıf / arızalı akü blokları</b> olası. Her bloğu ayrı ölçün (gerilim + iç direnç), zayıf blokları değiştirin."],["Batareya rejimində “Battery Low” xəbərdarlığı olub – batareyaların ehtiyat vaxtı yoxlanmalıdır.","A “Battery Low” warning occurred in battery mode – the battery backup time should be checked.","В режиме батареи было предупреждение «Battery Low» – необходимо проверить время автономии батарей.","Akü modunda “Battery Low” uyarısı oluştu – akülerin yedekleme süresi kontrol edilmelidir."],["Batareyalar uzun müddət 30 °C-dən isti mühitdə işləyib – <b>batareya otağının soyudulması</b> təmin edilməlidir.","The batteries operated above 30 °C for a long time – <b>cooling of the battery room</b> should be ensured.","Батареи длительно работали при температуре выше 30 °C – необходимо обеспечить <b>охлаждение аккумуляторной</b>.","Aküler uzun süre 30 °C'nin üzerinde çalıştı – <b>akü odasının soğutması</b> sağlanmalıdır."],["Kritik nasazlıq kodları qeydə alınıb – <b>güc bloku (IGBT, sürücü kartları, DC kondensatorlar) diaqnostikası</b> aparılmalıdır.","Critical fault codes were recorded – <b>diagnostics of the power section (IGBTs, driver boards, DC capacitors)</b> should be carried out.","Зарегистрированы коды критических неисправностей – необходимо провести <b>диагностику силовой части (IGBT, платы драйверов, DC-конденсаторы)</b>.","Kritik arıza kodları kaydedildi – <b>güç bölümünün (IGBT, sürücü kartları, DC kondansatörler) teşhisi</b> yapılmalıdır."],["Girişdə faza itkisi / kəskin faza disbalansı qeydə alınıb – <b>giriş avtomatı, klemlər, neytral və kabel birləşmələri</b> yoxlanmalı, sıxılmalıdır.","Input phase loss / severe phase imbalance was recorded – <b>the input breaker, terminals, neutral and cable connections</b> should be checked and tightened.","Зарегистрированы пропадание фазы / сильный перекос фаз на входе – необходимо проверить и подтянуть <b>входной автомат, клеммы, нейтраль и кабельные соединения</b>.","Girişte faz kaybı / ciddi faz dengesizliği kaydedildi – <b>giriş şalteri, klemensler, nötr ve kablo bağlantıları</b> kontrol edilip sıkılmalıdır."],["Şəbəkə gərginliyi/tezliyi həddən kənara çıxıb – şəbəkə keyfiyyəti analizatorla (məs. Fluke) ölçülməsi tövsiyə olunur.","Mains voltage/frequency went out of limits – measuring the mains quality with an analyser (e.g. Fluke) is recommended.","Напряжение/частота сети выходили за пределы – рекомендуется измерить качество сети анализатором (напр. Fluke).","Şebeke gerilimi/frekansı sınırların dışına çıktı – şebeke kalitesinin analizörle (örn. Fluke) ölçülmesi önerilir."],["Bypass xəttində gərginlik problemləri var – bypass qoruyucuları və statik keçid (STS) yoxlanmalıdır.","There are voltage problems on the bypass line – bypass fuses and the static switch (STS) should be checked.","Есть проблемы с напряжением на линии байпаса – необходимо проверить предохранители байпаса и статический переключатель (STS).","Baypas hattında gerilim sorunları var – baypas sigortaları ve statik transfer anahtarı (STS) kontrol edilmelidir."],["Yüksək daxili temperatur qeydə alınıb – <b>ventilyatorlar, toz filtrləri və otağın kondisioneri</b> yoxlanmalıdır.","High internal temperature was recorded – <b>the fans, dust filters and room air conditioner</b> should be checked.","Зарегистрирована высокая внутренняя температура – необходимо проверить <b>вентиляторы, пылевые фильтры и кондиционер помещения</b>.","Yüksek dahili sıcaklık kaydedildi – <b>fanlar, toz filtreleri ve oda kliması</b> kontrol edilmelidir."],["DC bus +/− yarıları arasında disbalans var – DC kondensatorların tutumu və batareya yarımbloklarının gərginlikləri ölçülməlidir.","There is an imbalance between the DC bus +/− halves – the DC capacitor capacitance and the battery half-string voltages should be measured.","Есть дисбаланс между половинами шины DC +/− – необходимо измерить ёмкость DC-конденсаторов и напряжения полуцепочек батарей.","DC bara +/− yarıları arasında dengesizlik var – DC kondansatörlerin kapasitesi ve akü yarım gruplarının gerilimleri ölçülmelidir."],["Yük yüksəkdir – yükün azaldılması və ya güc ehtiyatının artırılması tövsiyə olunur.","The load is high – reducing the load or increasing the power reserve is recommended.","Нагрузка высокая – рекомендуется снизить нагрузку или увеличить запас мощности.","Yük yüksek – yükün azaltılması veya güç rezervinin artırılması önerilir."],["Fazalar arasında yük balanssızdır – yükü fazalar arasında bərabər paylayın.","The load is unbalanced between phases – distribute it evenly across the phases.","Нагрузка по фазам несимметрична – распределите её равномерно по фазам.","Yük fazlar arasında dengesiz – yükü fazlara eşit dağıtın."],["Qısa müddətdə çoxsaylı start / rektifikator start xətası var – idarəetmə qidası və rektifikator dövrəsi yoxlanmalıdır.","There are multiple starts / rectifier start errors within a short time – the control supply and the rectifier circuit should be checked.","За короткое время многократные пуски / ошибки пуска выпрямителя – необходимо проверить питание управления и цепь выпрямителя.","Kısa sürede çok sayıda başlatma / doğrultucu başlatma hatası var – kontrol beslemesi ve doğrultucu devresi kontrol edilmelidir."],["UPS saatı dəyişdirilib və ya sıfırlanıb – tarix/saat düzgün qurulmalı, RTC batareyası yoxlanmalıdır.","The UPS clock was changed or reset – the date/time should be set correctly and the RTC battery checked.","Часы ИБП были изменены или сброшены – необходимо правильно установить дату/время и проверить батарейку RTC.","UPS saati değiştirildi veya sıfırlandı – tarih/saat doğru ayarlanmalı, RTC pili kontrol edilmelidir."],["Giriş gərginliyi (V)","Input voltage (V)","Входное напряжение (В)","Giriş gerilimi (V)"],["Çıxış gərginliyi (V)","Output voltage (V)","Выходное напряжение (В)","Çıkış gerilimi (V)"],["Çıxış yükü (%)","Output load (%)","Нагрузка на выходе (%)","Çıkış yükü (%)"],["Çıxış cərəyanı (A)","Output current (A)","Выходной ток (А)","Çıkış akımı (A)"],["Daxili temperaturlar (°C)","Internal temperatures (°C)","Внутренние температуры (°C)","Dahili sıcaklıklar (°C)"],["radiator 70 °C","heatsink 70 °C","радиатор 70 °C","soğutucu 70 °C"],["DC bus gərginliyi (V)","DC bus voltage (V)","Напряжение шины DC (В)","DC bara gerilimi (V)"],["Batareya tutumu (%)","Battery capacity (%)","Ёмкость батареи (%)","Akü kapasitesi (%)"],["Batareya gərginliyi (V) və cərəyanı (A)","Battery voltage (V) and current (A)","Напряжение (В) и ток (А) батареи","Akü gerilimi (V) ve akımı (A)"],["Bat. V","Batt. V","Бат. В","Akü V"],["Bat. I ×10","Batt. I ×10","Бат. I ×10","Akü I ×10"],["Bypass gərginliyi (V)","Bypass voltage (V)","Напряжение байпаса (В)","Baypas gerilimi (V)"],["Hadisə kodlarının paylanması","Distribution of event codes","Распределение кодов событий","Olay kodlarının dağılımı"],["hesabat","report","otchet","rapor"],["jurnal","log","zhurnal","kayit"],["<b>{0}</b> oxuna bilmədi: {1}","<b>{0}</b> could not be read: {1}","Не удалось прочитать <b>{0}</b>: {1}","<b>{0}</b> okunamadı: {1}"],["test №{0}","test No. {0}","тест №{0}","test No. {0}"],["{0} blok × {1} Ah · float {2} V/blok · EOD {3} V/blok","{0} blocks × {1} Ah · float {2} V/block · EOD {3} V/block","{0} бл. × {1} Ач · float {2} В/блок · EOD {3} В/блок","{0} blok × {1} Ah · float {2} V/blok · EOD {3} V/blok"],["hər {0} gündən bir","every {0} {0|day|days}","каждые {0} {0|день|дня|дней}","her {0} günde bir"],["növbəti: {0}","next: {0}","следующий: {0}","sonraki: {0}"],["yaddaş tutumu ≈{0}","memory capacity ≈{0}","ёмкость памяти ≈{0}","bellek kapasitesi ≈{0}"],["format {0}","format {0}","формат {0}","format {0}"],["son: {0}","last: {0}","последнее: {0}","son: {0}"],["drossel maks.: {0} °C","choke max.: {0} °C","дроссель макс.: {0} °C","şok maks.: {0} °C"],["son qeyd: {0} °C","last record: {0} °C","последняя запись: {0} °C","son kayıt: {0} °C"],["≈ {0} il","≈ {0} years","≈ {0} лет","≈ {0} yıl"],["batareyadan {0} kWh enerji","{0} kWh drawn from battery","{0} кВт·ч от батареи","aküden {0} kWh enerji"],["konfiq. yazılma: {0}","config. writes: {0}","записей конфиг.: {0}","konfig. yazma: {0}"],["{0} hadisə · cəmi {1}","{0} {0|event|events} · total {1}","событий: {0} · всего {1}","{0} olay · toplam {1}"],["Son dayanma: {0}","Last stop: {0}","Последний останов: {0}","Son durma: {0}"],["<b>Batareyalar dəyişdirilməlidir</b> – UPS-in son batareya testi ({0}) “{1}” nəticəsi verib. Batareyaların daxili müqaviməti ölçülməli və dəyişdirmə planlaşdırılmalıdır.","<b>The batteries must be replaced</b> – the last UPS battery test ({0}) gave the result “{1}”. Battery internal resistance should be measured and the replacement planned.","<b>Батареи подлежат замене</b> – последний тест батареи ИБП ({0}) дал результат «{1}». Необходимо измерить внутреннее сопротивление батарей и запланировать замену.","<b>Aküler değiştirilmeli</b> – UPS'in son akü testi ({0}) “{1}” sonucunu verdi. Akülerin iç direnci ölçülmeli ve değişim planlanmalıdır."],["Batareya rejimində batareyalar <b>{0} dəfə tam boşalıb (End of Discharge)</b> və UPS dayanıb – ehtiyat vaxtı yük üçün yetərsizdir və ya batareyalar köhnəlib.","In battery mode the batteries <b>were fully discharged {0} {0|time|times} (End of Discharge)</b> and the UPS stopped – the backup time is insufficient for the load or the batteries have aged.","В режиме батареи батареи <b>{0} {0|раз|раза|раз} полностью разряжались (End of Discharge)</b> и ИБП останавливался – время автономии недостаточно для нагрузки либо батареи состарились.","Akü modunda aküler <b>{0} kez tamamen boşaldı (End of Discharge)</b> ve UPS durdu – yedekleme süresi yük için yetersiz veya aküler eskimiş."],["Çıxış gərginliyi <b>{0} dəfə</b> kəsilib. Hər bir halın planlı söndürmə olub-olmadığını müştəri ilə dəqiqləşdirin.","The output voltage was lost <b>{0} {0|time|times}</b>. Clarify with the customer whether each case was a planned shutdown.","Выходное напряжение пропадало <b>{0} {0|раз|раза|раз}</b>. Уточните у заказчика, было ли каждое отключение плановым.","Çıkış gerilimi <b>{0} kez</b> kesildi. Her durumun planlı kapatma olup olmadığını müşteriyle netleştirin."],["UPS yaddaşında dayanma səbəbləri var ({0}) – hər birinin səbəbi araşdırılmalıdır.","The UPS memory contains stop reasons ({0}) – the cause of each should be investigated.","В памяти ИБП есть причины остановов ({0}) – каждую необходимо разобрать.","UPS belleğinde durma nedenleri var ({0}) – her birinin nedeni araştırılmalıdır."],["Yük <b>{0} dəfə bypass-a</b> keçib (qorunmasız qida) – keçid səbəbləri (invertor dayanması, yüklənmə) yoxlanmalıdır.","The load <b>transferred to bypass {0} {0|time|times}</b> (unprotected supply) – the transfer causes (inverter stop, overload) should be checked.","Нагрузка <b>{0} {0|раз|раза|раз} переходила на байпас</b> (незащищённое питание) – необходимо проверить причины перехода (останов инвертора, перегрузка).","Yük <b>{0} kez baypasa</b> geçti (korumasız besleme) – geçiş nedenleri (invertör durması, aşırı yük) kontrol edilmelidir."],["Batareya temperaturu tarixçəsi (UPS sayğacı) · orta {0} °C","Battery temperature history (UPS counter) · average {0} °C","История температуры батареи (счётчик ИБП) · средняя {0} °C","Akü sıcaklık geçmişi (UPS sayacı) · ortalama {0} °C"],["Ən uzun şəbəkə kəsintiləri (ilk {0})","Longest mains failures (top {0})","Самые длительные отключения сети (первые {0})","En uzun şebeke kesintileri (ilk {0})"],["Son 1 ay","Last 1 month","Последний 1 месяц","Son 1 ay"],["Son 3 ay","Last 3 months","Последние 3 месяца","Son 3 ay"],["Son 6 ay","Last 6 months","Последние 6 месяцев","Son 6 ay"],["Son 1 il","Last 1 year","Последний 1 год","Son 1 yıl"],["Tarix aralığı…","Date range…","Диапазон дат…","Tarih aralığı…"],["📂 Fayl aç","📂 Open file","📂 Открыть файл","📂 Dosya aç"],["⚙ Ayarlar","⚙ Settings","⚙ Настройки","⚙ Ayarlar"],["🖨 Çap","🖨 Print","🖨 Печать","🖨 Yazdır"],["⬇ Excel (CSV)","⬇ Excel (CSV)","⬇ Excel (CSV)","⬇ Excel (CSV)"],["UPS jurnal faylını bura sürükləyin","Drag a UPS log file here","Перетащите сюда файл журнала ИБП","UPS kayıt dosyasını buraya sürükleyin"],["və ya yuxarıdakı <b>“Fayl aç”</b> düyməsini basın (bir neçə fayl seçmək olar)","or click the <b>“Open file”</b> button above (several files can be selected)","или нажмите кнопку <b>«Открыть файл»</b> вверху (можно выбрать несколько файлов)","veya yukarıdaki <b>“Dosya aç”</b> düğmesine basın (birden fazla dosya seçilebilir)"],["Fayl növü avtomatik tanınır. Fayllar kompüterdən kənara göndərilmir – bütün analiz lokal aparılır.","The file type is detected automatically. Files are not sent outside the computer – all analysis is done locally.","Тип файла определяется автоматически. Файлы не передаются за пределы компьютера – весь анализ выполняется локально.","Dosya türü otomatik tanınır. Dosyalar bilgisayar dışına gönderilmez – tüm analiz yerel olarak yapılır."],["“Son N ay” jurnalın son qeydindən geriyə hesablanır","“Last N months” is counted back from the last log record","«Последние N месяцев» отсчитываются от последней записи журнала","“Son N ay” kaydın son girdisinden geriye hesaplanır"],["Şirkət loqosu, adı və nümayəndə","Company logo, name and representative","Логотип, название компании и представитель","Şirket logosu, adı ve temsilci"],["Bütün sütunlarla, Makelsan proqramının formatında","With all columns, in the Makelsan software format","Со всеми столбцами, в формате программы Makelsan","Tüm sütunlarla, Makelsan yazılımı formatında"],["Dövr:","Period:","Период:","Dönem:"]]),Ta.rows([["Faylda ölçmə sessiyası tapılmadı.","No measurement session found in the file.","В файле не найден сеанс измерений.","Dosyada ölçüm oturumu bulunamadı."],["Faylda trend cədvəli tapılmadı.","No trend table found in the file.","В файле не найдена таблица трендов.","Dosyada trend tablosu bulunamadı."],["ölçmənin sonuna qədər","until the end of the measurement","до конца измерения","ölçümün sonuna kadar"],["Gərginlik kəsilməsi (< 10% Un)","Voltage interruption (< 10% Un)","Прерывание напряжения (< 10% Un)","Gerilim kesintisi (< %10 Un)"],["Gərginlik yalnız ölçmənin sonunda itib – bu, ölçmə kabellərinin ayrılması və ya avadanlığın söndürülməsi ola bilər. Bu dövr statistikaya daxil edilməyib.","Voltage was lost only at the end of the measurement – this may be disconnection of the test leads or switching off of the equipment. This period is excluded from the statistics.","Напряжение пропало только в конце измерения – это может быть отключение измерительных проводов или выключение оборудования. Этот период исключён из статистики.","Gerilim yalnızca ölçümün sonunda kayboldu – bu, ölçüm kablolarının sökülmesi veya ekipmanın kapatılması olabilir. Bu süre istatistiklere dahil edilmedi."],["Bütün fazalarda və ya bir fazada gərginlik nominalın 10%-indən aşağı düşüb – qida tamamilə kəsilib.","The voltage on one or all phases fell below 10% of nominal – the supply was completely interrupted.","Напряжение на одной или всех фазах упало ниже 10% от номинала – питание полностью прерывалось.","Bir veya tüm fazlarda gerilim nominalin %10'unun altına düştü – besleme tamamen kesildi."],["Gərginlik çökmələri (dip, < 90% Un)","Voltage dips (< 90% Un)","Провалы напряжения (< 90% Un)","Gerilim çökmeleri (dip, < %90 Un)"],["Gərginlik artımları (swell, > 110% Un)","Voltage swells (> 110% Un)","Перенапряжения (swell, > 110% Un)","Gerilim yükselmeleri (swell, > %110 Un)"],["Gərginlik nominaldan ±10%-dən çox sapır","Voltage deviates from nominal by more than ±10%","Напряжение отклоняется от номинала более чем на ±10%","Gerilim nominalden ±%10'dan fazla sapıyor"],["Cihazda nominal gərginlik ölçülən şəbəkəyə uyğun seçilməyib","The nominal voltage set on the instrument does not match the measured network","Номинальное напряжение в приборе не соответствует измеряемой сети","Cihazda seçilen nominal gerilim ölçülen şebekeye uygun değil"],["Neytral–torpaq (N–PE) gərginliyi yüksəkdir","High neutral–earth (N–PE) voltage","Высокое напряжение нейтраль–земля (N–PE)","Nötr–toprak (N–PE) gerilimi yüksek"],["Gərginliyin harmonik təhrifi (THD-U) yüksəkdir","High voltage harmonic distortion (THD-U)","Высокие гармонические искажения напряжения (THD-U)","Gerilim harmonik bozulması (THD-U) yüksek"],["EN 50160 üzrə THD-U 8%-dən az olmalıdır (10 dəqiqəlik orta qiymətlərin 95%-i). Qısa müddətli yüksək qiymətlər güclü qeyri-xətti yükün qoşulması anında mənbənin (transformator, generator, UPS) yüksək daxili müqavimətini göstərir.","Per EN 50160, THD-U should be below 8% (95% of 10-minute averages). Short-term high values indicate a high internal impedance of the source (transformer, generator, UPS) when a strong non-linear load is applied.","По EN 50160 THD-U должен быть менее 8% (95% 10-минутных средних). Кратковременные высокие значения указывают на высокое внутреннее сопротивление источника (трансформатор, генератор, ИБП) при подключении мощной нелинейной нагрузки.","EN 50160'a göre THD-U %8'in altında olmalıdır (10 dakikalık ortalamaların %95'i). Kısa süreli yüksek değerler, güçlü doğrusal olmayan yük devreye girdiğinde kaynağın (trafo, jeneratör, UPS) iç empedansının yüksek olduğunu gösterir."],["Cərəyanın harmonik təhrifi (THD-I) yüksəkdir","High current harmonic distortion (THD-I)","Высокие гармонические искажения тока (THD-I)","Akım harmonik bozulması (THD-I) yüksek"],["Yük qeyri-xəttidir (impuls qida blokları, düzləndiricilər, tezlik çeviriciləri). Harmonik cərəyanlar kabellərin, transformatorun və neytralın qızmasına, gərginlik təhrifinə səbəb olur.","The load is non-linear (switch-mode power supplies, rectifiers, frequency converters). Harmonic currents cause heating of cables, the transformer and the neutral, and voltage distortion.","Нагрузка нелинейная (импульсные блоки питания, выпрямители, частотные преобразователи). Гармонические токи вызывают нагрев кабелей, трансформатора и нейтрали, а также искажение напряжения.","Yük doğrusal değil (anahtarlamalı güç kaynakları, doğrultucular, frekans dönüştürücüler). Harmonik akımlar kabloların, trafonun ve nötrün ısınmasına, gerilim bozulmasına neden olur."],["Ayrı-ayrı gərginlik harmonikləri EN 50160 həddini aşır","Individual voltage harmonics exceed EN 50160 limits","Отдельные гармоники напряжения превышают пределы EN 50160","Tek tek gerilim harmonikleri EN 50160 sınırını aşıyor"],["Aşağıdakı harmoniklərin 95%-lik qiyməti EN 50160 həddindən yüksəkdir.","The 95th-percentile value of the following harmonics is above the EN 50160 limit.","95-процентное значение следующих гармоник выше предела EN 50160.","Aşağıdaki harmoniklerin %95'lik değeri EN 50160 sınırının üzerinde."],["Gərginlik disbalansı yüksəkdir","High voltage unbalance","Высокая несимметрия напряжения","Gerilim dengesizliği yüksek"],["EN 50160 üzrə mənfi ardıcıllıq gərginliyi 2%-dən az olmalıdır. Disbalans mühərriklərin qızmasına və UPS/düzləndiricilərin qeyri-bərabər yüklənməsinə səbəb olur.","Per EN 50160 the negative-sequence voltage should be below 2%. Unbalance causes motor heating and uneven loading of UPS units/rectifiers.","По EN 50160 напряжение обратной последовательности должно быть менее 2%. Несимметрия вызывает нагрев двигателей и неравномерную нагрузку ИБП/выпрямителей.","EN 50160'a göre negatif bileşen gerilimi %2'nin altında olmalıdır. Dengesizlik motorların ısınmasına ve UPS/doğrultucuların dengesiz yüklenmesine neden olur."],["Faza cərəyanları balanssızdır","Phase currents are unbalanced","Фазные токи несимметричны","Faz akımları dengesiz"],["Fazalar arasında orta cərəyan fərqi böyükdür – yükləri fazalar arasında yenidən paylamaq tövsiyə olunur.","The difference in average current between phases is large – redistributing the loads across phases is recommended.","Разница средних токов между фазами велика – рекомендуется перераспределить нагрузки по фазам.","Fazlar arasındaki ortalama akım farkı büyük – yüklerin fazlara yeniden dağıtılması önerilir."],["Neytral cərəyanı yüksəkdir","High neutral current","Высокий ток нейтрали","Nötr akımı yüksek"],["Neytral cərəyanı faza cərəyanlarının yarısından çoxdur – 3-cü harmonik (və onun qatları) və faza disbalansı neytralı yükləyir. Neytral kəsiyini və birləşmələrini yoxlayın.","The neutral current exceeds half of the phase currents – the 3rd harmonic (and its multiples) and phase unbalance load the neutral. Check the neutral cross-section and connections.","Ток нейтрали превышает половину фазных токов – 3-я гармоника (и кратные ей) и несимметрия фаз нагружают нейтраль. Проверьте сечение и соединения нейтрали.","Nötr akımı faz akımlarının yarısından fazla – 3. harmonik (ve katları) ile faz dengesizliği nötrü yüklüyor. Nötr kesitini ve bağlantılarını kontrol edin."],["Tezlik ±1% həddindən kənara çıxıb","Frequency went outside ±1%","Частота выходила за пределы ±1%","Frekans ±%1 sınırının dışına çıktı"],["Güc əmsalı aşağıdır","Low power factor","Низкий коэффициент мощности","Güç faktörü düşük"],["Yük altında ümumi güc əmsalı 0,9-dan azdır – reaktiv və harmonik güc kabelləri və mənbəni əlavə yükləyir.","The total power factor under load is below 0.9 – reactive and harmonic power place additional load on cables and the source.","Общий коэффициент мощности под нагрузкой ниже 0,9 – реактивная и гармоническая мощность дополнительно нагружают кабели и источник.","Yük altında toplam güç faktörü 0,9'un altında – reaktif ve harmonik güç kabloları ve kaynağı ek olarak yüklüyor."],["İmpulslu yük: qısa müddətli cərəyan sıçrayışları","Pulsed load: short current surges","Импульсная нагрузка: кратковременные броски тока","Darbeli yük: kısa süreli akım sıçramaları"],["Flikker (Pst) 1-dən yüksəkdir","Flicker (Pst) above 1","Фликер (Pst) выше 1","Fliker (Pst) 1'in üzerinde"],["Qısamüddətli flikker göstəricisi Pst > 1 olub. Səbəb adətən böyük, tez-tez dəyişən yüklərdir. İşarələnmiş (kəsilmə/dip olan) intervallarda qiymət etibarsız sayılır.","The short-term flicker severity Pst exceeded 1. This is usually caused by large, rapidly changing loads. Values in flagged intervals (with interruptions/dips) are considered unreliable.","Кратковременная доза фликера Pst превышала 1. Обычно причина – мощные, быстро меняющиеся нагрузки. Значения в помеченных интервалах (с прерываниями/провалами) считаются недостоверными.","Kısa süreli fliker şiddeti Pst 1'i aştı. Neden genellikle büyük ve hızla değişen yüklerdir. İşaretlenmiş (kesinti/çökme içeren) aralıklardaki değerler güvenilmez sayılır."],["(işarələnmiş interval)","(flagged interval)","(помеченный интервал)","(işaretlenmiş aralık)"],["Gərginlik çökməsi (dip)","Voltage dip","Провал напряжения","Gerilim çökmesi (dip)"],["Gərginlik artımı (swell)","Voltage swell","Перенапряжение (swell)","Gerilim yükselmesi (swell)"],["Gərginlik kəsilməsi","Voltage interruption","Прерывание напряжения","Gerilim kesintisi"],["Keçid prosesi (tranzient)","Transient","Переходный процесс (импульс)","Geçici olay (transient)"],["Sürətli gərginlik dəyişməsi (RVC)","Rapid voltage change (RVC)","Быстрое изменение напряжения (RVC)","Hızlı gerilim değişimi (RVC)"],["Başlanğıc cərəyanı (inrush)","Inrush current","Пусковой ток (inrush)","Kalkış akımı (inrush)"],["Dalğa forması hadisəsi","Waveform event","Событие формы волны","Dalga şekli olayı"],["{0} ms","{0} ms","{0} мс","{0} ms"],["maks. {0} V","max. {0} V","макс. {0} В","maks. {0} V"],["minimum {0} V","minimum {0} V","минимум {0} В","minimum {0} V"],["Faza gərginliyi {0} V-dan aşağı düşüb. Çökmələr həssas avadanlığın (tibbi, İT) yenidən başlamasına və ya nasazlığına səbəb ola bilər.","The phase voltage fell below {0} V. Dips can cause sensitive equipment (medical, IT) to restart or malfunction.","Фазное напряжение опускалось ниже {0} В. Провалы могут приводить к перезапуску или сбоям чувствительного оборудования (медицинского, ИТ).","Faz gerilimi {0} V'un altına düştü. Çökmeler hassas ekipmanın (tıbbi, BT) yeniden başlamasına veya arızalanmasına neden olabilir."],["Faza gərginliyi {0} V-dan yuxarı qalxıb.","The phase voltage rose above {0} V.","Фазное напряжение поднималось выше {0} В.","Faz gerilimi {0} V'un üzerine çıktı."],["Ölçmə müddətinin 5%-dən çoxunda faza gərginliyi {0} V ±10% həddindən kənarda olub (EN 50160).","For more than 5% of the measurement time the phase voltage was outside {0} V ±10% (EN 50160).","Более 5% времени измерения фазное напряжение было вне пределов {0} В ±10% (EN 50160).","Ölçüm süresinin %5'inden fazlasında faz gerilimi {0} V ±%10 sınırının dışındaydı (EN 50160)."],["{0}: 5% – {1} V, 95% – {2} V","{0}: 5% – {1} V, 95% – {2} V","{0}: 5% – {1} В, 95% – {2} В","{0}: %5 – {1} V, %95 – {2} V"],["Fluke-da nominal gərginlik {0} V seçilib, ölçülən faza–neytral gərginliyi isə ~{1} V-dur. Cihazın öz hadisə qeydləri və EN 50160 hesabatı bu nominala görə aparıldığından yanlış ola bilər (məs. bütün ölçmə “dip” kimi qeydə alınır). Bu hesabatda qiymətləndirmə {2} V (L–N) / {3} V (L–L) nominalı ilə aparılıb.","The Fluke was set to a nominal voltage of {0} V while the measured phase–neutral voltage is ~{1} V. The instrument's own event log and EN 50160 evaluation are based on this nominal and may therefore be wrong (e.g. the whole measurement is recorded as a “dip”). In this report the evaluation uses a nominal of {2} V (L–N) / {3} V (L–L).","В приборе Fluke задано номинальное напряжение {0} В, а измеренное фазное напряжение ~{1} В. Собственные события прибора и оценка EN 50160 рассчитаны по этому номиналу и поэтому могут быть ошибочными (например, всё измерение записано как «провал»). В этом отчёте оценка выполнена для номинала {2} В (L–N) / {3} В (L–L).","Fluke'ta nominal gerilim {0} V seçilmiş, ölçülen faz–nötr gerilimi ise ~{1} V. Cihazın kendi olay kayıtları ve EN 50160 değerlendirmesi bu nominale göre yapıldığından hatalı olabilir (örn. tüm ölçüm “dip” olarak kaydedilir). Bu raporda değerlendirme {2} V (L–N) / {3} V (L–L) nominaline göre yapılmıştır."],["Cihazın hadisə siyahısında {0} qeyd var; onların bir hissəsi bu səbəbdən yalnış ola bilər.","The instrument's event list contains {0} {0|entry|entries}; some of them may be wrong for this reason.","В списке событий прибора записей: {0}; часть из них по этой причине может быть ошибочной.","Cihazın olay listesinde {0} kayıt var; bunların bir kısmı bu nedenle hatalı olabilir."],["N–PE gərginliyi orta {0} V, maks. {1} V olub. Həssas avadanlıq (KT, MRT, laboratoriya, server) üçün adətən 1–2 V-dan az olması tələb olunur. Səbəb: neytralın yüklənməsi, zəif neytral birləşməsi, neytral və torpağın düzgün olmayan birləşdirilməsi və ya torpaqlama müqavimətinin yüksək olması.","The N–PE voltage averaged {0} V, max. {1} V. Sensitive equipment (CT, MRI, laboratory, servers) usually requires less than 1–2 V. Causes: loaded neutral, poor neutral connection, incorrect neutral–earth bonding or high earthing resistance.","Напряжение N–PE в среднем {0} В, макс. {1} В. Для чувствительного оборудования (КТ, МРТ, лаборатории, серверы) обычно требуется менее 1–2 В. Причины: нагруженная нейтраль, плохое соединение нейтрали, неправильное соединение нейт
