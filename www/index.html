<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UPS Servis Jurnalı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Roboto+Condensed:wght@500;700&family=Roboto+Mono:wght@500&display=swap">
<style>
/* Layout: field-instrument app — sticky header, horizontal section tabs, one column of form cards; report renders as a white A4 sheet */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface2:#E2E8E5; --ink:#15201D; --muted:#5A6964; --line:#C9D3CF;
  --accent:#0E6A5B; --accent-ink:#FFFFFF; --accent-soft:#D4EAE5;
  --ok:#23704A; --ok-bg:#DAF0E2; --warn:#7F5A00; --warn-bg:#FAEDC4; --bad:#AE2014; --bad-bg:#FADDD8; --idle:#8A9893;
  --paper:#FFFFFF; --paper-ink:#1B1F1E; --paper-line:#B9C2BF; --paper-head:#123B35; --paper-soft:#E6EEEB;
  --f-body:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-num:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#18201D; --surface2:#222C29; --ink:#E3EBE7; --muted:#93A29D; --line:#303C38;
  --accent:#43B9A2; --accent-ink:#04201A; --accent-soft:#173A33;
  --ok:#74D39C; --ok-bg:#173327; --warn:#F0C45E; --warn-bg:#3A2F12; --bad:#FF8E7E; --bad-bg:#3E1D19; --idle:#6F7E79;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18201D; --surface2:#222C29; --ink:#E3EBE7; --muted:#93A29D; --line:#303C38;
  --accent:#43B9A2; --accent-ink:#04201A; --accent-soft:#173A33;
  --ok:#74D39C; --ok-bg:#173327; --warn:#F0C45E; --warn-bg:#3A2F12; --bad:#FF8E7E; --bad-bg:#3E1D19; --idle:#6F7E79;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
.cols2{display:grid;gap:0 16px}
.col{min-width:0}
@media (min-width:1000px){.wrap,header.top .bar,header.top .tabs{max-width:1120px}.cols2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.cols2 .col>.card:first-child{margin-top:0}}
.drop{display:grid;place-items:center;border:2px dashed var(--line);border-radius:var(--r);padding:20px 12px;text-align:center;cursor:pointer;background:var(--bg);color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop b{color:var(--accent)}
.maptbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.maptbl table{border-collapse:collapse;width:100%;font-size:12px}
.maptbl th,.maptbl td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
.maptbl th{background:var(--surface2);position:sticky;top:0}
.maptbl td.num{font-family:var(--f-num)}
.fsum{display:flex;gap:8px;flex-wrap:wrap}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .bar{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font:700 20px/1 var(--f-disp);letter-spacing:.02em;text-transform:uppercase;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font:500 12px/1.3 var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis}
.save{font-size:12px;color:var(--muted);white-space:nowrap}
.sync{font-size:12px;font-weight:600;white-space:nowrap;color:var(--muted)}.sync.ok{color:var(--ok)}.sync.warn{color:var(--warn)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:42px}
.btn:focus-visible,.tab:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible,.rcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 12px 8px;max-width:760px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;padding:8px 12px;border-radius:20px;font:600 14px/1 var(--f-disp);letter-spacing:.03em;text-transform:uppercase;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
.tab .n{font:500 11px var(--f-num);opacity:.7}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
h2.sec{font:700 22px/1.15 var(--f-disp);text-transform:uppercase;letter-spacing:.02em;margin:22px 0 4px;text-wrap:balance}
p.hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;margin-bottom:12px}
.card h3{margin:0;font:700 15px/1.2 var(--f-disp);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:440px){.grid2{grid-template-columns:1fr}}
label.f{display:grid;gap:4px;min-width:0}
label.f>span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
input,select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 11px;min-height:44px}
textarea{min-height:84px;resize:vertical}
input.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip:empty{display:none}
/* measurement rows */
.mrow{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0;padding-top:0}
.mhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mhead b{flex:1;min-width:0;font-weight:600}
.mhead .norm{font:500 12px var(--f-num);color:var(--muted)}
.lim{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.lim input{min-height:34px;padding:5px 8px;width:84px}
details.more summary{cursor:pointer;font-size:12px;color:var(--accent);font-weight:600;list-style:none}
details.more summary::-webkit-details-marker{display:none}
/* checklist */
.citem{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.citem:first-of-type{border-top:0;padding-top:0}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 6px;font-size:13px;font-weight:600;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"].s-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.seg button[aria-pressed="true"].s-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.seg button[aria-pressed="true"].s-bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.seg button[aria-pressed="true"].s-idle{background:var(--surface2);color:var(--ink);border-color:var(--ink)}
/* battery fast entry */
.probe{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.probe .lbl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.probe .tag{font:700 34px/1 var(--f-disp);letter-spacing:.02em}
.probe .pos{font:500 13px var(--f-num);opacity:.75}
.probe input{background:var(--bg);color:var(--ink);border-color:transparent;font:500 22px var(--f-num);text-align:center;min-height:54px}
.probe label.f>span{color:var(--bg);opacity:.75}
.probe .row{display:flex;gap:8px}
.probe .row .btn{flex:1}
.probe .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.probe .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.strings{display:grid;gap:10px}
.sline{display:grid;gap:6px}
.sline .sl{font:700 12px var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px}
.cell{border:0;border-radius:6px;min-height:34px;font:500 11px var(--f-num);background:var(--surface2);color:var(--muted);cursor:pointer;padding:0}
.cell.ok{background:var(--ok-bg);color:var(--ok)} .cell.warn{background:var(--warn-bg);color:var(--warn)} .cell.bad{background:var(--bad-bg);color:var(--bad);font-weight:700}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:8px;padding:10px}
.stat b{display:block;font:500 20px var(--f-num);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);font-weight:600}
.stat.ok b{color:var(--ok)} .stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)}
/* home list */
.rlist{display:grid;gap:10px}
.rcard{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer}
.rcard .t{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard .m{grid-column:1/-1;color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
.rcard .no{font-family:var(--f-num);font-size:12px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;display:grid;gap:12px;justify-items:start}
.empty h3{margin:0;font:700 20px var(--f-disp);text-transform:uppercase}
.verdict{border-radius:var(--r);padding:14px;font:700 18px/1.2 var(--f-disp);letter-spacing:.03em;text-transform:uppercase}
.verdict.ok{background:var(--ok-bg);color:var(--ok)} .verdict.warn{background:var(--warn-bg);color:var(--warn)} .verdict.bad{background:var(--bad-bg);color:var(--bad)}
.verdict small{display:block;font:500 13px/1.4 var(--f-body);text-transform:none;letter-spacing:0;margin-top:6px;color:var(--ink)}
ul.concl{margin:0;padding-left:18px;display:grid;gap:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.nextbar{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
.note{font-size:12px;color:var(--muted)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:12px}
.prow{display:grid;grid-template-columns:2fr 1.2fr .7fr auto;gap:6px;align-items:end}
@media (max-width:440px){.prow{grid-template-columns:1fr 1fr}.prow .wide{grid-column:1/-1}}
/* report paper — deliberately fixed light document look */
.paperwrap{overflow:hidden;border-radius:6px;border:1px solid var(--line);background:var(--paper)}
.paperscale{transform-origin:0 0}
.paper{width:733px;background:var(--paper);color:var(--paper-ink);font:11px/1.4 var(--f-body);padding:4px 2px}
.paper .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--paper-head);padding-bottom:6px}
.paper .logo{height:52px;width:auto;display:block;margin-bottom:2px}
.paper .co{font:700 18px var(--f-disp);color:var(--paper-head);text-transform:uppercase}
.paper .coi{font-size:9.5px;color:#55605C}
.paper .meta{text-align:right;font-size:10.5px}
.paper h1{font:700 19px var(--f-disp);text-align:center;margin:14px 0 2px;color:var(--paper-head);letter-spacing:.04em}
.paper .sub{text-align:center;color:#55605C;font-style:italic;margin-bottom:10px}
.paper .ov{display:flex;justify-content:center;align-items:center;gap:10px;margin:6px 0 10px}
.paper .ov b{padding:5px 14px;border-radius:3px;font:700 13px var(--f-disp);letter-spacing:.04em}
.paper h4{background:var(--paper-head);color:#fff;margin:12px 0 0;padding:4px 7px;font:700 11.5px var(--f-disp);letter-spacing:.06em;text-transform:uppercase}
.paper table{width:100%;border-collapse:collapse}
.paper td,.paper th{border:1px solid var(--paper-line);padding:3px 5px;vertical-align:top}
.paper th{background:var(--paper-soft);font-weight:700;text-align:center}
.paper td.k{background:var(--paper-soft);font-weight:700;width:17%}
.paper td.c{text-align:center}
.paper .num{font-family:var(--f-num);font-size:10px}
.paper .p-ok{background:#D7EFDF;color:#1D6A43} .paper .p-warn{background:#FAEDC4;color:#7A5600} .paper .p-bad{background:#F8D3CD;color:#A01E12;font-weight:700}
.paper ul{margin:6px 0;padding-left:16px}
.paper li{margin-bottom:3px}
.paper .sigwrap{break-inside:avoid;page-break-inside:avoid;margin-top:14px}
.paper .sig{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:22px}
.paper .sig div{display:grid;gap:14px}
.paper .small{font-size:9px;color:#55605C}
.paper .bt td{font-size:8.5px;padding:2px 3px;text-align:center;font-family:var(--f-num)}
.langseg{flex:0 0 auto}.langseg button{flex:0 0 auto;min-width:46px}
.paper .rchart-legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:4px 0 2px;font-size:10px}
.paper .rchart-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.paper .rchart-box{border:1px solid var(--paper-line);padding:4px 6px 0;margin-top:6px;break-inside:avoid;page-break-inside:avoid}
.paper .rchart-title{display:flex;justify-content:space-between;gap:10px;font-size:10px}
.paper .rchart{display:block;max-width:100%;height:auto}
.remind{border-color:var(--warn);background:var(--warn-bg)}
.remind h3{color:var(--warn)}
.rrow{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.pb{break-before:page;page-break-before:always}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand" id="hTitle">UPS Servis Jurnalı<small id="hSub">Servis hesabatları</small></div>
    <span class="save" id="saveState"></span><span class="sync" id="syncState"></span>
    <button class="btn sm ghost" id="hBack" hidden>← Siyahı</button>
    <button class="btn sm ghost" id="hSettings">Ayarlar</button>
  </div>
  <nav class="tabs" id="tabs" hidden role="tablist"></nav>
</header>
<main class="wrap" id="main"></main>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="lib/html2pdf.bundle.min.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script>
"use strict";
/* ---------------- constants ---------------- */
const MEAS=[
 ["Giriş gərginliyi (F–N)","V",207,253,3],["Giriş gərginliyi (F–F)","V",360,440,3],["Giriş cərəyanı","A",null,null,3],
 ["Giriş tezliyi","Hz",49.5,50.5,1],["Bypass gərginliyi (F–N)","V",207,253,3],["Çıxış gərginliyi (F–N)","V",225,235,3],
 ["Çıxış cərəyanı","A",null,null,3],["Çıxış tezliyi","Hz",49.9,50.1,1],["Yük səviyyəsi","%",0,80,3],
 ["Çıxış aktiv gücü","kW",null,null,1],["DC şin gərginliyi","V",null,null,1],["Akkumulyator ümumi gərginliyi","V",null,null,1],
 ["Akkumulyator şarj cərəyanı","A",null,null,1],["Neytral–Yer gərginliyi (N–PE)","V",0,3,1],["Otaq temperaturu","°C",15,25,1],
 ["UPS daxili temperatur","°C",null,40,1]];
const IDX_LOAD=8, IDX_ROOM=14;
const CHK=["UPS-in ümumi vizual vəziyyəti","Ekran / panel göstəriciləri və alarmlar","Hadisə jurnalı (event log)","Soyutma ventilyatorları","Hava filtrləri","Güc kabelləri və klemmələr (bərkidilmə)","Termal yoxlama (termokamera)","DC kondensatorlar (şişmə / axma)","AC filtr kondensatorları","Rektifikator / şarj bloku","İnvertor bloku","Statik bypass","Bypass-a keçid və geri qayıdış testi","Akkumulyator kabineti / rəfi və bağlantılar","Akkumulyator açarı / qoruyucular","EPO (təcili söndürmə) funksiyası","Rabitə (SNMP / Modbus / quru kontaktlar)","Otaq şəraiti (temperatur, toz, havalandırma)"];
const CHK_OPTS=[["Yaxşı","s-ok"],["Qeyd var","s-warn"],["Nasaz","s-bad"],["Yoxlanılmadı","s-idle"],["Tətbiq olunmur","s-idle"]];
const WORKS=["Daxili və xarici təmizlik (tozun təmizlənməsi)","Ventilyatorların yoxlanılması / dəyişdirilməsi","Güc klemmələrinin bərkidilməsi","Parametrlərin və kalibrovkanın yoxlanılması","Proqram təminatının (firmware) yenilənməsi","Hadisə jurnalının oxunması və təhlili","Akkumulyatorların gərginlik və daxili müqavimət ölçümü","Akkumulyator boşalma (avtonomluq) testi","Bypass keçid testi","Hava filtrlərinin təmizlənməsi / dəyişdirilməsi"];
const SVC_TYPES=["Planlı profilaktik servis","Qəza çağırışı","Quraşdırma / işə salma","Akkumulyator testi","Təmir"];
const TOPO=["Online (ikiqat çevirmə)","Line-interactive","Offline / Standby","Modul tipli online"];
const PHASE=["3/3","3/1","1/1"];
const BTYPE=["VRLA AGM","VRLA Gel","Açıq tip (flooded)","Li-ion","NiCd"];
const DIS=["Uğurlu","Uğursuz","Aparılmadı"];
const MAXB=480;
const TABS=[["svc","Servis"],["ups","UPS"],["meas","Ölçmə"],["chk","Yoxlama"],["work","İşlər"],["bat","Akkum."],["blk","Bloklar"],["rep","Hesabat"]];

/* ---------------- helpers ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=x=>{if(x===null||x===undefined||x==="")return null;const n=parseFloat(String(x).replace(",","."));return Number.isFinite(n)?n:null};
const fmt=(n,d=2)=>n===null||n===undefined||!Number.isFinite(n)?"—":n.toFixed(d);
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtDate=iso=>{if(!iso)return "";const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);return m?`${m[3]}.${m[2]}.${m[1]}`:iso};
function addMonths(iso,n){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||"");if(!m||!Number.isFinite(n))return "";const y=+m[1],mo=+m[2]-1+n,d=+m[3];
  const last=new Date(y,mo+1,0).getDate();const dt=new Date(y,mo,Math.min(d,last));
  return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0")}
function yearsBetween(a,b){const pa=Date.parse(a),pb=Date.parse(b);if(!Number.isFinite(pa)||!Number.isFinite(pb))return null;return Math.round((pb-pa)/864e5/365.25*10)/10}
function getP(o,p){return p.split(".").reduce((a,k)=>a==null?a:a[k],o)}
function setP(o,p,v){const ks=p.split(".");let a=o;for(let i=0;i<ks.length-1;i++){if(a[ks[i]]==null)a[ks[i]]={};a=a[ks[i]]}a[ks[ks.length-1]]=v}
function median(a){if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),h=s.length>>1;return s.length%2?s[h]:(s[h-1]+s[h])/2}

function normalize(r){const b=blankReport(state.settings);
  const out=Object.assign(b,r);["svc","cl","ups","bat","dis"].forEach(k=>out[k]=Object.assign(blankReport(state.settings)[k],r[k]||{}));

function concl(r,a,L){const T=CT[L]||CT.az,n=x=>tl(L,x),C=[];
  const anyMeas=r.meas.some(m=>m.v.some(x=>num(x)!==null));
  if(anyMeas)C.push(a.out.length?T.measOut(a.out.map(n).join("; ")):T.measOk);
  if(a.nasaz.length)C.push(T.nasaz(a.nasaz.map(n).join("; ")));else if(r.chk.some(c=>c.s))C.push(T.chkOk);
  if(a.qeyd.length)C.push(T.qeyd(a.qeyd.map(n).join("; ")));
  const tested=a.tested.length,rp=a.rep.length,at=a.att.length;
  if(tested)C.push(T.tested(tested,tested-at-rp,at,rp));
  if(rp){const p=rp/Math.max(1,tested);C.push(p>=0.2?T.repMany(Math.round(p*100)):T.repFew(a.rep.map(b=>b.lab).join(", ")))}
  if(at)C.push(T.att(a.att.map(b=>b.lab).join(", ")));
  if(a.age!==null&&a.life>0){if(a.age>=a.life)C.push(T.ageOver(a.age.toFixed(1),a.life));else if(a.age>=a.life-1)C.push(T.ageNear)}
  if(r.dis.res==="Uğursuz")C.push(T.disFail);
  const room=num(r.meas[IDX_ROOM].v[0]);if(room!==null&&room>25)C.push(T.room(room));
  const loads=r.meas[IDX_LOAD].v.map(num).filter(x=>x!==null);if(loads.length&&Math.max(...loads)>80)C.push(T.load);
  if(r.recs&&r.recs.trim())C.push(ftl(L,r,r.recs.trim()));
  if(a.next)C.push(T.next(fmtDate(a.next)));
  return C}
/* free-text fields that get machine-translated */
function freeTexts(r){const out=[r.cl.obj,r.wExtra,r.notes,r.recs&&r.recs.trim()];r.chk.forEach(c=>out.push(c.n));r.parts.forEach(p=>{out.push(p.name);out.push(p.note)});
  return [...new Set(out.filter(x=>x&&String(x).trim()))]}
async function ensureTranslations(r,L){if(L==="az")return true;
  r.tr=r.tr||{};r.tr[L]=r.tr[L]||{};const need=freeTexts(r).filter(s=>!(s in r.tr[L]));if(!need.length)return true;
  if(!hasServer()){toast("Sərbəst mətnlərin tərcüməsi üçün server lazımdır");return false}
  try{const res=await api("translate",{texts:need,to:L});need.forEach((s,i)=>{if(res.out&&res.out[i])r.tr[L][s]=res.out[i]});markDirty();return true}
  catch(e){toast("Sərbəst mətnlər tərcümə olunmadı (internet?) — qalan hissə tərcümə edildi");return false}}

/* ---------------- calculations ---------------- */
function measStatus(r,i){const m=r.meas[i],n=MEAS[i][4];const vals=m.v.slice(0,n).map(num).filter(x=>x!==null);
  if(!vals.length)return "";const mn=num(m.min),mx=num(m.max);
  if(vals.some(v=>(mn!==null&&v<mn)||(mx!==null&&v>mx)))return "Norma xaricində";
  return (mn===null&&mx===null)?"Qeydə alındı":"Normal"}
const batTotal=r=>{const p=num(r.bat.per),s=num(r.bat.str);return p>0&&s>0?Math.min(MAXB,Math.floor(p)*Math.floor(s)):0};
function refEff(r){const x=num(r.bat.ref);if(x>0)return x;const rs=r.bat.blocks.slice(0,batTotal(r)).map(b=>num(b&&b.r)).filter(v=>v!==null);return median(rs)}
function blockStatus(r,b,ref){if(!b)return "";const v=num(b.v),R=num(b.r);if(v===null&&R===null)return "";
  const B=r.bat,dev=(R!==null&&ref)?R/ref-1:null,w=num(B.warn)/100,f=num(B.fail)/100,vw=num(B.vwarn),vf=num(B.vfail),vh=num(B.vhigh);
  if((dev!==null&&f!==null&&!isNaN(f)&&dev>=f)||(v!==null&&vf!==null&&v<vf))return "Dəyişdirilməli";
  if((dev!==null&&w!==null&&!isNaN(w)&&dev>=w)||(v!==null&&vw!==null&&v<vw)||(v!==null&&vh!==null&&v>vh))return "Diqqət";
  return "Normal"}
const lbl=(r,i)=>{const p=Math.floor(num(r.bat.per))||1;return "Q"+(Math.floor(i/p)+1)+"-B"+String(i%p+1).padStart(2,"0")};
function analyze(r){
  const tot=batTotal(r),ref=refEff(r),blocks=[];
  for(let i=0;i<tot;i++){const b=r.bat.blocks[i]||{};blocks.push({i,lab:lbl(r,i),s:Math.floor(i/(Math.floor(num(r.bat.per))||1))+1,v:num(b.v),r:num(b.r),t:num(b.t),st:blockStatus(r,b,ref),dev:(num(b.r)!==null&&ref)?num(b.r)/ref-1:null})}
  const tested=blocks.filter(b=>b.st);const rv=blocks.map(b=>b.r).filter(x=>x!==null),vv=blocks.map(b=>b.v).filter(x=>x!==null);
  const rep=tested.filter(b=>b.st==="Dəyişdirilməli"),att=tested.filter(b=>b.st==="Diqqət");
  const ms=MEAS.map((_,i)=>measStatus(r,i));const out=MEAS.map((m,i)=>ms[i]==="Norma xaricində"?m[0]:null).filter(Boolean);
  const nasaz=CHK.filter((_,i)=>r.chk[i].s==="Nasaz"),qeyd=CHK.filter((_,i)=>r.chk[i].s==="Qeyd var");
  const age=yearsBetween(r.bat.inst,r.svc.date),life=num(r.bat.life);
  const next=addMonths(r.svc.date,num(r.svc.interval));
  let overall="QƏNAƏTBƏXŞ",cls="ok";
  if(nasaz.length||rep.length||r.dis.res==="Uğursuz"){overall="TƏCİLİ MÜDAXİLƏ TƏLƏB OLUNUR";cls="bad"}
  else if(out.length||att.length||qeyd.length||(age!==null&&life>0&&age>=life)){overall="DİQQƏT TƏLƏB OLUNUR";cls="warn"}
  const strings=[];const ns=Math.min(8,Math.floor(num(r.bat.str))||0);
  for(let s=1;s<=ns;s++){const bs=blocks.filter(b=>b.s===s);const rr=bs.map(b=>b.r).filter(x=>x!==null);
    strings.push({s,n:bs.filter(b=>b.st).length,sumV:bs.reduce((a,b)=>a+(b.v||0),0),avgR:rr.length?rr.reduce((a,b)=>a+b,0)/rr.length:null,maxR:rr.length?Math.max(...rr):null,att:bs.filter(b=>b.st==="Diqqət").length,rep:bs.filter(b=>b.st==="Dəyişdirilməli").length})}
  const A={tot,ref,blocks,tested,rep,att,rv,vv,ms,out,nasaz,qeyd,age,life,next,overall,cls,strings};A.C=concl(r,A,"az");return A}
const stCls=s=>(s==="Normal"||s==="Yaxşı")?"ok":(s==="Diqqət"||s==="Qeyd var")?"warn":(s==="Dəyişdirilməli"||s==="Nasaz"||s==="Norma xaricində")?"bad":"";

/* ---------------- storage & sync (offline-first, central server) ---------------- */
const CFG=Object.assign({serverUrl:"",apiKey:""},window.UPS_CONFIG||{});
const IS_GAS=!!(window.google&&google.script&&google.script.run);
const IS_APP=!!(window.Capacitor&&typeof Capacitor.isNativePlatform==="function"&&Capacitor.isNativePlatform());
const state={reports:{},remote:{},pending:new Set(),settings:{...DEFAULT_SETTINGS},me:{name:"",url:"",key:""},
  cur:null,plang:"az",tab:"svc",bi:0,dirty:false,saving:null,view:"home",online:null,syncing:false,syncErr:"",lastSync:0,q:""};
const LS={get(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const clone=o=>JSON.parse(JSON.stringify(o));
function loadLocal(){
  (LS.get("ups.reports")||[]).forEach(r=>{if(r&&r.id)state.reports[r.id]=r});
  (LS.get("ups.pending")||[]).forEach(id=>state.pending.add(id));
  Object.assign(state.me,LS.get("ups.me")||{});
  if(!state.me.url)state.me.url=CFG.serverUrl||"";
  if(!state.me.key)state.me.key=CFG.apiKey||"";
  state.settings={...DEFAULT_SETTINGS,...(LS.get("ups.settings")||{})};
  (LS.get("ups.remote")||[]).forEach(s=>{if(s&&s.id)state.remote[s.id]=s});
}
function saveLocalReports(){if(!LS.set("ups.reports",Object.values(state.reports))){toast("Telefonun yaddaşı dolub: köhnə hesabatları silin");return false}return true}
const savePending=()=>LS.set("ups.pending",[...state.pending]);
const hasServer=()=>IS_GAS||!!(state.me.url&&state.me.key);

async function api(action,payload={}){
  const body={key:state.me.key,action,worker:state.me.name,...payload};
  if(IS_GAS)return new Promise((res,rej)=>google.script.run
    .withSuccessHandler(r=>{if(r&&r.ok)res(r);else{const e=new Error(r&&r.error||"server");e.server=true;e.data=r||{};rej(e)}})
    .withFailureHandler(e=>rej(e)).api(body));
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),60000);
  try{
    const res=await fetch(state.me.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),signal:ctl.signal,redirect:"follow"});
    let j;try{j=await res.json()}catch(e){throw new Error("bad_response")}
    if(!j.ok){const e=new Error(j.error||"server");e.server=true;e.data=j;throw e}
    return j}
  finally{clearTimeout(t)}}

function summaryOf(r){const a=analyze(r);return {id:r.id,repno:r.svc.repno,date:r.svc.date,client:r.cl.name,obj:r.cl.obj,brand:r.ups.brand,model:r.ups.model,sn:r.ups.sn,kva:r.ups.kva,
  eng:r.svc.eng,overall:a.overall,cls:a.cls,tested:a.tested.length,rep:a.rep.length,att:a.att.length,next:a.next,updatedAt:r.updatedAt,by:r.by||""}}
function blocksOf(r){const a=analyze(r),p=Math.floor(num(r.bat.per))||1;return a.blocks.filter(b=>b.st).map(b=>[b.lab,b.s,b.i%p+1,b.v,b.r,b.t,b.st])}
const clsOfOverall=o=>/TƏCİLİ/.test(o||"")?"bad":/DİQQƏT/.test(o||"")?"warn":o?"ok":"";

let syncTimer=null;
function scheduleSync(ms=2500){clearTimeout(syncTimer);syncTimer=setTimeout(sync,ms)}
function editorBusy(){const a=document.activeElement;return a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)}
let pendingRemote=false;
function applyRemoteToOpen(id){
  if(!state.cur||state.cur.id!==id||state.view!=="edit")return;
  if(state.dirty||state.saving)return;
  if(editorBusy()){pendingRemote=true;return}
  pendingRemote=false;state.cur=normalize(clone(state.reports[id]));state.reports[id]=state.cur;
  const y=window.scrollY;renderEditor();window.scrollTo(0,y);toast("Digər cihazdakı dəyişikliklər yükləndi")}
document.addEventListener("focusout",()=>{if(pendingRemote&&state.cur)setTimeout(()=>applyRemoteToOpen(state.cur.id),300)});

async function sync(){
  clearTimeout(syncTimer);
  if(state.syncing){scheduleSync(4000);return}
  if(!hasServer()){updateSyncBadge();return}
  state.syncing=true;updateSyncBadge();
  try{
    for(const id of [...state.pending]){
      const r=state.reports[id];
      if(!r){state.pending.delete(id);continue}
      if(state.cur&&state.cur.id===id&&(state.dirty||state.saving))continue;
      try{const res=await api("save",{report:r,summary:summaryOf(r),blocks:blocksOf(r)});
        state.pending.delete(id);state.remote[id]={...summaryOf(r),...(res.summary||{})}}
      catch(e){
        if(e.server&&e.data&&e.data.error==="conflict"&&e.data.report){
          state.reports[id]=e.data.report;state.pending.delete(id);applyRemoteToOpen(id);
          toast("Bu hesabat başqa cihazda daha yeni dəyişdirilib — yeni versiya yükləndi")}
        else if(e.server&&e.data&&e.data.error==="auth")throw e;
        else if(e.server){state.syncErr="Server xətası: "+e.message}
        else throw e}}
    savePending();saveLocalReports();
    const L=await api("list");
    state.remote={};(L.items||[]).forEach(s=>{s.cls=clsOfOverall(s.overall);state.remote[s.id]=s});
    LS.set("ups.remote",Object.values(state.remote));
    if(L.role&&L.role!==state.me.role){state.me.role=L.role;LS.set("ups.me",state.me)}
    if(L.settings){state.settings={...DEFAULT_SETTINGS,...L.settings};LS.set("ups.settings",state.settings)}
    for(const id in state.remote){const loc=state.reports[id];
      if(loc&&!state.pending.has(id)&&(state.remote[id].updatedAt||0)>(loc.updatedAt||0)){
        if(state.cur&&state.cur.id===id&&state.dirty)continue;
        try{const g=await api("get",{id});state.reports[id]=g.report;applyRemoteToOpen(id)}catch(e){}}}
    saveLocalReports();
    state.online=true;state.lastSync=Date.now();state.syncErr="";scheduleReminders();
  }catch(e){
    state.online=false;
    state.syncErr=e&&e.message==="auth"?"API açarı yanlışdır — Ayarlarda yoxlayın":e&&e.message==="bad_response"?"Server ünvanı yanlışdır — Ayarlarda yoxlayın":"İnternet yoxdur və ya server cavab vermir";
  }finally{
    state.syncing=false;updateSyncBadge();
    if(state.pending.size)scheduleSync(30000);
    if(state.view==="home"&&document.activeElement?.id!=="q")renderHome();
  }}
window.addEventListener("online",()=>scheduleSync(500));
setInterval(()=>{if(document.visibilityState==="visible")sync()},90000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")scheduleSync(800)});

function updateSyncBadge(){const el=$("#syncState");if(!el)return;const n=state.pending.size;let t,c="";
  if(!hasServer()){t="Server qoşulmayıb";c="warn"}
  else if(state.syncing){t="sinxronlaşır…"}
  else if(state.online===false){t=(n?n+" gözləyir · ":"")+"oflayn";c="warn"}
  else if(n){t=n+" göndərilməyib";c="warn"}
  else if(state.online){t="sinxron ✓";c="ok"}
  else t="";
  el.textContent=t;el.className="sync "+c;el.title=state.syncErr||""}

async function persist(r){
  r.updatedAt=Date.now();r.by=state.me.name||r.by||"";
  state.reports[r.id]=r;
  if(!saveLocalReports())throw new Error("local");
  if(!r.sample){state.pending.add(r.id);savePending();scheduleSync()}updateSyncBadge()}
async function removeReport(id){
  if(state.remote[id]){if(!hasServer())throw new Error("offline");await api("delete",{id});delete state.remote[id];LS.set("ups.remote",Object.values(state.remote))}
  delete state.reports[id];state.pending.delete(id);savePending();saveLocalReports()}
async function saveSettings(){
  LS.set("ups.settings",state.settings);LS.set("ups.me",state.me);
  if(hasServer()&&state.me.role==="admin"){const{co,coaddr,cotel,notify,interval,warn,fail,vwarn,vfail,vhigh,life}=state.settings;await api("settings",{settings:{co,coaddr,cotel,notify,interval,warn,fail,vwarn,vfail,vhigh,life}})}}
async function getFull(id){
  const loc=state.reports[id],rem=state.remote[id];
  if(loc&&(state.pending.has(id)||!rem||(rem.updatedAt||0)<=(loc.updatedAt||0)))return loc;
  if(!hasServer()){if(loc)return loc;throw new Error("offline")}
  try{const g=await api("get",{id});state.reports[id]=g.report;saveLocalReports();return g.report}
  catch(e){if(loc)return loc;throw e}}

let saveTimer=null;
function markDirty(){state.dirty=true;$("#saveState").textContent="dəyişiklik…";clearTimeout(saveTimer);saveTimer=setTimeout(flush,1000)}
async function flush(){
  clearTimeout(saveTimer);if(!state.cur||!state.dirty)return;
  if(state.saving){await state.saving;return flush()}
  state.dirty=false;
  state.saving=persist(state.cur).then(()=>{$("#saveState").textContent=state.dirty?"dəyişiklik…":"saxlanıldı ✓"})
    .catch(()=>{state.dirty=true;$("#saveState").textContent="saxlanılmadı"})
    .finally(()=>{state.saving=null});
  return state.saving}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flush()});

/* ---------------- welcome (first run) ---------------- */
function renderWelcome(){

function listItems(){
  const ids=new Set([...Object.keys(state.reports),...Object.keys(state.remote)]);const out=[];
  ids.forEach(id=>{const loc=state.reports[id],rem=state.remote[id];
    if(loc){const s=summaryOf(normalize(clone(loc)));out.push({...s,local:true,pending:state.pending.has(id),remote:!!rem,pdf:rem&&rem.pdf})}
    else out.push({...rem,cls:rem.cls||clsOfOverall(rem.overall),local:false,pending:false,remote:true})});
  return out}
/* ---------------- planned-service reminders ---------------- */
const REMIND_DAYS=2;
function upcomingAll(){const latest={};
  listItems().forEach(it=>{if(it.local&&state.reports[it.id]&&state.reports[it.id].sample)return;
    const key=it.sn?"sn:"+String(it.sn).toLowerCase():"c:"+String(it.client||"").toLowerCase()+"|"+String(it.obj||"").toLowerCase();
    if(!latest[key]||(it.date||"")>(latest[key].date||""))latest[key]=it});
  const now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  return Object.values(latest).map(it=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(it.next||"");if(!m)return null;
    const due=new Date(+m[1],+m[2]-1,+m[3]).getTime(),days=Math.round((due-t0)/864e5);
    return {...it,days,at:due-REMIND_DAYS*864e5+9*3600e3}}).filter(Boolean).sort((a,b)=>a.days-b.days)}
function upcomingBanner(){const u=upcomingAll().filter(x=>x.days<=REMIND_DAYS&&x.days>=-30);if(!u.length)return "";
  const when=d=>d<0?`<b style="color:var(--bad)">${-d} gün gecikir</b>`:d===0?"<b>bu gün</b>":d===1?"<b>sabah</b>":`<b>${d} gün sonra</b>`;
  return `<div class="card remind" role="status"><h3>Planlı servis yaxınlaşır</h3>${u.map(x=>`<button class="rrow" data-open="${esc(x.id)}"><span>${esc(x.client||"Adsız müştəri")}${x.obj?` · <span class="note">${esc(x.obj)}</span>`:""}<br><span class="note">${esc([x.brand,x.model].filter(Boolean).join(" "))}${x.sn?" · S/N "+esc(x.sn):""}</span></span><span style="text-align:right">${esc(fmtDate(x.next))}<br>${when(x.days)}</span></button>`).join("")}</div>`}
let remindSig="";
async function scheduleReminders(){if(!IS_APP)return;
  try{const LN=(Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications)||Capacitor.registerPlugin("LocalNotifications");
    const list=upcomingAll().filter(u=>u.at>Date.now()).slice(0,60);
    const sig=list.map(u=>u.id+u.next).join(",");if(sig===remindSig||sig===LS.get("ups.remindSig"))return;
    let perm=await LN.checkPermissions();if(perm.display!=="granted"){perm=await LN.requestPermissions();if(perm.display!=="granted")return}
    const pend=await LN.getPending();if(pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    if(list.length)await LN.schedule({notifications:list.map((u,i)=>({id:1000+i,title:"Planlı servis 2 gün sonradır",
      body:(u.client||"Müştəri")+(u.obj?" ("+u.obj+")":"")+" — "+[u.brand,u.model].filter(Boolean).join(" ")+(u.sn?", S/N "+u.sn:"")+". Tarix: "+fmtDate(u.next),
      schedule:{at:new Date(u.at),allowWhileIdle:true}}))});
    remindSig=sig;LS.set("ups.remindSig",sig)}catch(e){}}

const AFTER={
 chk(){document.querySelectorAll("[data-chk]").forEach(b=>b.onclick=()=>{const i=+b.dataset.chk,v=b.dataset.v;const c=state.cur.chk[i];c.s=c.s===v?"":v;markDirty();const y=window.scrollY;renderEditor();window.scrollTo(0,y);const n=$("#cn-"+i);if(n&&c.s!=="Yaxşı")n.focus({preventScroll:true})});
  $("#allOk").onclick=()=>{state.cur.chk.forEach(c=>{if(!c.s)c.s="Yaxşı"});markDirty();const y=window.scrollY;renderEditor();window.scrollTo(0,y)}},
 work(){document.querySelectorAll("[data-work]").forEach(b=>b.onclick=()=>{const i=+b.dataset.work;state.cur.works[i]=state.cur.works[i]===b.dataset.v?"":b.dataset.v;markDirty();const y=window.scrollY;renderEditor();window.scrollTo(0,y)});
  $("#addPart").onclick=()=>{state.cur.parts.push({name:"",code:"",qty:"",note:""});markDirty();const y=window.scrollY;renderEditor();window.scrollTo(0,y)};
  document.querySelectorAll("[data-delpart]").forEach(b=>b.onclick=()=>{state.cur.parts.splice(+b.dataset.delpart,1);markDirty();const y=window.scrollY;renderEditor();window.scrollTo(0,y)})},
 blk(){if(!batTotal(state.cur))return;renderProbe();renderGrid();initFluke();
  $("#pasteGo").onclick=()=>{const r=state.cur,tot=batTotal(r),ord=$("#pasteOrder").value;let i=$("#pasteStart").value==="cur"?state.bi:0,n=0;
   $("#pasteBox").value.split(/\r?\n/).forEach(line=>{const nums=(line.match(/-?\d+(?:[.,]\d+)?/g)||[]).map(x=>x.replace(",","."));const need=ord==="nvr"?3:2;if(nums.length<need||i>=tot)return;
     const [v,R]=ord==="vr"?[nums[0],nums[1]]:ord==="rv"?[nums[1],nums[0]]:[nums[1],nums[2]];
     r.bat.blocks[i]={...(r.bat.blocks[i]||{}),v,r:R};i++;n++});
   if(n){markDirty();$("#pasteBox").value="";renderProbe();renderGrid();toast(n+" blok dolduruldu")}else toast("Rəqəm tapılmadı: hər sətirdə ən azı iki qiymət olmalıdır")}},

function canDelete(r){if(r.sample)return true;if(state.remote[r.id])return state.me.role==="admin";return true}
async function showHistory(){const box=$("#histBox"),id=state.cur.id;box.innerHTML='<div class="card"><p class="note" style="margin:0">Versiyalar yüklənir…</p></div>';
  try{const h=await api("history",{id});
    box.innerHTML=`<div class="card"><h3>Əvvəlki versiyalar</h3>${h.items.length?h.items.map(v=>`<div class="mhead"><b>${esc(v.at.replace("T"," ").slice(0,16))}</b><span class="note">${esc(v.by||"")}</span><button class="btn sm" data-rev="${esc(v.rev)}">Bərpa et</button></div>`).join(""):'<p class="note" style="margin:0">Hələ əvvəlki versiya yoxdur.</p>'}</div>`;
    box.querySelectorAll("[data-rev]").forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent="bərpa olunur…";

        await api("save",{report:rep,summary:summaryOf(rep),blocks:blocksOf(rep),force:true});
        state.reports[id]=rep;state.pending.delete(id);savePending();saveLocalReports();state.cur=rep;toast("Versiya bərpa edildi");sync();renderEditor()}
      catch(e){b.disabled=false;b.textContent="Bərpa et";toast("Bərpa etmək alınmadı")}})}
  catch(e){box.innerHTML="";toast(e&&e.message==="forbidden"?"Bu bölmə yalnız rəhbər üçündür":"Versiyaları yükləmək alınmadı")}}
function fitPaper(){const pw=$("#pw"),ps=$("#ps");if(!pw||!ps)return;const k=Math.min(1,pw.clientWidth/737);ps.style.transform=`scale(${k})`;pw.style.height=(ps.firstElementChild.offsetHeight*k)+"px"}

function ensureBlock(i){const b=state.cur.bat.blocks;while(b.length<=i)b.push({v:"",r:"",t:""});return b[i]}
function renderProbe(){const r=state.cur,tot=batTotal(r),i=state.bi,b=r.bat.blocks[i]||{},ref=refEff(r),st=blockStatus(r,b,ref),p=Math.floor(num(r.bat.per));
  const dev=(num(b.r)!==null&&ref)?Math.round((num(b.r)/ref-1)*100):null;
  $("#probe").innerHTML=`<div class="lbl"><span class="tag">${esc(lbl(r,i))}</span><span class="pos">${i+1} / ${tot} · qrup ${Math.floor(i/p)+1}, blok ${i%p+1}</span><span class="chip ${stCls(st)}">${esc(st)}${dev!==null?" · "+(dev>=0?"+":"")+dev+"%":""}</span></div>
  <div class="grid3"><label class="f"><span>Gərginlik, V</span><input id="pV" inputmode="decimal" enterkeyhint="next" autocomplete="off" value="${esc(b.v||"")}"></label>
  <label class="f"><span>Müqavimət, mΩ</span><input id="pR" inputmode="decimal" enterkeyhint="next" autocomplete="off" value="${esc(b.r||"")}"></label>
  <label class="f"><span>Temp., °C</span><input id="pT" inputmode="decimal" enterkeyhint="next" autocomplete="off" value="${esc(b.t||"")}"></label></div>
  <div class="row"><button class="btn" id="pPrev"${i===0?" disabled":""}>← Əvvəlki</button><button class="btn pri" id="pNext">${i<tot-1?"Növbəti →":"Bitir ✓"}</button></div>`;
  const upd=(k,el)=>{const blk=ensureBlock(state.bi);blk[k]=el.value;markDirty();liveProbe()};
  $("#pV").oninput=e=>upd("v",e.target);$("#pR").oninput=e=>upd("r",e.target);$("#pT").oninput=e=>upd("t",e.target);
  $("#pV").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("#pR").focus()}};
  $("#pR").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go(1)}};
  $("#pT").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go(1)}};
  $("#pPrev").onclick=()=>go(-1);$("#pNext").onclick=()=>go(1);
  renderStats()}
function liveProbe(){const r=state.cur,b=r.bat.blocks[state.bi]||{},ref=refEff(r),st=blockStatus(r,b,ref),c=$("#probe .chip");
  const dev=(num(b.r)!==null&&ref)?Math.round((num(b.r)/ref-1)*100):null;c.className="chip "+stCls(st);c.textContent=st+(dev!==null?" · "+(dev>=0?"+":"")+dev+"%":"");
  const cell=document.querySelector(`.cell[data-b="${state.bi}"]`);if(cell)cell.className="cell cur "+stCls(st);renderStats()}
function go(d){const tot=batTotal(state.cur);const n=state.bi+d;if(n<0)return;if(n>=tot){toast("Bütün bloklar daxil edildi");renderGrid();return}
  state.bi=n;renderProbe();renderGrid();const v=$("#pV");v.focus();v.select()}
function renderGrid(){const r=state.cur,a=analyze(r),p=Math.floor(num(r.bat.per)),ns=Math.ceil(a.tot/p);let h="";
  for(let s=0;s<ns;s++){const bs=a.blocks.slice(s*p,s*p+p);h+=`<div class="sline"><div class="sl">Qrup ${s+1}<span style="font-weight:500;letter-spacing:0;text-transform:none">${bs.filter(b=>b.st).length}/${bs.length} ölçülüb</span></div><div class="cells">`+
    bs.map(b=>`<button class="cell ${stCls(b.st)}${b.i===state.bi?" cur":""}" data-b="${b.i}" aria-label="${b.lab} ${b.st||"ölçülməyib"}">${b.i%p+1}</button>`).join("")+`</div></div>`}
  $("#bgrid").innerHTML=h;
  document.querySelectorAll(".cell").forEach(c=>c.onclick=()=>{state.bi=+c.dataset.b;renderProbe();renderGrid();$("#probe").scrollIntoView({behavior:"smooth",block:"start"});setTimeout(()=>$("#pV").focus({preventScroll:true}),300)})}
function renderStats(){const a=analyze(state.cur);const norm=a.tested.length-a.att.length-a.rep.length;
  $("#bstats").innerHTML=`<div class="stat"><b>${a.tested.length}/${a.tot}</b><span>ölçülüb</span></div><div class="stat"><b>${a.ref?fmt(a.ref):"—"}</b><span>referans R, mΩ</span></div><div class="stat"><b>${a.rv.length?fmt(Math.max(...a.rv)):"—"}</b><span>maks R, mΩ</span></div>
  <div class="stat ok"><b>${norm}</b><span>normal</span></div><div class="stat warn"><b>${a.att.length}</b><span>diqqət</span></div><div class="stat bad"><b>${a.rep.length}</b><span>dəyişdirilməli</span></div>`}

let LOGO_IMG=null;function logoImg(){if(!LOGO)return Promise.resolve(null);if(LOGO_IMG)return Promise.resolve(LOGO_IMG);
  return new Promise(res=>{const im=new Image();im.onload=()=>{LOGO_IMG=im;res(im)};im.onerror=()=>res(null);im.src=LOGO})}
/* page header drawn on every PDF page: logo left, report no / date right, rule below */
async function pageHeaderPNG(r,lang){const W=1940,H=150,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,W,H);const im=await logoImg();const S=state.settings;
  if(im){const h=118,w=im.width*h/im.height;x.drawImage(im,0,8,w,h)}
  else{x.fillStyle="#123B35";x.font="bold 56px 'Roboto Condensed', Arial, sans-serif";x.textBaseline="middle";x.fillText(S.co||tl(lang,"[Şirkət adı]"),0,66)}
  x.textAlign="right";x.fillStyle="#1B1F1E";x.textBaseline="alphabetic";
  x.font="bold 34px 'Noto Sans', Arial, sans-serif";x.fillText(tl(lang,"Hesabat №")+" "+(r.svc.repno||"—"),W,52);
  x.font="30px 'Noto Sans', Arial, sans-serif";x.fillText(tl(lang,"Tarix:")+" "+(fmtDate(r.svc.date)||"—"),W,92);
  x.fillStyle="#55605C";x.font="24px 'Noto Sans', Arial, sans-serif";x.fillText([S.coaddr,S.cotel].filter(Boolean).join("   "),W,126);
  x.fillStyle="#123B35";x.fillRect(0,H-6,W,5);return c.toDataURL("image/png")}
function pageFooterPNG(i,n,lang){const W=1940,H=50,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,W,H);x.fillStyle="#B9C2BF";x.fillRect(0,2,W,2);x.fillStyle="#55605C";x.font="24px 'Noto Sans', Arial, sans-serif";
  x.textAlign="center";x.fillText(i+" / "+n,W/2,38);x.textAlign="left";x.fillText(tl(lang,"UPS TEXNİKİ SERVİS HESABATI"),0,38);return c.toDataURL("image/png")}
function rChartsHTML(r,a){
  const p=Math.floor(num(r.bat.per))||0;if(!p||!a.rv.length)return "";
  const ref=a.ref,w=num(r.bat.warn),f=num(r.bat.fail);
  const lines=[];if(ref){lines.push({v:ref,t:t("Referans")+" "+fmt(ref),c:"#55605C",d:""});
    if(w!==null)lines.push({v:ref*(1+w/100),t:"+"+w+"% "+t("diqqət"),c:"#B7860B",d:"4 3"});
    if(f!==null)lines.push({v:ref*(1+f/100),t:"+"+f+"% "+t("dəyiş."),c:"#B42318",d:"4 3"})}
  const top=Math.max(...a.rv,...lines.map(l=>l.v))*1.12;
  const W=733,H=150,L=34,R=82,T=12,B=22,pw=W-L-R,ph=H-T-B;
  const y=v=>T+ph-(v/top)*ph;
  const step=top>20?5:top>8?2:1,ticks=[];for(let k=0;k<=top;k+=step)ticks.push(k);
  const col={"Normal":"#5AA982","Diqqət":"#E0A82E","Dəyişdirilməli":"#C8372D"};
  let h=`<div class="rchart-legend"><span><i style="background:#5AA982"></i>${t("Normal")}</span><span><i style="background:#E0A82E"></i>${t("Diqqət")}</span><span><i style="background:#C8372D"></i>${t("Dəyişdirilməli")}</span><span class="small">${t("Hər sütun bir blokun daxili müqavimətidir, mΩ")}</span></div>`;
  const ns=Math.ceil(a.tot/p);
  for(let s=0;s<ns;s++){const bs=a.blocks.slice(s*p,s*p+p);if(!bs.some(b=>b.r!==null))continue;
    const bw=pw/bs.length,gap=Math.min(2,bw*0.25);
    let g=`<svg class="rchart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="Arial, sans-serif" font-size="9">`;
    ticks.forEach(k=>{g+=`<line x1="${L}" x2="${L+pw}" y1="${y(k)}" y2="${y(k)}" stroke="#E3E8E6" stroke-width="1"/><text x="${L-5}" y="${y(k)+3}" text-anchor="end" fill="#6B7672">${k}</text>`});
    bs.forEach((b,k)=>{if(b.r===null)return;const x=L+k*bw+gap/2,yy=y(b.r),hh=Math.max(1,T+ph-yy);
      g+=`<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${Math.max(1,bw-gap).toFixed(1)}" height="${hh.toFixed(1)}" rx="1.5" fill="${col[b.st]||"#9AA5A1"}"><title>${b.lab}: ${fmt(b.r)} mΩ, ${t(b.st)}</title></rect>`;
      if(b.st&&b.st!=="Normal")g+=`<text x="${(x+(bw-gap)/2).toFixed(1)}" y="${(yy-3).toFixed(1)}" text-anchor="middle" fill="#1B1F1E" font-weight="bold">${k+1}</text>`});
    lines.forEach(l=>{g+=`<line x1="${L}" x2="${L+pw}" y1="${y(l.v)}" y2="${y(l.v)}" stroke="${l.c}" stroke-width="1.2" ${l.d?`stroke-dasharray="${l.d}"`:""}/><text x="${L+pw+4}" y="${y(l.v)+3}" fill="${l.c}">${esc(l.t)}</text>`});
    g+=`<line x1="${L}" x2="${L+pw}" y1="${T+ph}" y2="${T+ph}" stroke="#9AA5A1" stroke-width="1"/>`;
    bs.forEach((b,k)=>{const n=k+1;if(n===1||n%5===0||n===bs.length)g+=`<text x="${(L+k*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle" fill="#6B7672">${n}</text>`});

const FK={q:[],cur:null};
function initFluke(){const inp=$("#flukeFile"),drop=$("#flukeDrop");if(!inp)return;

async function queueFiles(files){if(!files.length)return;FK.q.push(...files);if(!FK.cur)nextFlukeFile()}

function readAB(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsArrayBuffer(f)})}
async function readTable(f){const buf=await readAB(f),ext=(f.name.split(".").pop()||"").toLowerCase();
  if(ext==="xls"||ext==="xlsx"){if(!window.XLSX)throw new Error("xlsx");const wb=XLSX.read(buf,{type:"array"});let best=null,bs=-1;
    wb.SheetNames.forEach(n=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:""});const sc=rows.filter(r=>r.filter(c=>pnum(c)!==null).length>=2).length;if(sc>bs){bs=sc;best=rows}});
    return (best||[]).map(r=>r.map(c=>String(c??"").trim()))}
  const u=new Uint8Array(buf);let txt;
  if(u[0]===0xFF&&u[1]===0xFE)txt=new TextDecoder("utf-16le").decode(buf);else if(u[0]===0xFE&&u[1]===0xFF)txt=new TextDecoder("utf-16be").decode(buf);
  else{txt=new TextDecoder("utf-8").decode(buf);if(txt.includes("\uFFFD"))try{txt=new TextDecoder("windows-1252").decode(buf)}catch(e){}}
  txt=txt.replace(/^\uFEFF/,"");const lines=txt.split(/\r?\n/).filter(l=>l.trim()!=="");
  const sample=lines.slice(0,40).join("\n");const cnt=d=>(sample.match(new RegExp(d==="\t"?"\t":"\\"+d,"g"))||[]).length;
  let delim=["\t",";",","].map(d=>[d,cnt(d)]).sort((a,b)=>b[1]-a[1])[0];delim=delim[1]?delim[0]:null;

function splitCSV(line,d){const out=[];let cur="",q=false;for(let i=0;i<line.length;i++){const ch=line[i];

const KW={

  v:/volt|gərg|\(v\)|\bvdc\b|\bv\b|\bu\b/i,
  vx:/ripple|\bac\b|disch|boşal|ohm|resist/i,
  t:/temp|°c|℃|\bdeg/i,
  id:/^(no\.?|#|№|id|nr\.?)$|batt?(ery)?\s*(id|no|#|№)|cell\s*(id|no|#)|blo[kc]|index|seq/i,
  s:/string|sıra|qrup|grup|group|\bstr\b/i};
function analyzeTable(name,rows){
  let hdr=-1;for(let i=0;i<Math.min(rows.length,40);i++){const r=rows[i];const sc=r.filter(c=>c&&(KW.r.test(c)||(KW.v.test(c)&&!KW.vx.test(c))||KW.t.test(c)||KW.id.test(c)||KW.s.test(c))).length;if(sc>=2){hdr=i;break}}

  const map={v:-1,r:-1,t:-1,id:-1,s:-1};

  box.querySelectorAll("[data-fk]").forEach(sel=>sel.onchange=()=>{const k=sel.dataset.fk;if(k==="place")F.place=sel.value;else if(k==="start")F.start=+sel.value;else F.map[k]=+sel.value;if(k==="id"&&F.map.id<0)F.place="seq";renderFlukeMap()});

  $("#fkApply").onclick=()=>{const P2=planFluke(F);P2.out.forEach(o=>{const b=ensureBlock(o.idx);if(o.v!==null)b.v=o.v.toFixed(3).replace(/0$/,"");if(o.r!==null)b.r=String(o.r);if(o.t!==null)b.t=String(o.t)});
    markDirty();toast(P2.out.length+" blok "+F.name+" faylından dolduruldu");renderProbe();renderGrid();nextFlukeFile()}}

/* ---------------- export ---------------- */
const fname=(r,ext)=>((r.svc.repno||"UPS-hesabat")+"_"+(r.cl.name||"")).replace(/[\\/:*?"<>|]+/g,"").replace(/\s+/g,"_").replace(/_+$/,"").slice(0,90)+"."+ext;
function blobToB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
async function saveFile(filename,blob){
  try{
    if(IS_APP){const P=Capacitor.Plugins||{};const FS=P.Filesystem||Capacitor.registerPlugin("Filesystem"),SH=P.Share||Capacitor.registerPlugin("Share");
      const data=await blobToB64(blob);const w=await FS.writeFile({path:filename,data,directory:"CACHE"});
      await SH.share({title:filename,url:w.uri,dialogTitle:"Faylı saxla və ya göndər"});return true}
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);return true}
  catch(e){if(!/cancel/i.test(String(e&&e.message||e)))toast("Faylı saxlamaq alınmadı");return false}}
async function exportPdf(){await flush();const btn=$("#bPdf");btn.disabled=true;btn.textContent="PDF hazırlanır…";const r=state.cur;
  try{if(!window.html2pdf)throw new Error("lib");const el=$("#paper");
    const L=state.plang||"az";
    const pdf=await html2pdf().set({margin:[22,8,14,8],image:{type:"jpeg",quality:0.95},html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff",onclone:d=>{const ph=d.querySelector(".paper .ph");if(ph)ph.style.display="none"}},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:["css"],before:".pb",avoid:["tr",".sigwrap",".rchart-box"]}}).from(el).toPdf().get("pdf");
    const head=await pageHeaderPNG(r,L),n=pdf.internal.getNumberOfPages();
    for(let i=1;i<=n;i++){pdf.setPage(i);pdf.addImage(head,"PNG",8,5,194,15);pdf.addImage(pageFooterPNG(i,n,L),"PNG",8,284,194,5)}
    const blob=pdf.output("blob");
    const name=fname(r,"pdf").replace(/\.pdf$/,(state.plang&&state.plang!=="az"?"_"+state.plang.toUpperCase():"")+".pdf");
    if(hasServer()&&!r.sample){btn.textContent="Drive-a yüklənir…";
      try{await sync();if(state.pending.has(r.id))throw new Error("pending");
        const res=await api("pdf",{id:r.id,client:r.cl.name,name,data:await blobToB64(blob)});
        if(state.remote[r.id])state.remote[r.id].pdf=res.url;const l=$("#pdfLink");if(l){l.href=res.url;l.hidden=false}
        toast("PDF müştərinin Drive qovluğuna yükləndi")}
      catch(e){toast("PDF Drive-a yüklənmədi (internet?) — telefonda saxlayın")}}
    btn.textContent="Saxlanılır…";await saveFile(name,blob)}
  catch(e){toast("PDF yaratmaq alınmadı")}
  btn.disabled=false;btn.textContent="PDF hazırla"}
async function exportXlsx(){await flush();if(!window.XLSX){toast("Excel kitabxanası yüklənmədi");return}
  const r=state.cur,a=analyze(r),wb=XLSX.utils.book_new();
  const info=[["UPS TEXNİKİ SERVİS HESABATI"],["Şirkət",state.settings.co],["Hesabat №",r.svc.repno],["Servis tarixi",fmtDate(r.svc.date)],["Servis növü",r.svc.type],["Mühəndis",r.svc.eng],["Növbəti servis",fmtDate(a.next)],["Ümumi qiymət",a.overall],[],
   ["Müştəri",r.cl.name],["Obyekt",r.cl.obj],["Ünvan",r.cl.addr],["Əlaqədar şəxs",r.cl.person],["Telefon",r.cl.tel],[],
   ["UPS marka",r.ups.brand],["Model",r.ups.model],["Seriya №",r.ups.sn],["Güc, kVA",num(r.ups.kva)],["Güc, kW",num(r.ups.kw)],["Topologiya",r.ups.topo],["Faza",r.ups.phase],["Firmware",r.ups.fw],["Quraşdırma",fmtDate(r.ups.inst)],[],
   ["NƏTİCƏ VƏ TÖVSİYƏLƏR"],...a.C.map(c=>["•",c]),[],["Texniki qeydlər",r.notes]];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(info),"Hesabat");
  {const wsM=XLSX.utils.aoa_to_sheet([["Parametr","Vahid","L1","L2","L3","Min","Maks","Nəticə"],...MEAS.map((m,i)=>[m[0],m[1],num(r.meas[i].v[0]),m[4]===3?num(r.meas[i].v[1]):null,m[4]===3?num(r.meas[i].v[2]):null,num(r.meas[i].min),num(r.meas[i].max),a.ms[i]])]);wsM["!merges"]=MEAS.map((m,i)=>m[4]===3?null:{s:{r:i+1,c:2},e:{r:i+1,c:4}}).filter(Boolean);XLSX.utils.book_append_sheet(wb,wsM,"Ölçmələr")}
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["#","Bənd","Nəticə","Qeyd"],...CHK.map((c,i)=>[i+1,c,r.chk[i].s,r.chk[i].n]),[],["Görülən iş","Cavab"],...WORKS.map((w,i)=>[w,r.works[i]]),[],["Hissə","Kod","Say","Qeyd"],...r.parts.map(x=>[x.name,x.code,num(x.qty),x.note])]),"Yoxlama");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Etiket","Qrup","Blok","Gərginlik, V","Daxili müqavimət, mΩ","Temp., °C","Sapma","Status"],...a.blocks.map(b=>[b.lab,b.s,b.i%(Math.floor(num(r.bat.per))||1)+1,b.v,b.r,b.t,b.dev!==null?Math.round(b.dev*1000)/1000:null,b.st])]),"Akkumulyatorlar");
  const out=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  await saveFile(fname(r,"xlsx"),new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}))}

  AP.addListener("backButton",async()=>{if(state.view==="edit"||state.view==="settings"){await flush();state.cur=null;renderHome();sync()}else AP.exitApp()})}catch(e){}}
loadLocal();
if(!state.me.name)renderWelcome();else{renderHome();sync()}
