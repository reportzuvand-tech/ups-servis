({2} saniyədə). Bu anlarda faza gərginliyi {3} V ({4}%) düşüb.","The load current briefly rose from the base level ({0} A) to {1} A (in {2} {2|second|seconds}). At these moments the phase voltage dropped by {3} V ({4}%).","Ток нагрузки кратковременно возрастал с базового уровня ({0} А) до {1} А (секунд: {2}). В эти моменты фазное напряжение снижалось на {3} В ({4}%).","Yük akımı kısa süreliğine temel seviyeden ({0} A) {1} A'e kadar yükseldi ({2} saniyede). Bu anlarda faz gerilimi {3} V (%{4}) düştü."],["Təxmini mənbə empedansı (faza) ≈ {0} mΩ.","Estimated source impedance (per phase) ≈ {0} mΩ.","Оценочное полное сопротивление источника (на фазу) ≈ {0} мОм.","Tahmini kaynak empedansı (faz) ≈ {0} mΩ."],["Hadisə (növ {0})","Event (type {0})","Событие (тип {0})","Olay (tür {0})"],["Statistika və hadisə cədvəlləri","Statistics and event tables","Таблицы статистики и событий","İstatistik ve olay tabloları"],["PQ_hesabat","PQ_report","Otchet_PQ","PQ_rapor"],["Güc keyfiyyəti ölçmə hesabatı","Power quality measurement report","Отчёт об измерении качества электроэнергии","Güç kalitesi ölçüm raporu"],["Neytral və ya torpaqlama dövrəsində problem","Problem in the neutral or earthing circuit","Проблема в цепи нейтрали или заземления","Nötr veya topraklama devresinde sorun"],["N–PE gərginliyi","N–PE voltage","Напряжение N–PE","N–PE gerilimi"],["N–PE gərginliyini avadanlığın qida lövhəsində, paylayıcı şitdə və UPS/transformator çıxışında ayrıca ölçüb müqayisə etmək","Measure the N–PE voltage separately at the equipment supply panel, the distribution board and the UPS/transformer output, and compare","Измерить напряжение N–PE отдельно на щите питания оборудования, в распределительном щите и на выходе ИБП/трансформатора и сравнить","N–PE gerilimini ekipmanın besleme panosunda, dağıtım panosunda ve UPS/trafo çıkışında ayrı ayrı ölçüp karşılaştırmak"],["Neytral birləşmələrinin (klemlər, şinlər) sıxılmasını yoxlamaq, termovizorla baxmaq","Check tightness of neutral connections (terminals, busbars) and inspect with a thermal camera","Проверить затяжку соединений нейтрали (клеммы, шины), осмотреть тепловизором","Nötr bağlantılarının (klemensler, baralar) sıkılığını kontrol etmek, termal kamerayla incelemek"],["N–PE birləşmə nöqtəsini (TN-S / TN-C-S sxemi) və UPS çıxışındakı neytral–torpaq birləşməsini yoxlamaq","Check the N–PE bonding point (TN-S / TN-C-S system) and the neutral–earth bond at the UPS output","Проверить точку соединения N–PE (система TN-S / TN-C-S) и соединение нейтрали с землёй на выходе ИБП","N–PE birleşme noktasını (TN-S / TN-C-S sistemi) ve UPS çıkışındaki nötr–toprak bağlantısını kontrol etmek"],["Torpaqlama müqavimətini və PE naqilinin bütövlüyünü ölçmək","Measure the earthing resistance and the continuity of the PE conductor","Измерить сопротивление заземления и целостность проводника PE","Topraklama direncini ve PE iletkeninin sürekliliğini ölçmek"],["Mənbənin (UPS / transformator / kabel xətti) daxili müqaviməti impuls yük üçün yüksəkdir","Source impedance (UPS / transformer / cable line) is too high for the pulsed load","Внутреннее сопротивление источника (ИБП / трансформатор / кабельная линия) велико для импульсной нагрузки","Kaynağın (UPS / trafo / kablo hattı) iç empedansı darbeli yük için yüksek"],["Tibbi görüntüləmə (KT, rentgen) kimi avadanlıqlar adətən yük anında gərginlik düşküsünün və şəbəkə empedansının istehsalçının göstərdiyi həddən az olmasını tələb edir.","Equipment such as medical imaging systems (CT, X-ray) usually requires the voltage drop under load and the supply impedance to stay below the limits specified by the manufacturer.","Оборудование медицинской визуализации (КТ, рентген) обычно требует, чтобы падение напряжения под нагрузкой и полное сопротивление сети были ниже значений, указанных производителем.","Tıbbi görüntüleme (BT, röntgen) gibi ekipmanlar genellikle yük anındaki gerilim düşümünün ve şebeke empedansının üreticinin belirttiği sınırın altında olmasını gerektirir."],["Gərginlik düşküsü","Voltage drop","Падение напряжения","Gerilim düşümü"],["Avadanlığın quraşdırma təlimatındakı şəbəkə empedansı və gərginlik düşküsü tələbini yoxlamaq və ölçülən qiymətlə müqayisə etmək","Check the supply impedance and voltage drop requirements in the equipment installation manual and compare with the measured values","Проверить требования к полному сопротивлению сети и падению напряжения в инструкции по установке оборудования и сравнить с измеренными значениями","Ekipman kurulum kılavuzundaki şebeke empedansı ve gerilim düşümü gereksinimlerini kontrol edip ölçülen değerle karşılaştırmak"],["Qida kabelinin kəsiyini, uzunluğunu və avtomatın nominalını yoxlamaq","Check the supply cable cross-section and length and the breaker rating","Проверить сечение и длину питающего кабеля и номинал автомата","Besleme kablosunun kesitini, uzunluğunu ve şalter değerini kontrol etmek"],["Kabel uclarını, avtomat və şin birləşmələrini sıxmaq, termovizorla yoxlamaq","Tighten cable terminations, breaker and busbar connections and check them with a thermal camera","Подтянуть кабельные наконечники, соединения автоматов и шин, проверить тепловизором","Kablo uçlarını, şalter ve bara bağlantılarını sıkmak, termal kamerayla kontrol etmek"],["UPS-in gücünün və çıxış empedansının avadanlığın pik cərəyanına uyğunluğunu yoxlamaq (pik cərəyan / UPS nominal cərəyanı)","Check that the UPS rating and output impedance suit the equipment's peak current (peak current / UPS rated current)","Проверить соответствие мощности и выходного сопротивления ИБП пиковому току оборудования (пиковый ток / номинальный ток ИБП)","UPS gücünün ve çıkış empedansının ekipmanın tepe akımına uygunluğunu kontrol etmek (tepe akımı / UPS nominal akımı)"],["Gərginlik formasının təhrifi (zəif mənbə və ya güclü qeyri-xətti yük)","Voltage waveform distortion (weak source or strong non-linear load)","Искажение формы напряжения (слабый источник или мощная нелинейная нагрузка)","Gerilim dalga şeklinin bozulması (zayıf kaynak veya güçlü doğrusal olmayan yük)"],["Gərginliyin harmonik təhrifi yük artanda yüksəlir – mənbənin daxili müqaviməti yüksəkdir və ya şəbəkədə güclü qeyri-xətti yüklər var.","Voltage harmonic distortion rises with load – the source impedance is high or there are strong non-linear loads on the network.","Гармонические искажения напряжения растут с нагрузкой – внутреннее сопротивление источника велико или в сети есть мощные нелинейные нагрузки.","Gerilim harmonik bozulması yük arttıkça yükseliyor – kaynağın iç empedansı yüksek veya şebekede güçlü doğrusal olmayan yükler var."],["Harmonik spektri yük olmadan və yük altında müqayisə etmək; mənbə tərəfdə (transformator, generator, UPS) eyni ölçməni təkrarlamaq","Compare the harmonic spectrum without load and under load; repeat the same measurement on the source side (transformer, generator, UPS)","Сравнить спектр гармоник без нагрузки и под нагрузкой; повторить измерение на стороне источника (трансформатор, генератор, ИБП)","Harmonik spektrumunu yüksüz ve yük altında karşılaştırmak; aynı ölçümü kaynak tarafında (trafo, jeneratör, UPS) tekrarlamak"],["Harmoniklər","Harmonics","Гармоники","Harmonikler"],["Qeyri-xətti yük (yüksək harmonik cərəyanları)","Non-linear load (high harmonic currents)","Нелинейная нагрузка (высокие гармонические токи)","Doğrusal olmayan yük (yüksek harmonik akımlar)"],["Neytral naqilinin kəsiyini və qızmasını yoxlamaq; lazım olduqda harmonik filtr və ya K-faktorlu transformator nəzərdən keçirmək","Check the neutral conductor cross-section and heating; consider a harmonic filter or a K-factor transformer if necessary","Проверить сечение и нагрев нейтрального проводника; при необходимости рассмотреть фильтр гармоник или трансформатор с K-фактором","Nötr iletkeninin kesitini ve ısınmasını kontrol etmek; gerekirse harmonik filtre veya K faktörlü trafo değerlendirmek"],["Qidada kəsilmə və çökmələr","Supply interruptions and dips","Прерывания и провалы питания","Beslemede kesinti ve çökmeler"],["Hadisə anlarını UPS jurnalı, ATS və generatorun işi ilə müqayisə etmək","Compare the event times with the UPS log and with ATS and generator operation","Сравнить моменты событий с журналом ИБП, работой АВР и генератора","Olay anlarını UPS kaydı, ATS ve jeneratörün çalışmasıyla karşılaştırmak"],["Kəsilmə / dip","Interruption / dip","Прерывание / провал","Kesinti / çökme"],["Yuxarı səviyyəli avtomatların və ATS-in vəziyyətini, şəbəkə tərəfdən gələn kəsintiləri yoxlamaq","Check the upstream breakers and the ATS, and interruptions coming from the utility side","Проверить вышестоящие автоматы и АВР, а также отключения со стороны сети","Üst seviye şalterleri ve ATS'yi, şebeke tarafından gelen kesintileri kontrol etmek"],["Gərginlik artımları","Voltage swells","Перенапряжения","Gerilim yükselmeleri"],["Faza gərginliyi qısa müddətə nominalın 110%-indən yuxarı qalxıb – neytralın qırılması/zəif kontaktı və ya böyük yükün açılması ehtimalı.","The phase voltage briefly rose above 110% of nominal – a broken/poorly connected neutral or the switching off of a large load is likely.","Фазное напряжение кратковременно превышало 110% номинала – вероятен обрыв/плохой контакт нейтрали или отключение мощной нагрузки.","Faz gerilimi kısa süreliğine nominalin %110'unun üzerine çıktı – nötr kopukluğu/zayıf teması veya büyük bir yükün devreden çıkması olası."],["Neytral birləşmələrini və transformatorun çıxış gərginliyini (pillə açarı) yoxlamaq","Check the neutral connections and the transformer output voltage (tap changer)","Проверить соединения нейтрали и выходное напряжение трансформатора (переключатель отпаек)","Nötr bağlantılarını ve trafonun çıkış gerilimini (kademe değiştirici) kontrol etmek"],["Gərginlik artımı","Voltage swell","Перенапряжение","Gerilim yükselmesi"],["Şəbəkə gərginliyi nominaldan uzun müddət kənardadır","Mains voltage stays off nominal for long periods","Напряжение сети длительно отклоняется от номинала","Şebeke gerilimi uzun süre nominal değerin dışında"],["Gərginlik ölçmə müddətinin əhəmiyyətli hissəsində nominalın ±10%-indən kənarda olub.","The voltage was outside ±10% of nominal for a significant part of the measurement.","Значительную часть времени измерения напряжение было вне ±10% от номинала.","Gerilim ölçüm süresinin önemli bir kısmında nominalin ±%10'unun dışındaydı."],["Transformatorun pillə açarını və qida xəttinin yüklənməsini yoxlamaq","Check the transformer tap changer and the loading of the supply line","Проверить переключатель отпаек трансформатора и загрузку питающей линии","Trafonun kademe değiştiricisini ve besleme hattının yüklenmesini kontrol etmek"],["Gərginlik səviyyəsi","Voltage level","Уровень напряжения","Gerilim seviyesi"],["Fazaların qeyri-bərabər yüklənməsi","Uneven loading of phases","Неравномерная загрузка фаз","Fazların dengesiz yüklenmesi"],["Faza cərəyanları və ya gərginlikləri arasında disbalans var, neytral əlavə yüklənir.","There is an unbalance between phase currents or voltages; the neutral is additionally loaded.","Есть несимметрия фазных токов или напряжений, нейтраль дополнительно нагружается.","Faz akımları veya gerilimleri arasında dengesizlik var, nötr ek olarak yükleniyor."],["Birfazalı yükləri fazalar arasında yenidən paylamaq","Redistribute single-phase loads across phases","Перераспределить однофазные нагрузки по фазам","Tek fazlı yükleri fazlara yeniden dağıtmak"],["Disbalans","Unbalance","Несимметрия","Dengesizlik"],["Tezliyin qeyri-stabilliyi","Frequency instability","Нестабильность частоты","Frekans kararsızlığı"],["Tezlik normadan kənara çıxıb – adətən generatordan qidalanmada müşahidə olunur.","The frequency went out of limits – usually seen when supplied from a generator.","Частота выходила за пределы нормы – обычно наблюдается при питании от генератора.","Frekans normun dışına çıktı – genellikle jeneratörden beslemede görülür."],["Generatorun sürət (tezlik) tənzimləyicisini və yük altında reaksiyasını yoxlamaq","Check the generator speed (frequency) governor and its response under load","Проверить регулятор оборотов (частоты) генератора и его реакцию под нагрузкой","Jeneratörün hız (frekans) regülatörünü ve yük altındaki tepkisini kontrol etmek"],["Tezlik","Frequency","Частота","Frekans"],["Reaktiv güc kompensasiyasını (kondensator batareyası) və onun harmoniklərə davamlılığını yoxlamaq","Check the reactive power compensation (capacitor bank) and its tolerance to harmonics","Проверить компенсацию реактивной мощности (конденсаторную установку) и её устойчивость к гармоникам","Reaktif güç kompanzasyonunu (kondansatör grubu) ve harmoniklere dayanıklılığını kontrol etmek"],["Güc əmsalı","Power factor","Коэффициент мощности","Güç faktörü"],["Ölçmə parametrləri","Measurement settings","Параметры измерения","Ölçüm parametreleri"],["Ölçməni avadanlığın tam iş rejimində (maksimum yük) və daha uzun müddət (ən azı 24 saat – 7 gün) təkrarlamaq","Repeat the measurement with the equipment in full operation (maximum load) and over a longer period (at least 24 hours – 7 days)","Повторить измерение при полной работе оборудования (максимальная нагрузка) и в течение более длительного времени (не менее 24 часов – 7 суток)","Ölçümü ekipmanın tam çalışma modunda (maksimum yük) ve daha uzun süre (en az 24 saat – 7 gün) tekrarlamak"],["Qida keyfiyyəti qənaətbəxş deyil; aşağıda göstərilən yoxlama işlərinin təxirə salınmadan aparılması tələb olunur.","The supply quality is unsatisfactory; the checks listed below must be carried out without delay.","Качество питания неудовлетворительное; перечисленные ниже проверки необходимо выполнить безотлагательно.","Besleme kalitesi yetersiz; aşağıda belirtilen kontrollerin gecikmeden yapılması gerekir."],["Qida keyfiyyəti əsasən qəbul ediləndir, lakin aşağıda göstərilən məsələlər yoxlanılmalıdır.","The supply quality is mostly acceptable, but the issues listed below should be checked.","Качество питания в целом приемлемое, однако перечисленные ниже вопросы следует проверить.","Besleme kalitesi genel olarak kabul edilebilir, ancak aşağıda belirtilen konular kontrol edilmelidir."],["Ölçmə müddətində qida keyfiyyətində ciddi uyğunsuzluq aşkar edilməmişdir.","No significant supply quality deviations were found during the measurement.","За время измерения существенных отклонений качества питания не выявлено.","Ölçüm süresince besleme kalitesinde ciddi bir uygunsuzluk tespit edilmedi."],["Qidada çökmə/kəsilmə halları var – həssas avadanlıq UPS üzərindən qidalanmalı, UPS-in batareya ehtiyatı və bypass rejimi yoxlanmalıdır.","There are supply dips/interruptions – sensitive equipment should be fed via a UPS, and the UPS battery backup and bypass mode should be checked.","Есть провалы/прерывания питания – чувствительное оборудование должно питаться через ИБП, необходимо проверить резерв батарей ИБП и режим байпаса.","Beslemede çökme/kesinti durumları var – hassas ekipman UPS üzerinden beslenmeli, UPS'in akü yedeği ve baypas modu kontrol edilmelidir."],["Gərginliyin harmonik təhrifi yüksəkdir – mənbənin gücü və harmonik filtr ehtiyacı qiymətləndirilməlidir.","Voltage harmonic distortion is high – the source capacity and the need for a harmonic filter should be assessed.","Гармонические искажения напряжения высоки – необходимо оценить мощность источника и потребность в фильтре гармоник.","Gerilim harmonik bozulması yüksek – kaynağın gücü ve harmonik filtre ihtiyacı değerlendirilmelidir."],["Yükün harmonik cərəyanları yüksəkdir – neytral naqili və transformator bunu nəzərə alaraq seçilməlidir.","The load's harmonic currents are high – the neutral conductor and transformer should be selected with this in mind.","Гармонические токи нагрузки высоки – нейтральный проводник и трансформатор следует выбирать с учётом этого.","Yükün harmonik akımları yüksek – nötr iletkeni ve trafo bu dikkate alınarak seçilmelidir."],["Yükləri fazalar arasında bərabər paylamaq tövsiyə olunur.","Distributing the loads evenly across phases is recommended.","Рекомендуется равномерно распределить нагрузки по фазам.","Yüklerin fazlara eşit dağıtılması önerilir."],["Generatorun tezlik tənzimlənməsi yoxlanmalıdır.","The generator frequency regulation should be checked.","Необходимо проверить регулирование частоты генератора.","Jeneratörün frekans ayarı kontrol edilmelidir."],["Güc əmsalının yaxşılaşdırılması (kompensasiya) nəzərdən keçirilə bilər.","Power factor correction (compensation) may be considered.","Можно рассмотреть повышение коэффициента мощности (компенсацию).","Güç faktörünün iyileştirilmesi (kompanzasyon) değerlendirilebilir."],["Ölçmə cihazı","Measuring instrument","Измерительный прибор","Ölçüm cihazı"],["Cərəyan zondları","Current probes","Токовые датчики","Akım probları"],["Ölçmə nöqtəsi","Measurement point","Точка измерения","Ölçüm noktası"],["Yer","Location","Место","Yer"],["Nominal gərginlik / tezlik","Nominal voltage / frequency","Номинальное напряжение / частота","Nominal gerilim / frekans"],["Qeyd intervalı","Logging interval","Интервал записи","Kayıt aralığı"],["Ölçmə dövrü","Measurement period","Период измерения","Ölçüm dönemi"],["Orta faza gərginliyi","Average phase voltage","Среднее фазное напряжение","Ortalama faz gerilimi"],["Maks. faza cərəyanı","Max. phase current","Макс. фазный ток","Maks. faz akımı"],["Aktiv güc","Active power","Активная мощность","Aktif güç"],["Güc əmsalı (yük altında)","Power factor (under load)","Коэффициент мощности (под нагрузкой)","Güç faktörü (yük altında)"],["THD-U (95%)","THD-U (95%)","THD-U (95%)","THD-U (%95)"],["THD-I (yük altında)","THD-I (under load)","THD-I (под нагрузкой)","THD-I (yük altında)"],["Yük impulsunda gərginlik düşküsü","Voltage drop at load pulses","Падение напряжения при импульсах нагрузки","Yük darbesinde gerilim düşümü"],["Çökmə / kəsilmə / artım","Dips / interruptions / swells","Провалы / прерывания / перенапряжения","Çökme / kesinti / yükselme"],["hesabatın öz təhlili","this report's own analysis","собственный анализ отчёта","raporun kendi analizi"],["Gərginlik disbalansı","Voltage unbalance","Несимметрия напряжения","Gerilim function vLimits(r){const B=r.bat;if(!isDisV(B))return {vw:num(B.vwarn),vf:num(B.vfail),vh:num(B.vhigh),dis:false};
  const k=(num(B.nom)||12)/12,tot=batTotal(r),vs=B.blocks.slice(0,tot).map(bV).filter(x=>x!==null),D=disLim(B);
  const av=vs.length?vs.reduce((x,y)=>x+y,0)/vs.length:null;if(av===null)return {vw:null,vf:null,vh:null,dis:true,k};
  return {vw:+(av-D.w*k).toFixed(2),vf:+Math.max(av-D.f*k,D.m*k).toFixed(2),vh:null,dis:true,k,av}}
/* discharge limits (for a 12 V block; scaled for 2 / 6 V): the report's own values, else the shared settings, else 0.25 / 0.5 / 10.5 V */

/* ---------------- calculations ---------------- */
function measStatus(r,i){const m=r.meas[i],n=mPh(r,i);if(!n)return "";const neg=/\(−\)/.test((MEAS[i]||[""])[0]);const vals=m.v.slice(0,n).map(num).filter(x=>x!==null).map(v=>neg?Math.abs(v):v);
  if(!vals.length)return "";const mn=num(m.min),mx=num(m.max);
  if(vals.some(v=>(mn!==null&&v<mn)||(mx!==null&&v>mx)))return "Norma xaricində";
  return (mn===null&&mx===null)?"Qeydə alındı":"Normal"}
const batTotal=r=>{const p=num(r.bat.per),s=num(r.bat.str);return p>0&&s>0?Math.min(MAXB,Math.floor(p)*Math.floor(s)):0};
function refEff(r){const x=num(r.bat.ref);if(x>0)return x;const rs=r.bat.blocks.slice(0,batTotal(r)).map(b=>num(b&&b.r)).filter(v=>v!==null);return median(rs)}
const bV=b=>{const v=num(b&&b.v);return v===null?null:Math.abs(v)};
function blockStatus(r,b,ref){if(!b)return "";const v=bV(b),R=num(b.r);if(v===null&&R===null)return "";
  const B=r.bat,dev=(R!==null&&ref)?R/ref-1:null,w=num(B.warn)/100,f=num(B.fail)/100,VL=vLimits(r),vw=VL.vw,vf=VL.vf,vh=VL.vh;
  if((dev!==null&&f!==null&&!isNaN(f)&&dev>=f)||(v!==null&&vf!==null&&v<vf))return "Dəyişdirilməli";
  if((dev!==null&&w!==null&&!isNaN(w)&&dev>=w)||(v!==null&&vw!==null&&v<vw)||(v!==null&&vh!==null&&v>vh))return "Diqqət";
  return "Normal"}
const lbl=(r,i)=>{const p=Math.floor(num(r.bat.per))||1;return "Q"+(Math.floor(i/p)+1)+"-B"+String(i%p+1).padStart(2,"0")};
function analyze(r){
  const tot=batTotal(r),ref=refEff(r),blocks=[];
  for(let i=0;i<tot;i++){const b=r.bat.blocks[i]||{};blocks.push({i,lab:lbl(r,i),s:Math.floor(i/(Math.floor(num(r.bat.per))||1))+1,v:bV(b),r:num(b.r),t:num(b.t),st:blockStatus(r,b,ref),dev:(num(b.r)!==null&&ref)?num(b.r)/ref-1:null})}
  const tested=blocks.filter(b=>b.st);const rv=blocks.map(b=>b.r).filter(x=>x!==null),vv=blocks.map(b=>b.v).filter(x=>x!==null);
  const rep=tested.filter(b=>b.st==="Dəyişdirilməli"),att=tested.filter(b=>b.st==="Diqqət");
  const ms=MEAS.map((_,i)=>measStatus(r,i));const out=MEAS.map((m,i)=>ms[i]==="Norma xaricində"?m[0]:null).filter(Boolean);
  const nasaz=CHK.filter((_,i)=>r.chk[i].s==="Nasaz"),qeyd=CHK.filter((_,i)=>r.chk[i].s==="Qeyd var");
  const age=yearsBetween(batInstEff(r.bat)||(r.bat.year?r.bat.year+"-07-01":""),r.svc.date),life=num(r.bat.life);
  const next=isDiag(r)?"":addMonths(r.svc.date,num(r.svc.interval));
  let overall="QƏNAƏTBƏXŞ",cls="ok";
  if(nasaz.length||rep.length||r.dis.res==="Uğursuz"){overall="TƏCİLİ MÜDAXİLƏ TƏLƏB OLUNUR";cls="bad"}
  else if(out.length||att.length||qeyd.length||(age!==null&&life>0&&age>=life)){overall="DİQQƏT TƏLƏB OLUNUR";cls="warn"}
  const strings=[];const ns=Math.min(8,Math.floor(num(r.bat.str))||0);
  for(let s=1;s<=ns;s++){const bs=blocks.filter(b=>b.s===s);const rr=bs.map(b=>b.r).filter(x=>x!==null);
    strings.push({s,n:bs.filter(b=>b.st).length,sumV:bs.reduce((a,b)=>a+(b.v||0),0),avgR:rr.length?rr.reduce((a,b)=>a+b,0)/rr.length:null,maxR:rr.length?Math.max(...rr):null,att:bs.filter(b=>b.st==="Diqqət").length,rep:bs.filter(b=>b.st==="Dəyişdirilməli").length})}
  const A={tot,ref,blocks,tested,rep,att,rv,vv,ms,out,nasaz,qeyd,age,life,next,overall,cls,strings};A.C=concl(r,A,"az");return A}
const stCls=s=>(s==="Normal"||s==="Yaxşı")?"ok":(s==="Diqqət"||s==="Qeyd var")?"warn":(s==="Dəyişdirilməli"||s==="Nasaz"||s==="Norma xaricində")?"bad":"";

const API_TIMEOUT={ping:12000,list:20000,tasks:15000,get:20000,parts:20000,ratings:15000,save:45000,photo:60000,pdf:90000};

    const res=await fetch(state.me.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),signal:ctl.signal,redirect:"follow"});

/* serial-number index: one line per device — S/N | type | brand | model | kVA | location */
const snNorm=x=>String(x||"").toLowerCase().replace(/[\s\-_.\/\\]+/g,"").replace(/^(s\/?n|sn)(?=\w)/,"");
function snsOf(r){const c=x=>String(x==null?"":x).replace(/[|\r\n]+/g," ").trim();

  return it.sn?[{sn:String(it.sn),type:"",brand:it.brand||"",model:String(it.model||"").replace(/ \(\+\d+ cihaz\)$/,""),kva:it.kva||"",loc:""}]:[]}

    snDevs(it).forEach(d=>{const k=snNorm(d.sn);if(!k||!k.includes(qn))return;(g[k]=g[k]||{sn:d.sn,exact:k===qn,hits:[]}).hits.push({...d,id:it.id,client:it.client||"",obj:it.obj||"",date:it.date||"",repno:it.repno||"",stype:it.type||"",pdf:it.pdf||""})})});

    x.hits=x.hits.filter(h=>{const k=h.id;if(seen[k])return false;seen[k]=1;return true});x.last=x.hits[0];
    x.clients=[...new Set(x.hits.map(h=>h.client.trim()).filter(Boolean))];return x})
    .sort((a,b)=>(b.exact-a.exact)||(b.last.date||"").localeCompare(a.last.date||"")).slice(0,12)}

function snHint(){const inp=document.getElementById("f-ups-sn");if(!inp||!state.rep)return;

/* sync runs in the background and never blocks work: everything is kept on the device first.

let syncFail=0;

async function sync(opt={}){
  clearTimeout(syncTimer);
  if(state.syncing){scheduleSync(4000);return}
  if(!hasServer()){updateSyncBadge();return}
  state.syncing=true;updateSyncBadge();let changed=false;
  try{
    for(const id of [...state.pending]){
      const r=state.reports[id];
      if(!r){state.pending.delete(id);continue}
      if(state.cur&&state.cur.id===id&&(state.dirty||state.saving||(state.view==="edit"&&!opt.all&&Date.now()-(state.lastEdit||0)<60000)))continue;
      try{await uploadPhotos(r);const res=await api("save",{report:r,summary:summaryOf(r),blocks:blocksOf(r),items:itemsOf(r)});
        state.pending.delete(id);state.remote[id]={...summaryOf(r),...(res.summary||{})};savePending();changed=true}
      catch(e){
        if(e.server&&e.data&&e.data.error==="conflict"&&e.data.report){
          state.reports[id]=e.data.report;state.pending.delete(id);saveLocalReports([e.data.report]);applyRemoteToOpen(id);
          toast("Bu hesabat başqa cihazda daha yeni dəyişdirilib — yeni versiya yükləndi")}
        else if(e.server&&e.data&&e.data.error==="deleted"){delete state.reports[id];state.pending.delete(id);RDB.del([id]).catch(()=>{});toast("Bir hesabat rəhbər tərəfindən silinib — bu cihazdan da çıxarıldı")}
        else if(e.server&&e.data&&e.data.error==="auth")throw e;
        else if(e.server){state.syncErr="Server xətası: "+e.message}
        else throw e}}
    savePending();
    const L=await api("list");const prevRemote=new Set(Object.keys(state.remote)),gone=new Set(L.deleted||[]);
    const sigBefore=Object.values(state.remote).map(x=>x.id+":"+x.updatedAt).sort().join(",");
    state.remote={};(L.items||[]).forEach(s=>{s.cls=clsOfOverall(s.overall);state.remote[s.id]=s});
    if(Object.values(state.remote).map(x=>x.id+":"+x.updatedAt).sort().join(",")!==sigBefore)changed=true;
    LS.set("ups.remote",Object.values(state.remote));
    /* reports deleted on the server (by the manager, from any device) disappear from this device too */
    const drop=[];for(const id of Object.keys(state.reports)){if(state.pending.has(id)||state.remote[id])continue;if(state.cur&&state.cur.id===id)continue;
      if(gone.has(id)||prevRemote.has(id)){delete state.reports[id];drop.push(id)}}
    if(drop.length){RDB.del(drop).catch(()=>{});changed=true}
    if(L.role)applyWho(L);
    if(L.settings){state.settings={...DEFAULT_SETTINGS,...L.settings};LS.set("ups.settings",state.settings)}
    try{const TK=await api("tasks");const sig=JSON.stringify(state.tasks);state.tasks=TK.tasks||[];state.taskMe=TK.me||"";if(JSON.stringify(state.tasks)!==sig)changed=true;LS.set("ups.tasks",state.tasks);LS.set("ups.taskMe",state.taskMe);notifyTasks()}catch(e){}
    /* keep a full copy of every report on the device, so that opening, lists and PDFs never need the internet */
    const need=Object.keys(state.remote).filter(id=>{const loc=state.reports[id];return !state.pending.has(id)&&(!loc||(state.remote[id].updatedAt||0)>(loc.updatedAt||0))&&!(state.cur&&state.cur.id===id&&state.dirty)});
    const got=[];for(const id of need.slice(0,opt.all?400:25)){try{const g=await api("get",{id});if(g.report){state.reports[id]=g.report;got.push(g.report);applyRemoteToOpen(id)}}catch(e){if(!e.server)break}}
    if(got.length){saveLocalReports(got);changed=true}
    state.online=true;state.lastSync=Date.now();state.syncErr="";syncFail=0;scheduleReminders();
    if(need.length>got.length&&got.length)scheduleSync(3000);
  }catch(e){
    state.online=false;syncFail++;
    state.syncErr=e&&e.message==="auth"?"API açarı yanlışdır — Ayarlarda yoxlayın":e&&e.message==="bad_response"?"Server ünvanı yanlışdır — Ayarlarda yoxlayın":"";
  }finally{
    state.syncing=false;updateSyncBadge();
    if(state.online===false)scheduleSync(nextSyncDelay());else if(state.pending.size)scheduleSync(30000);
    if(changed&&state.view==="home"&&document.activeElement?.id!=="q"){const y=window.scrollY;renderHome();window.scrollTo(0,y)}
  }}
window.addEventListener("online",()=>{syncFail=0;scheduleSync(500)});

let saveTimer=null;

function listItems(){
  const ids=new Set([...Object.keys(state.reports),...Object.keys(state.remote)]);const out=[];
  ids.forEach(id=>{const loc=state.reports[id],rem=state.remote[id];
    if(loc){const s=summaryOf(normalize(clone(loc)));out.push({...s,local:true,pending:state.pending.has(id),remote:!!rem,pdf:rem&&rem.pdf})}

/* ---------------- planned-service reminders ---------------- */
const REMIND_DAYS=2;
function upcomingAll(){const latest={};
  listItems().forEach(it=>{if(it.local&&state.reports[it.id]&&state.reports[it.id].sample)return;
    const key=it.sn?"sn:"+String(it.sn).toLowerCase():"c:"+String(it.client||"").toLowerCase()+"|"+String(it.obj||"").toLowerCase();
    if(!latest[key]||(it.date||"")>(latest[key].date||""))latest[key]=it});
  const now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  return Object.values(latest).map(it=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(it.next||"");if(!m)return null;
    const due=new Date(+m[1],+m[2]-1,+m[3]).getTime(),days=Math.round((due-t0)/864e5);
    return {...it,days,at:due-REMIND_DAYS*864e5+9*3600e3}}).filter(Boolean).sort((a,b)=>a.days-b.days)}
function upcomingBanner(){const u=upcomingAll().filter(x=>x.days<=REMIND_DAYS&&x.days>=-30);if(!u.length)return "";
  const when=d=>d<0?`<b style="color:var(--bad)">${-d} gün gecikir</b>`:d===0?"<b>bu gün</b>":d===1?"<b>sabah</b>":`<b>${d} gün sonra</b>`;
  return `<div class="card remind" role="status"><h3>Planlı servis yaxınlaşır</h3>${u.map(x=>`<button class="rrow" data-open="${esc(x.id)}"><span>${esc(x.client||"Adsız müştəri")}${x.obj?` · <span class="note">${esc(x.obj)}</span>`:""}<br><span class="note">${esc([x.brand,x.model].filter(Boolean).join(" "))}${x.sn?" · S/N "+esc(x.sn):""}</span></span><span style="text-align:right">${esc(fmtDate(x.next))}<br>${when(x.days)}</span></button>`).join("")}</div>`}
let remindSig="";
async function scheduleReminders(){if(!IS_APP)return;
  try{const LN=(Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications)||Capacitor.registerPlugin("LocalNotifications");
    const list=upcomingAll().filter(u=>u.at>Date.now()).slice(0,60);
    const sig=list.map(u=>u.id+u.next).join(",");if(sig===remindSig||sig===LS.get("ups.remindSig"))return;
    let perm=await LN.checkPermissions();if(perm.display!=="granted"){perm=await LN.requestPermissions();if(perm.display!=="granted")return}
    const pend=await LN.getPending();const old=(pend.notifications||[]).filter(n=>n.id>=1000&&n.id<2000);if(old.length)await LN.cancel({notifications:old.map(n=>({id:n.id}))});
    if(list.length)await LN.schedule({notifications:list.map((u,i)=>({id:1000+i,title:"Planlı servis 2 gün sonradır",
      body:(u.client||"Müştəri")+(u.obj?" ("+u.obj+")":"")+" — "+[u.brand,u.model].filter(Boolean).join(" ")+(u.sn?", S/N "+u.sn:"")+". Tarix: "+fmtDate(u.next),

  const upd=(k,el)=>{const blk=ensureBlock(state.bi);if(k==="v"&&/^\s*[-−–]/.test(el.value))el.value=el.value.replace(/^\s*[-−–]\s*/,"");blk[k]=el.value;markDirty();liveProbe()};
  $("#pV").oninput=e=>upd("v",e.target);$("#pR").oninput=e=>upd("r",e.target);$("#pT").oninput=e=>upd("t",e.target);
  $("#pV").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("#pR").focus()}};
  $("#pR").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go(1)}};
  $("#pT").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go(1)}};
  $("#pPrev").onclick=()=>go(-1);$("#pNext").onclick=()=>go(1);
  renderStats()}
function liveProbe(){const r=state.cur,b=r.bat.blocks[state.bi]||{},ref=refEff(r),st=blockStatus(r,b,ref),c=$("#probe .chip");
  const dev=(num(b.r)!==null&&ref)?Math.round((num(b.r)/ref-1)*100):null;c.className="chip "+stCls(st);c.textContent=st+(dev!==null?" · "+(dev>=0?"+":"")+dev+"%":"");
  const cell=document.querySelector(`.cell[data-b="${state.bi}"]`);if(cell)cell.className="cell cur "+stCls(st);renderStats()}
function go(d){const tot=batTotal(state.cur);const n=state.bi+d;if(n<0)return;if(n>=tot){toast("Bütün bloklar daxil edildi");renderGrid();return}
  state.bi=n;renderProbe();renderGrid();const v=$("#pV");v.focus();v.select()}
function renderGrid(){const r=state.cur,a=analyze(r),p=Math.floor(num(r.bat.per)),ns=Math.ceil(a.tot/p);let h="";
  for(let s=0;s<ns;s++){const bs=a.blocks.slice(s*p,s*p+p);h+=`<div class="sline"><div class="sl">Qrup ${s+1}<span style="font-weight:500;letter-spacing:0;text-transform:none">${bs.filter(b=>b.st).length}/${bs.length} ölçülüb</span></div><div class="cells">`+
    bs.map(b=>`<button class="cell ${stCls(b.st)}${b.i===state.bi?" cur":""}" data-b="${b.i}" aria-label="${b.lab} ${b.st||"ölçülməyib"}">${b.i%p+1}</button>`).join("")+`</div></div>`}
  $("#bgrid").innerHTML=h;
  document.querySelectorAll(".cell").forEach(c=>c.onclick=()=>{state.bi=+c.dataset.b;renderProbe();renderGrid();$("#probe").scrollIntoView({behavior:"smooth",block:"start"});setTimeout(()=>{const v=$("#pV");if(v)v.focus({preventScroll:true})},300)})}
function renderStats(){const a=analyze(state.cur);const norm=a.tested.length-a.att.length-a.rep.length;
  $("#bstats").innerHTML=`<div class="stat"><b>${a.tested.length}/${a.tot}</b><span>ölçülüb</span></div><div class="stat"><b>${a.ref?fmt(a.ref):"—"}</b><span>referans R, mΩ</span></div><div class="stat"><b>${a.rv.length?fmt(Math.max(...a.rv)):"—"}</b><span>maks R, mΩ</span></div>
  <div class="stat ok"><b>${norm}</b><span>normal</span></div><div class="stat warn"><b>${a.att.length}</b><span>diqqət</span></div><div class="stat bad"><b>${a.rep.length}</b><span>dəyişdirilməli</span></div>`}

        <td class="c">${w.ok+w.late?`<span class="chip ok">${w.ok}</span> / <span class="chip ${w.late?"bad":""}">${w.late}</span>`:"—"}</td><td class="c"><span class="chip ${f==null?"":f>=85?"ok":f>=60?"warn":"bad"}">${f==null?"—":Math.round(f)+"%"}</span></td><td class="c">${w.bad||"—"}</td><td class="c">${w.rep||"—"}</td><td class="c">${sc==null?"—":"★ "+sc.toFixed(1)+` <span class="note">(${w.sc.length})</span>`}</td><td class="c">${tk.given?tk.done+" / "+tk.given:"—"}</td></tr>`}).join("")}</table></div>`:`<p class="note">Bu dövrdə hesabat yoxdur.</p>`}

        <td class="c">${s.fill==null||s.fill===""?"—":s.fill+"%"}</td><td class="c">${s.id in OT?(OT[s.id]<=7?'<span class="chip ok">bəli</span>':`<span class="chip bad">+${OT[s.id]} gün</span>`):"—"}</td><td class="c">${it.bad} / ${it.rep}</td>

    document.querySelectorAll("#stBox [data-rate]").forEach(b=>b.onclick=async()=>{const s=listItems().find(x=>x.id===b.dataset.rate);if(!s)return;const cur=(state.ratings||{})[s.id]||{};
      const v=+b.dataset.v===cur.score?0:+b.dataset.v;try{await saveRating(s,v,cur.note||"");draw()}catch(e){toast("Saxlamaq alınmadı")}});
    const exp=kind=>{const rws=state.stRows||[];if(!rws.length){toast("Bu dövrdə məlumat yoxdur");return}const per=PERIODS.find(x=>x[0]===state.stP)[1];

      const data=rws.map(w=>{const f=avg(w.fill),sc=avg(w.sc);return [w.name,w.list.length,w.plan,w.em,w.diag,w.dev,w.ok,w.late,f==null?"":Math.round(f),w.bad,w.rep,sc==null?"":+sc.toFixed(1),w.sc.length]});
      const body=`<div class="blk"><table><tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr>${data.map(r=>`<tr>${r.map((v,i)=>`<td class="${i?"c":""}">${esc(v)}</td>`).join("")}</tr>`).join("")}</table></div>`+

    $("#stPdf").onclick=()=>exp("pdf");$("#stXls").onclick=()=>exp("xlsx")};

/* ================= tapşırıqlar ================= */
const myOpenTasks=()=>(state.tasks||[]).filter(t=>t.status==="Açıq"&&(state.me.role==="admin"||!state.taskMe||t.wids.includes(state.taskMe)));
function taskDays(t){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(t.date||"");if(!m)return null;const n=new Date();return Math.round((new Date(+m[1],+m[2]-1,+m[3])-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/864e5)}
const taskWhen=t=>{const d=taskDays(t);return d===null?"":d<0?`<b style="color:var(--bad)">${-d} gün gecikir</b>`:d===0?"<b>bu gün</b>":d===1?"<b>sabah</b>":fmtDate(t.date)};
function tasksBanner(){const L=myOpenTasks().sort((a,b)=>(a.date||"9").localeCompare(b.date||"9")).slice(0,5);if(!L.length)return "";
  return `<div class="card remind" role="status"><h3>${state.me.role==="admin"?"Açıq tapşırıqlar":"Sizin tapşırıqlarınız"} (${myOpenTasks().length})</h3>${L.map(t=>`<button class="rrow" data-topen="${esc(t.id)}"><span>${t.prio==="Təcili"?'<span class="chip bad">Təcili</span> ':""}<b>${esc(t.title)}</b><br><span class="note">${esc([t.client,t.obj].filter(Boolean).join(" · "))}${state.me.role==="admin"&&t.names?" — "+esc(t.names):""}</span></span><span style="text-align:right">${taskWhen(t)||"—"}</span></button>`).join("")}</div>`}
function taskStat(name,P){const L=(state.tasks||[]).filter(t=>inPeriod(String(t.date||t.created).slice(0,10),P));
  return {given:L.filter(t=>String(t.names||"").split(", ").includes(name)).length,done:L.filter(t=>t.status==="Görülüb"&&t.doneBy===name).length}}
/* phone notification for a new task + a reminder on the task's day */
async function notifyTasks(){const mine=(state.tasks||[]).filter(t=>t.status==="Açıq"&&state.taskMe&&t.wids.includes(state.taskMe));
  const seenRaw=LS.get("ups.seenTasks"),seen=new Set(seenRaw||[]),fresh=seenRaw?mine.filter(t=>!seen.has(t.id)):[];
  mine.forEach(t=>seen.add(t.id));LS.set("ups.seenTasks",[...seen].slice(-500));
  const body=t=>[t.client,t.obj].filter(Boolean).join(" · ")+(t.date?" — "+fmtDate(t.date):"")+(t.addr?" — "+t.addr:"");
  if(fresh.length&&state.view==="home")renderHome();
  if(IS_APP){try{const LN=(Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications)||Capacitor.registerPlugin("LocalNotifications");
      let perm=await LN.checkPermissions();if(perm.display!=="granted"){perm=await LN.requestPermissions();if(perm.display!=="granted")return}
      const now=Date.now(),N=fresh.map((t,i)=>({id:5000+((now/1000|0)%400)*10+i,title:(t.prio==="Təcili"?"TƏCİLİ tapşırıq: ":"Yeni tapşırıq: ")+t.title,body:body(t),schedule:{at:new Date(now+1500),allowWhileIdle:true}}));
      const day=mine.map(t=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(t.date||"");if(!m)return null;const at=new Date(+m[1],+m[2]-1,+m[3],8,30).getTime();return at>now+60000?{t,at}:null}).filter(Boolean).slice(0,80);
      const sig=day.map(x=>x.t.id+x.at).join(",");
      if(sig!==LS.get("ups.taskSig")){const pend=await LN.getPending();const old=(pend.notifications||[]).filter(n=>n.id>=3000&&n.id<4000);if(old.length)await LN.cancel({notifications:old.map(n=>({id:n.id}))});
        day.forEach((x,i)=>N.push({id:3000+i,title:"Bu gün tapşırıq: "+x.t.title,body:body(x.t),schedule:{at:new Date(x.at),allowWhileIdle:true}}));LS.set("ups.taskSig",sig)}
      if(N.length)await LN.schedule({notifications:N})}catch(e){}}
  else if(fresh.length){toast("Yeni tapşırıq: "+fresh[0].title+(fresh.length>1?" (+"+(fresh.length-1)+")":""));
    try{if(window.Notification&&Notification.permission==="granted")fresh.forEach(t=>new Notification("Yeni tapşırıq: "+t.title,{body:body(t)}))}catch(e){}}}
async function refreshTasks(){try{const TK=await api("tasks");state.tasks=TK.tasks||[];state.taskMe=TK.me||"";LS.set("ups.tasks",state.tasks);LS.set("ups.taskMe",state.taskMe);return true}
  catch(e){if(e&&e.message==="unknown_action")toast("Serverdə Code.gs yenilənməyib — yeni Code.gs-i yapışdırıb Deploy edin");return false}}
function renderTasks(focus){state.view="tasks";$("#tabs").hidden=true;$("#hBack").hidden=false;$("#hSettings").hidden=true;

   ${!adm&&!state.me.personal?'<div class="banner" style="margin:0 0 12px">Tapşırıqları görmək üçün rəhbərdən şəxsi açar alın və Ayarlar → Açar sahəsinə yazın.</div>':""}
   <div class="actions">${adm?'<button class="btn pri" id="tkNew">+ Yeni tapşırıq</button>':""}${[["open","Açıq"],["done","Görülmüş"],["all","Hamısı"]].map(([k,l])=>`<button class="btn sm${k===F?" pri":""}" data-tkf="${k}">${l}</button>`).join("")}<button class="btn sm" id="tkRe">Yenilə</button></div>

     ${t.note?`<div>${esc(t.note)}</div>`:""}
     <div class="note">${adm?"İşçilər: <b>"+esc(t.names||"—")+"</b> · ":""}Verən: ${esc(t.by||"—")}${t.status==="Görülüb"?` · <b style="color:var(--ok)">Görən: ${esc(t.doneBy||"—")}</b>`:""}${t.doneNote?" · "+esc(t.doneNote):""}</div>
     <div class="actions">${t.status==="Açıq"?`<button class="btn sm pri" data-tkgo="${esc(t.id)}">Hesabatı başlat</button><button class="btn sm" data-tkdone="${esc(t.id)}">Görüldü</button>`:""}
       ${t.report?`<button class="btn sm" data-tkrep="${esc(t.report)}">Hesabatı aç</button>`:""}${t.status!=="Açıq"?`<button class="btn sm ghost" data-tkundo="${esc(t.id)}">Yenidən aç</button>`:""}
       ${adm?`<button class="btn sm" data-tked="${esc(t.id)}">Düzəlt</button><button class="btn sm danger" data-tkdel="${esc(t.id)}">Sil</button>`:""}</div>
     <div class="tkdone" id="tkd-${esc(t.id)}" hidden><label class="f"><span>Qeyd (istəyə görə)</span><input id="tkn-${esc(t.id)}" placeholder="məs. ventilyator dəyişdirildi"></label><div class="actions"><button class="btn sm pri" data-tkok="${esc(t.id)}">Təsdiq — görüldü</button></div></div>
   </div>`).join(""):`<div class="empty"><p class="note" style="margin:0">${F==="open"?"Açıq tapşırıq yoxdur.":"Siyahı boşdur."}</p></div>`}</div>
   <button class="btn ghost" id="tkBack" style="margin-top:12px">← Geri</button>`;
  $("#tkBack").onclick=renderHome;document.querySelectorAll("[data-tkf]").forEach(b=>b.onclick=()=>{state.tkF=b.dataset.tkf;renderTasks()});
  $("#tkRe").onclick=async()=>{if(await refreshTasks())renderTasks()};
  if(adm)$("#tkNew").onclick=()=>taskForm({title:"",client:"",obj:"",addr:"",date:todayISO(),prio:"Normal",wids:[],note:""},()=>renderTasks());
  const T=id=>(state.tasks||[]).find(x=>x.id===id);
  document.querySelectorAll("[data-tked]").forEach(b=>b.onclick=()=>taskForm({...T(b.dataset.tked)},()=>renderTasks()));
  document.querySelectorAll("[data-tkdel]").forEach(b=>b.onclick=async()=>{if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Silinsin?";return}

  document.querySelectorAll("[data-tkok]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{const r=await api("task_done",{id:b.dataset.tkok,note:$("#tkn-"+b.dataset.tkok).value.trim()});state.tasks=r.tasks||[];LS.set("ups.tasks",state.tasks);toast("Tapşırıq sizin adınıza görülmüş qeyd olundu");renderTasks()}catch(e){b.disabled=false;toast("Alınmadı (internet?)")}});
  document.querySelectorAll("[data-tkundo]").forEach(b=>b.onclick=async()=>{try{const r=await api("task_done",{id:b.dataset.tkundo,undo:true});state.tasks=r.tasks||[];LS.set("ups.tasks",state.tasks);renderTasks()}catch(e){toast("Alınmadı")}});

/* new report from a task: the customer's latest report is copied (devices, set-up); otherwise a blank report with the customer data */
async function startFromTask(t){if(!t)return;const key=s=>String(s||"").trim().toLowerCase();
  const prev=listItems().filter(x=>key(x.client)===key(t.client)&&(!t.obj||!x.obj||key(x.obj)===key(t.obj))&&!(state.reports[x.id]&&state.reports[x.id].sample)).sort((a,b)=>(b.date||"").localeCompare(a.date||""))[0];
  const go=r=>{r.taskId=t.id;if(!r.cl.name)r.cl.name=t.client||"";if(!r.cl.obj)r.cl.obj=t.obj||"";if(!r.cl.addr)r.cl.addr=t.addr||"";startReport(r);state.tab="svc";renderEditor();toast("Tapşırıq üçün hesabat açıldı — saxlananda tapşırıq sizin adınıza görülmüş sayılacaq")};
  if(prev){try{go(nextFrom(normalize(clone(await getFull(prev.id)))));return}catch(e){}}
  typePicker("Xidmət olunacaq cihaz nədir?","“"+(t.client||"Müştəri")+"” üçün əvvəlki hesabat tapılmadı. Cihaz növünü seçin.",tp=>go(blankReport(state.settings,tp)),()=>renderTasks())}

    if(!task.title){toast("Tapşırığı yazın");return}if(!task.wids.length){toast("Ən azı bir işçi seçin");return}
    const b=$("#tfSave");b.disabled=true;try{const r=await api("task_save",{task});state.tasks=r.tasks||[];LS.set("ups.tasks",state.tasks);toast(t.id?"Tapşırıq yeniləndi":"Tapşırıq verildi — işçinin telefonunda bildiriş çıxacaq");state.tkF="open";renderTasks()}
    catch(e){b.disabled=false;toast(e&&e.message==="unknown_action"?"Serverdə Code.gs yenilənməyib":"Alınmadı (internet?)")}};window.scrollTo(0,0)}


/* ================= elektron imza: müştəri və servis mühəndisi ekranda imzalayır ================= */
const fmtDT=iso=>{const d=new Date(iso||"");if(isNaN(d))return "";const p=x=>String(x).padStart(2,"0");return p(d.getDate())+"."+p(d.getMonth()+1)+"."+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes())};
function sigCard(){const r=realOf(state.rep),S=r.sig||{};
  const box=(k,label,name)=>{const x=S[k];return `<div class="sigslot"><b>${label}</b>${x&&x.img?`<img src="${x.img}" alt="İmza"><span class="note">${esc(x.name||name||"")} · ${esc(fmtDT(x.at))}</span>
    <div class="actions"><button class="btn sm" data-sign="${k}">Yenidən imzala</button><button class="btn sm ghost" data-signdel="${k}">Sil</button></div>`
    :`<div class="sigempty">İmzalanmayıb</div><button class="btn pri" data-sign="${k}">✍ İmzala</button>`}</div>`};
  return `<div class="card"><h3>İmzalar</h3><p class="note" style="margin:0">“İmzala” basın — ekranda açılan sahədə barmaqla və ya qələmlə imza atın. İmza hesabata (PDF, Excel, çap) avtomatik düşür.</p>
   <div class="grid2">${box("eng","Servis mühəndisi",r.svc.eng)}${clSigners(r).map((c,i)=>box(c.k,(c.co||c.pos?esc([c.co,c.pos].filter(Boolean).join(" ")):"Müştəri nümayəndəsi"+(i?" "+(i+1):"")),c.name)).join("")}</div></div>`}
function openSignPad(kind){const r=realOf(state.rep);const isCl=String(kind).indexOf("cl")===0,C=isCl?(clSigners(r).find(c=>c.k===kind)||clSigners(r)[0]):null;
  const ov=document.createElement("div");ov.className="sigpad";ov.setAttribute("role","dialog");ov.setAttribute("aria-modal","true");
  ov.innerHTML=`<div class="sp-in"><div class="sp-head"><b>${isCl?"Müştəri nümayəndəsinin imzası":"Servis mühəndisinin imzası"}</b><button class="btn sm ghost" id="spX" aria-label="Bağla">✕</button></div>
   <label class="f"><span>Ad, soyad</span><input id="spName" value="${esc(isCl?C.name:(r.svc.eng||state.me.name||""))}"></label>${isCl?`<label class="f"><span>Vəzifəsi</span><input id="spPos" value="${esc(C.pos)}"></label><label class="f"><span>Şirkət / şöbə</span><input id="spCo" value="${esc(C.co)}"></label>`:""}
   <div class="sp-area"><canvas id="spCv"></canvas><span class="sp-hint" id="spHint">Burada barmaqla və ya qələmlə imza atın</span><span class="sp-line"></span></div>
   <div class="actions sp-btns"><button class="btn" id="spClear">Təmizlə</button><button class="btn ghost" id="spCancel">Ləğv et</button><button class="btn pri" id="spOk">Təsdiq et</button></div></div>`;
  document.body.appendChild(ov);document.body.style.overflow="hidden";
  const cv=ov.querySelector("#spCv"),area=ov.querySelector(".sp-area"),ctx=cv.getContext("2d");let strokes=[],cur=null,dpr=1;
  const size=()=>{const w=area.clientWidth,h=area.clientHeight;dpr=window.devicePixelRatio||1;cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+"px";cv.style.height=h+"px";redraw()};
  const seg=(p0,p1,p2)=>{ctx.lineWidth=p1.w*dpr;ctx.beginPath();if(!p2){ctx.moveTo(p0.x*dpr,p0.y*dpr);ctx.lineTo(p1.x*dpr,p1.y*dpr)}else{const m1={x:(p0.x+p1.x)/2,y:(p0.y+p1.y)/2},m2={x:(p1.x+p2.x)/2,y:(p1.y+p2.y)/2};ctx.moveTo(m1.x*dpr,m1.y*dpr);ctx.quadraticCurveTo(p1.x*dpr,p1.y*dpr,m2.x*dpr,m2.y*dpr)}ctx.stroke()};
  function redraw(){ctx.clearRect(0,0,cv.width,cv.height);ctx.strokeStyle=ctx.fillStyle="#0B1F4D";ctx.lineCap=ctx.lineJoin="round";strokes.forEach(S=>{if(S.length===1){ctx.beginPath();ctx.arc(S[0].x*dpr,S[0].y*dpr,S[0].w*dpr/2,0,7);ctx.fill()}else for(let i=1;i<S.length;i++)seg(i>1?S[i-2]:S[i-1],S[i-1],S[i])})}
  const pt=e=>{const b=cv.getBoundingClientRect(),pr=e.pointerType==="pen"&&e.pressure>0?e.pressure:0.5;return {x:e.clientX-b.left,y:e.clientY-b.top,w:1.4+pr*2.6}};
  cv.addEventListener("pointerdown",e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);cur=[pt(e)];strokes.push(cur);ov.querySelector("#spHint").hidden=true;redraw()});
  cv.addEventListener("pointermove",e=>{if(!cur)return;e.preventDefault();const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];evs.forEach(x=>cur.push(pt(x)));
    ctx.strokeStyle="#0B1F4D";ctx.lineCap=ctx.lineJoin="round";const n=cur.length;if(n>=3)seg(cur[n-3],cur[n-2],cur[n-1]);else if(n===2)seg(cur[0],cur[1])});
  const end=()=>{cur=null};cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);cv.addEventListener("pointerleave",end);
  const close=()=>{window.removeEventListener("resize",size);ov.remove();document.body.style.overflow="";state.sigOpen=null};state.sigOpen=close;
  ov.querySelector("#spX").onclick=close;ov.querySelector("#spCancel").onclick=close;
  ov.querySelector("#spClear").onclick=()=>{strokes=[];ov.querySelector("#spHint").hidden=false;redraw()};
  ov.querySelector("#spOk").onclick=()=>{const P=[].concat(...strokes);if(P.length<8){toast("İmza atılmayıb");return}
    let x0=Math.min(...P.map(p=>p.x)),y0=Math.min(...P.map(p=>p.y)),x1=Math.max(...P.map(p=>p.x)),y1=Math.max(...P.map(p=>p.y));const pad=6;x0-=pad;y0-=pad;x1+=pad;y1+=pad;
    const H=140,k=Math.min(H/(y1-y0),520/(x1-x0),2),out=document.createElement("canvas");out.width=Math.max(20,Math.round((x1-x0)*k));out.height=Math.max(20,Math.round((y1-y0)*k));
    const o=out.getContext("2d");o.drawImage(cv,x0*dpr,y0*dpr,(x1-x0)*dpr,(y1-y0)*dpr,0,0,out.width,out.height);
    r.sig=r.sig||{};const name=ov.querySelector("#spName").value.trim();const pos=isCl?ov.querySelector("#spPos").value.trim():"";r.sig[kind]={img:out.toDataURL("image/png"),name,at:new Date().toISOString()};if(pos)r.sig[kind].pos=pos;
    const sco=isCl?ov.querySelector("#spCo").value.trim():"";
    if(kind==="cl"){if(name&&!r.cl.sign)r.cl.sign=name;if(pos)r.cl.pos=pos;r.cl.sco=sco}else if(isCl&&C.x){if(name&&!C.x.name)C.x.name=name;if(pos)C.x.pos=pos;C.x.co=sco}if(!isCl&&name&&!r.svc.eng)r.svc.eng=name;
    markDirty();close();toast(isCl?"Müştərinin imzası əlavə olundu":"Mühəndisin imzası əlavə olundu");const y=window.scrollY;renderEditor();window.scrollTo(0,y)};
  window.addEventListener("resize",size);requestAnimationFrame(size)}

/* daily automatic backup of all reports into the chosen folder (Windows, when the folder permission is already given) */
async function autoBackup(){try{if(!canDir()||LS.get("ups.lastBackup")===todayISO())return;const root=await getRoot();if(!root)return;
  if(await root.queryPermission({mode:"readwrite"})!=="granted")return;const d=await root.getDirectoryHandle("_Yedek",{create:true});
  const fh=await d.getFileHandle("UPS-servis-yedek-"+todayISO()+".json",{create:true}),w=await fh.createWritable();
  await w.write(new Blob([JSON.stringify({app:"ups-servis",v:2,reports:Object.values(state.reports)})],{type:"application/json"}));await w.close();LS.set("ups.lastBackup",todayISO())}catch(e){}}
/* ---------------- boot ---------------- */
$("#hBack").onclick=async()=>{await flush();state.cur=null;state.rep=null;renderHome();sync()};
$("#hSettings").onclick=renderSettings;
/* screen mode: Avto (follows the phone / Windows setting) → İşıqlı → Qaranlıq; remembered on this device */
const THEMES=[["auto","◐ Avto"],["light","☀ İşıqlı"],["dark","☾ Qaranlıq"]];
function applyTheme(m){if(m==="light"||m==="dark")document.documentElement.setAttribute("data-theme",m);else document.documentElement.removeAttribute("data-theme");
  const b=$("#hTheme");if(b){const T=THEMES.find(x=>x[0]===m)||THEMES[0];b.innerHTML=T[1].slice(0,1)+'<span class="tl"> '+T[1].slice(2)+"</span>";b.title="Ekran modu: "+T[1].slice(2)}
  const dark=m==="dark"||(m!=="light"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
  const mc=document.querySelector('meta[name="theme-color"]');if(mc)mc.content=dark?"#0F1513":"#EDF1EF"}
applyTheme(LS.get("ups_theme")||"auto");
$("#hTheme").onclick=()=>{const cur=LS.get("ups_theme")||"auto",i=THEMES.findIndex(x=>x[0]===cur),nx=THEMES[(i+1)%THEMES.length][0];LS.set("ups_theme",nx);applyTheme(nx);toast("Ekran modu: "+THEMES.find(x=>x[0]===nx)[1].slice(2))};
window.addEventListener("resize",fitPaper);
if(IS_APP){try{const AP=(Capacitor.Plugins&&Capacitor.Plugins.App)||Capacitor.registerPlugin("App");
  AP.addListener("resume",()=>scheduleSync(300));
  AP.addListener("backButton",async()=>{if(state.sigOpen){state.sigOpen();return}if(["edit","settings","lists","plan","staff","tasks"].includes(state.view)){await flush();state.cur=null;state.rep=null;renderHome();sync()}else AP.exitApp()})}catch(e){}}
loadLocal();
(async()=>{await loadReportsDB();if(!state.me.name)renderWelcome();else{renderHome();sync();autoBackup()}})();
</script>
