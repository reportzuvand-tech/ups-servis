<style>

  --ok:#74D39C; --ok-bg:#173327; --warn:#F0C45E; --warn-bg:#3A2F12; --bad:#FF8E7E; --bad-bg:#3E1D19; --idle:#6F7E79;
  color-scheme:dark}}
:root[data-theme="dark"]{

  color-scheme:dark}

/* checklist */

.seg{display:flex;gap:4px;flex-wrap:wrap}

.seg button[aria-pressed="true"].s-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.seg button[aria-pressed="true"].s-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}

.probe .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.strings{display:grid;gap:10px}
.sline{display:grid;gap:6px}
.sline .sl{font:700 12px var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px}

.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:8px;padding:10px}
.stat b{display:block;font:500 20px var(--f-num);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);font-weight:600}
.stat.ok b{color:var(--ok)} .stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)}

.rlist{display:grid;gap:10px}
.rcard{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer}
.rcard .t{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;display:grid;gap:12px;justify-items:start}
.empty h3{margin:0;font:700 20px var(--f-disp);text-transform:uppercase}

.verdict.ok{background:var(--ok-bg);color:var(--ok)} .verdict.warn{background:var(--warn-bg);color:var(--warn)} .verdict.bad{background:var(--bad-bg);color:var(--bad)}
.verdict small{display:block;font:500 13px/1.4 var(--f-body);text-transform:none;letter-spacing:0;margin-top:6px;color:var(--ink)}
ul.concl{margin:0;padding-left:18px;display:grid;gap:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.nextbar{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
#hTheme{min-width:42px;font-size:15px}@media (max-width:600px){#hTheme .tl{display:none}}
.dlist{display:grid;gap:6px}.drow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}.drow .k{font:500 12px var(--f-num);color:var(--muted)}.drow .dn{flex:1;min-width:0;display:grid}.drow .dn small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rwrap{position:relative}.rwrap.hasdel .rcard{padding-right:64px;padding-bottom:18px}.rdel{position:absolute;right:10px;bottom:8px;min-width:44px;min-height:32px;line-height:1;border:1px solid var(--line);background:var(--surface);color:var(--bad);border-radius:8px;cursor:pointer;font:600 14px var(--f-body);padding:4px 10px}.rdel.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.ltbl{border-collapse:collapse;width:100%;font-size:13px}.ltbl th,.ltbl td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}.ltbl th{background:var(--surface2);font-size:12px;position:sticky;top:0}.ltbl td.c,.ltbl th:not([style]){text-align:center}.ltbl .msep td{background:var(--surface2);font:700 12px var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.ltbl tr.pl-done td{background:var(--ok-bg)}.ltbl tr.pl-over td{background:var(--bad-bg)}.ltbl tr.pl-soon td{background:var(--warn-bg)}.ltbl a{color:var(--accent)}
.stars{display:inline-flex;gap:2px}.star{border:0;background:none;font-size:22px;line-height:1;color:var(--line);cursor:pointer;padding:2px}.star.on{color:#E0A100}

.sp-head{display:flex;justify-content:space-between;align-items:center}.sp-area{position:relative;background:#fff;border:2px dashed #8A9893;border-radius:10px;min-height:160px;overflow:hidden;touch-action:none}.sp-area canvas{position:absolute;inset:0;touch-action:none;cursor:crosshair}

.note{font-size:12px;color:var(--muted)}

.paperwrap{overflow:hidden;border-radius:6px;border:1px solid var(--line);background:var(--paper)}
.paperscale{transform-origin:0 0}

.dchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.dchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dchip .k{font:500 11px var(--f-num);opacity:.75}
.paper h5{margin:9px 0 0;padding:2px 0;font:700 10.5px var(--f-disp);letter-spacing:.05em;text-transform:uppercase;color:var(--paper-head);border-bottom:1px solid var(--paper-line)}
.paper h4.devh{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;padding:6px 8px;margin-top:14px}
.paper h4.devh b{padding:2px 8px;border-radius:3px;font-size:10px;letter-spacing:.03em}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ph-item{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid}
.ph-item img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--surface2);display:block}
.ph-item figcaption{padding:10px;display:grid;gap:8px}
.paper .prow2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.paper .pfig{margin:0;border:1px solid var(--paper-line);padding:4px;display:grid;gap:4px;align-content:start}
.paper .pfig .pbox{height:250px;display:flex;align-items:center;justify-content:center;background:#F4F6F5;overflow:hidden}
.paper .pfig .pbox img{max-width:100%;max-height:250px;width:auto;height:auto;display:block}
.paper .pfig figcaption{font-size:9.5px}
.paper .pmiss{height:250px;display:grid;place-items:center;background:#F4F6F5;color:#55605C;font-size:10px}
.pb{break-before:page;page-break-before:always}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

san UPS log file.","Файл слишком мал – это не журнал ИБП Makelsan.","Dosya çok küçük – Makelsan UPS kayıt dosyası değil."],["Faylda hadisə qeydi tapılmadı (0x40000 ünvanı boşdur).","No event records found in the file (address 0x40000 is empty).","В файле не найдено записей событий (адрес 0x40000 пуст).","Dosyada olay kaydı bulunamadı (0x40000 adresi boş)."],["müddət məlum deyil","duration unknown","длительность неизвестна","süre bilinmiyor"],["batareya tam boşaldı!","battery fully discharged!","батарея полностью разряжена!","akü tamamen boşaldı!"],["batareya aşağı","battery low","низкий заряд батареи","akü düşük"],["UPS çıxışı söndü (şəbəkə gəlmədən)","UPS output switched off (before mains returned)","Выход ИБП отключился (до возврата сети)","UPS çıkışı kapandı (şebeke gelmeden)"],["Şəbəkə kəsintiləri (batareya rejimi)","Mains failures (battery mode)","Отключения сети (режим батареи)","Şebeke kesintileri (akü modu)"],["UPS şəbəkə itkisi səbəbindən batareya rejiminə keçib (E066 → E065).","The UPS switched to battery mode due to mains loss (E066 → E065).","ИБП перешёл в режим батареи из-за пропадания сети (E066 → E065).","UPS şebeke kaybı nedeniyle akü moduna geçti (E066 → E065)."],["Girişdə faza itkisi / kəskin faza disbalansı","Input phase loss / severe phase imbalance","Пропадание фазы на входе / сильный перекос фаз","Girişte faz kaybı / ciddi faz dengesizliği"],["Fazalardan biri itib və ya gərginliklər kəskin fərqlənir (qırıq neytral, zəif kontakt, avtomat). Giriş kabelləri, klemlər və qoruyucular yoxlanmalıdır.","One of the phases was lost or the voltages differ strongly (broken neutral, poor contact, breaker). Input cables, terminals and fuses should be checked.","Одна из фаз пропала или напряжения сильно различаются (обрыв нейтрали, плохой контакт, автомат). Необходимо проверить входные кабели, клеммы и предохранители.","Fazlardan biri kayboldu veya gerilimler ciddi şekilde farklı (kopuk nötr, zayıf temas, sigorta). Giriş kabloları, klemensler ve sigortalar kontrol edilmelidir."],["Giriş gərginliyi ±15% həddən kənar","Input voltage outside ±15% limits","Входное напряжение вне пределов ±15%","Giriş gerilimi ±%15 sınırları dışında"],["Şəbəkə gərginliyi icazə verilən diapazondan çıxıb.","Mains voltage went outside the permitted range.","Напряжение сети вышло за допустимый диапазон.","Şebeke gerilimi izin verilen aralığın dışına çıktı."],["Giriş tezliyi 50 Hz ± 1 Hz diapazonundan çıxıb (generator rejimini yoxlayın).","Input frequency went outside 50 Hz ± 1 Hz (check generator operation).","Входная частота вышла за пределы 50 Гц ± 1 Гц (проверьте работу генератора).","Giriş frekansı 50 Hz ± 1 Hz aralığının dışına çıktı (jeneratör çalışmasını kontrol edin)."],["Çıxış gərginliyi nominaldan kənar","Output voltage off nominal","Выходное напряжение отклоняется от номинала","Çıkış gerilimi nominal değerin dışında"],["Həddən artıq yüklənmə (>100%)","Overload (>100%)","Перегрузка (>100%)","Aşırı yük (>%100)"],["Faza yükü nominal gücü aşıb. Yük bölüşdürülməli və ya azaldılmalıdır.","Phase load exceeded rated power. The load should be redistributed or reduced.","Нагрузка фазы превысила номинальную мощность. Нагрузку следует перераспределить или снизить.","Faz yükü nominal gücü aştı. Yük dağıtılmalı veya azaltılmalıdır."],["Yüksək yük (>80%)","High load (>80%)","Высокая нагрузка (>80%)","Yüksek yük (>%80)"],["Faza yükü 80%-i keçib – ehtiyat güc azdır.","Phase load exceeded 80% – little power reserve left.","Нагрузка фазы превысила 80% – резерв мощности мал.","Faz yükü %80'i geçti – güç rezervi az."],["Faza yükləri balanssızdır","Phase loads unbalanced","Нагрузка по фазам несимметрична","Faz yükleri dengesiz"],["Fazalar arasında yük fərqi böyükdür. Yükü fazalar arasında bərabər paylamaq tövsiyə olunur.","The load difference between phases is large. It is recommended to distribute the load evenly across phases.","Разница нагрузки между фазами велика. Рекомендуется равномерно распределить нагрузку по фазам.","Fazlar arasındaki yük farkı büyük. Yükün fazlara eşit dağıtılması önerilir."],["Planlı söndürmə (əl ilə stop əmri)","Planned shutdown (manual stop command)","Плановое отключение (команда ручного останова)","Planlı kapatma (manuel durdurma komutu)"],["UPS çıxışı operatorun stop əmri (E077) ilə söndürülüb.","The UPS output was switched off by an operator stop command (E077).","Выход ИБП отключён командой останова оператора (E077).","UPS çıkışı operatörün durdurma komutuyla (E077) kapatıldı."],["Çıxış gərginliyi kəsildi – yük qidasız qaldı","Output voltage lost – load left unsupplied","Пропало выходное напряжение – нагрузка осталась без питания","Çıkış gerilimi kesildi – yük beslemesiz kaldı"],["UPS çıxışında gərginlik itib və bundan əvvəl əl ilə stop əmri olmayıb. Səbəb (batareya boşalması, nasazlıq, bypass olmaması) araşdırılmalıdır.","Voltage was lost at the UPS output with no manual stop command beforehand. The cause (battery discharge, fault, no bypass) should be investigated.","На выходе ИБП пропало напряжение, при этом ручной команды останова не было. Причину (разряд батареи, неисправность, отсутствие байпаса) необходимо выяснить.","UPS çıkışında gerilim kayboldu ve öncesinde manuel durdurma komutu yoktu. Neden (akü boşalması, arıza, baypas olmaması) araştırılmalıdır."],["DC bus disbalansı (+/−)","DC bus imbalance (+/−)","Дисбаланс шины DC (+/−)","DC bara dengesizliği (+/−)"],["DC bus-un müsbət və mənfi yarıları arasında fərq 15 V-dan çoxdur – DC kondensatorlar / batareya yarımblokları yoxlanmalıdır.","The difference between the positive and negative halves of the DC bus exceeds 15 V – DC capacitors / battery half-strings should be checked.","Разница между положительной и отрицательной половинами шины DC превышает 15 В – необходимо проверить DC-конденсаторы / полуцепочки батарей.","DC baranın pozitif ve negatif yarıları arasındaki fark 15 V'tan fazla – DC kondansatörler / akü yarım grupları kontrol edilmelidir."],["DC bus gərginliyi çökdü","DC bus voltage collapsed","Напряжение шины DC упало","DC bara gerilimi çöktü"],["İş rejimində DC bus kəskin düşüb – güc hissəsində ciddi nasazlıq ehtimalı (IGBT, kondensator, sürücü, batareya qırılması).","The DC bus dropped sharply during operation – a serious power-section fault is likely (IGBT, capacitor, driver, open battery circuit).","Во время работы напряжение шины DC резко упало – вероятна серьёзная неисправность силовой части (IGBT, конденсатор, драйвер, обрыв цепи батарей).","Çalışma sırasında DC bara sert düştü – güç bölümünde ciddi arıza olasılığı (IGBT, kondansatör, sürücü, akü devresi kopukluğu)."],["Batareya tam boşaldı (End of Discharge)","Battery fully discharged (End of Discharge)","Батарея полностью разряжена (End of Discharge)","Akü tamamen boşaldı (End of Discharge)"],["Batareya rejimində batareyalar tam boşalma həddinə (EOD) çatıb və UPS dayanıb. Ehtiyat vaxtı yük üçün yetərsizdir və ya batareyalar köhnəlib.","In battery mode the batteries reached the end-of-discharge limit (EOD) and the UPS stopped. The backup time is insufficient for the load or the batteries have aged.","В режиме батареи батареи достигли порога полного разряда (EOD) и ИБП остановился. Время автономии недостаточно для нагрузки либо батареи состарились.","Akü modunda aküler tam deşarj sınırına (EOD) ulaştı ve UPS durdu. Yedekleme süresi yük için yetersiz veya aküler eskimiş."],["Batareya aşağı xəbərdarlığı (Battery Low)","Battery low warning (Battery Low)","Предупреждение о низком заряде (Battery Low)","Akü düşük uyarısı (Battery Low)"],["Batareya rejimində batareya gərginliyi xəbərdarlıq həddinə düşüb.","In battery mode the battery voltage dropped to the warning level.","В режиме батареи напряжение батареи опустилось до порога предупреждения.","Akü modunda akü gerilimi uyarı seviyesine düştü."],["Batareya gözləniləndən tez boşalır","Battery discharges faster than expected","Батарея разряжается быстрее ожидаемого","Akü beklenenden hızlı boşalıyor"],["UPS tutumu yüksək hesablasa da (≥60 %), batareya gərginliyi sürətlə düşüb – batareyaların bir hissəsi zəifdir/nasazdır. Blok-blok gərginlik və daxili müqavimət ölçülməlidir.","Although the UPS calculated a high capacity (≥60 %), the battery voltage fell rapidly – some of the batteries are weak/faulty. Block-by-block voltage and internal resistance should be measured.","Хотя ИБП рассчитывал высокую ёмкость (≥60 %), напряжение батареи быстро упало – часть батарей слабая/неисправная. Необходимо измерить напряжение и внутреннее сопротивление каждого блока.","UPS yüksek kapasite hesaplasa da (≥%60) akü gerilimi hızla düştü – akülerin bir kısmı zayıf/arızalı. Blok blok gerilim ve iç direnç ölçülmelidir."],["Batareya testi yarımçıq qalıb","Battery test incomplete","Тест батареи не завершён","Akü testi yarım kaldı"],["Batareya testi başa çatmamış dayandırılıb.","The battery test was stopped before completion.","Тест батареи был остановлен до завершения.","Akü testi tamamlanmadan durduruldu."],["Batareyalar dəyişdirilib","Batteries replaced","Батареи заменены","Aküler değiştirildi"],["UPS-də batareyaların dəyişdirilməsi qeydə alınıb (E086).","Battery replacement was recorded in the UPS (E086).","В ИБП зарегистрирована замена батарей (E086).","UPS'te akü değişimi kaydedildi (E086)."],["Yük bypass-a keçib (Bypass Mode)","Load transferred to bypass (Bypass Mode)","Нагрузка переведена на байпас (Bypass Mode)","Yük baypasa geçti (Bypass Mode)"],["Yük qorunmasız bypass xəttindən qidalanıb (E067). Səbəb: invertor dayanması, həddən artıq yük və ya əl ilə keçid.","The load was supplied from the unprotected bypass line (E067). Cause: inverter stop, overload or manual transfer.","Нагрузка питалась от незащищённой линии байпаса (E067). Причина: останов инвертора, перегрузка или ручной перевод.","Yük korumasız baypas hattından beslendi (E067). Neden: invertör durması, aşırı yük veya manuel geçiş."],["Nasazlıq kodları","Fault codes","Коды неисправностей","Arıza kodları"],["UPS kritik nasazlıq hadisəsi qeydə alıb.","The UPS recorded a critical fault event.","ИБП зарегистрировал критическую неисправность.","UPS kritik bir arıza olayı kaydetti."],["Bypass gərginliyi problemləri","Bypass voltage problems","Проблемы напряжения байпаса","Baypas gerilimi sorunları"],["Bypass xəttində gərginlik pis və ya yoxdur – bu halda UPS yükü bypass-a ötürə bilməz.","The bypass line voltage is bad or absent – in this case the UPS cannot transfer the load to bypass.","Напряжение на линии байпаса плохое или отсутствует – в этом случае ИБП не может перевести нагрузку на байпас.","Baypas hattında gerilim kötü veya yok – bu durumda UPS yükü baypasa aktaramaz."],["Çıxış / bypass xəbərdarlıqları","Output / bypass warnings","Предупреждения выхода / байпаса","Çıkış / baypas uyarıları"],["Çıxışda gərginlik və ya cərəyan anormallığı qeydə alınıb.","A voltage or current abnormality was recorded at the output.","На выходе зарегистрирована аномалия напряжения или тока.","Çıkışta gerilim veya akım anormalliği kaydedildi."],["UPS-in son dayanma səbəbləri (LAST STOP)","UPS last stop reasons (LAST STOP)","Причины последних остановов ИБП (LAST STOP)","UPS son durma nedenleri (LAST STOP)"],["UPS dayandıqda yaddaşa yazdığı səbəb.","The reason the UPS stores in memory when it stops.","Причина, которую ИБП записывает в память при останове.","UPS durduğunda belleğine yazdığı neden."],["Rektifikator işə düşmür","Rectifier fails to start","Выпрямитель не запускается","Doğrultucu çalışmıyor"],["Rektifikator start cəhdi uğursuz olub.","A rectifier start attempt failed.","Попытка пуска выпрямителя не удалась.","Doğrultucu başlatma denemesi başarısız oldu."],["Temperatur xəbərdarlığı hadisələri","Temperature warning events","События предупреждения о температуре","Sıcaklık uyarı olayları"],["UPS özü yüksək temperatur xəbərdarlığı verib.","The UPS itself issued a high temperature warning.","ИБП сам выдал предупреждение о высокой температуре.","UPS'in kendisi yüksek sıcaklık uyarısı verdi."],["Naməlum hadisə kodları","Unknown event codes","Неизвестные коды событий","Bilinmeyen ла)","(kayıt başlamadan önce)"],["hələ də aktiv","still active","всё ещё активно","hâlâ aktif"],["İnvertor","Inverter","Инвертор","İnvertör"],["Avtomatik bypass","Automatic bypass","Автоматический байпас","Otomatik baypas"],["Əl (texniki) bypass","Manual (maintenance) bypass","Ручной (сервисный) байпас","Manuel (bakım) baypas"],["Yük qidalanmır","Load not supplied","Нагрузка не питается","Yük beslenmiyor"],["jurnalın sonuna qədər","until the end of the log","до конца журнала","kaydın sonuna kadar"],["(və ya daha çox)","(or longer)","(или дольше)","(veya daha uzun)"],["Yük qidasız qalıb (Load not supplied)","Load left unsupplied (Load not supplied)","Нагрузка осталась без питания (Load not supplied)","Yük beslemesiz kaldı (Load not supplied)"],["UPS çıxışında yük qidalanmayıb və bu zaman əl bypass-ı bağlı olmayıb. Hər halın səbəbi (planlı söndürmə, batareya boşalması, nasazlıq) müştəri ilə dəqiqləşdirilməlidir.","The load at the UPS output was not supplied while the manual bypass was not closed. The cause of each case (planned shutdown, battery discharge, fault) should be clarified with the customer.","Нагрузка на выходе ИБП не питалась, при этом ручной байпас не был замкнут. Причину каждого случая (плановое отключение, разряд батареи, неисправность) необходимо уточнить у заказчика.","UPS çıkışındaki yük beslenmedi ve bu sırada manuel baypas kapalı değildi. Her durumun nedeni (planlı kapatma, akü boşalması, arıza) müşteri ile netleştirilmelidir."],["Əl bypass-ı zamanı UPS yükü qidalandırmayıb (planlı)","UPS did not supply the load during manual bypass (planned)","ИБП не питал нагрузку во время ручного байпаса (планово)","Manuel baypas sırasında UPS yükü beslemedi (planlı)"],["Yük texniki-xidmət bypass-ından qidalanarkən UPS “Load not supplied” göstərib – bu, planlı servis işləri üçün normaldır.","While the load was supplied from the maintenance bypass the UPS showed “Load not supplied” – this is normal for planned service work.","Пока нагрузка питалась от сервисного байпаса, ИБП показывал «Load not supplied» – для плановых сервисных работ это нормально.","Yük bakım baypasından beslenirken UPS “Load not supplied” gösterdi – planlı servis çalışmaları için bu normaldir."],["Yük avtomatik bypass-a keçib","Load transferred to automatic bypass","Нагрузка переведена на автоматический байпас","Yük otomatik baypasa geçti"],["Bu müddətdə yük UPS tərəfindən qorunmayıb (qida birbaşa bypass şəbəkəsindən). Keçid səbəbi (invertor dayanması, yüklənmə, modul nasazlığı) yoxlanmalıdır.","During this time the load was not protected by the UPS (supplied directly from the bypass mains). The cause of the transfer (inverter stop, overload, module fault) should be checked.","В это время нагрузка не была защищена ИБП (питание напрямую от сети байпаса). Необходимо выяснить причину перевода (останов инвертора, перегрузка, неисправность модуля).","Bu süre boyunca yük UPS tarafından korunmadı (doğrudan baypas şebekesinden beslendi). Geçiş nedeni (invertör durması, aşırı yük, modül arızası) kontrol edilmelidir."],["Yük texniki-xidmət (əl) bypass-ında olub","Load was on maintenance (manual) bypass","Нагрузка была на сервисном (ручном) байпасе","Yük bakım (manuel) baypasındaydı"],["Əl bypass-ı adətən servis işləri üçün bağlanır; bu müddətdə yük qorunmur.","The manual bypass is usually closed for service work; during this time the load is not protected.","Ручной байпас обычно замыкают для сервисных работ; в это время нагрузка не защищена.","Manuel baypas genellikle servis çalışmaları için kapatılır; bu süre boyunca yük korunmaz."],["Batareya rejimində işləmə (UPS on battery)","Operation on battery (UPS on battery)","Работа от батареи (UPS on battery)","Akü modunda çalışma (UPS on battery)"],["UPS şəbəkə itkisi və ya rektifikator dayanması səbəbindən batareyadan işləyib.","The UPS ran on battery due to mains loss or rectifier stop.","ИБП работал от батареи из-за пропадания сети или останова выпрямителя.","UPS şebeke kaybı veya doğrultucu durması nedeniyle aküden çalıştı."],["Rektifikator girişində şəbəkə itkisi","Mains loss at rectifier input","Пропадание сети на входе выпрямителя","Doğrultucu girişinde şebeke kaybı"],["Rektifikator girişində gərginlik olmayıb (şəbəkə kəsintisi və ya giriş açarı açıq).","There was no voltage at the rectifier input (mains failure or input switch open).","На входе выпрямителя отсутствовало напряжение (отключение сети или разомкнут входной выключатель).","Doğrultucu girişinde gerilim yoktu (şebeke kesintisi veya giriş anahtarı açık)."],["Şəbəkə olduğu halda batareyada işləmə","Running on battery with mains present","Работа от батареи при наличии сети","Şebeke varken aküden çalışma"],["“On battery with mains OK” – şəbəkə normal olduğu halda rektifikator işləməyib (əl ilə söndürülüb, start proseduru və ya rektifikator nasazlığı).","“On battery with mains OK” – the rectifier was not running although the mains was normal (switched off manually, start procedure or rectifier fault).","«On battery with mains OK» – выпрямитель не работал при нормальной сети (выключен вручную, процедура пуска или неисправность выпрямителя).","“On battery with mains OK” – şebeke normal olmasına rağmen doğrultucu çalışmadı (manuel kapatıldı, başlatma prosedürü veya doğrultucu arızası)."],["Bu müddətdə yük UPS tərəfindən qorunmayıb (qida birbaşa şəbəkədən).","During this time the load was not protected by the UPS (supplied directly from the mains).","В это время нагрузка не была защищена ИБП (питание напрямую от сети).","Bu süre boyunca yük UPS tarafından korunmadı (doğrudan şebekeden beslendi)."],["Bypass şəbəkəsi problemləri","Bypass mains problems","Проблемы сети байпаса","Baypas şebekesi sorunları"],["Bypass girişində gərginlik/tezlik tolerans xaricində və ya yoxdur – bu halda yük bypass-a ötürülə bilməz.","Voltage/frequency at the bypass input is out of tolerance or absent – in this case the load cannot be transferred to bypass.","Напряжение/частота на входе байпаса вне допуска или отсутствуют – в этом случае нагрузку нельзя перевести на байпас.","Baypas girişinde gerilim/frekans tolerans dışında veya yok – bu durumda yük baypasa aktarılamaz."],["Kritik alarmlar","Critical alarms","Критические аварии","Kritik alarmlar"],["Avadanlığın vəziyyətinə təsir edən kritik alarm qeydə alınıb.","A critical alarm affecting the equipment condition was recorded.","Зарегистрирована критическая авария, влияющая на состояние оборудования.","Ekipmanın durumunu etkileyen kritik bir alarm kaydedildi."],["Ehtiyat / ötürmə problemləri","Redundancy / transfer problems","Проблемы резервирования / перевода","Yedeklilik / aktarım sorunları"],["Modul sayı yükü ehtiyatla təmin etmir və ya bypass-a ötürmə mümkün olmayıb – modulların vəziyyəti yoxlanmalıdır.","The number of modules does not cover the load with redundancy or transfer to bypass was impossible – the condition of the modules should be checked.","Количество модулей не обеспечивает нагрузку с резервом либо перевод на байпас был невозможен – необходимо проверить состояние модулей.","Modül sayı yükü yedekli karşılamıyor veya baypasa aktarım mümkün olmadı – modüllerin durumu kontrol edilmelidir."],["Modulların ümumi alarmları","Module general alarms","Общие аварии модулей","Modül genel alarmları"],["Güc modullarında alarm qeydə alınıb. Ən çox alarm verən modul diqqətlə yoxlanmalıdır.","Alarms were recorded on the power modules. The module with the most alarms should be checked carefully.","На силовых модулях зарегистрированы аварии. Модуль с наибольшим числом аварий следует проверить особенно тщательно.","Güç modüllerinde alarm kaydedildi. En çok alarm veren modül dikkatle kontrol edilmelidir."],["HAL-HAZIRDA AKTİV","CURRENTLY ACTIVE","АКТИВНО СЕЙЧАС","ŞU ANDA AKTİF"],["Modulların dayanması","Module stops","Остановы модулей","Modül durmaları"],["“Unit N operating” siqnalı sönüb – modul işdən çıxıb (yük digər modullara keçib və ya UPS söndürülüb).","The “Unit N operating” signal went off – the module dropped out (load moved to other modules or the UPS was switched off).","Сигнал «Unit N operating» пропал – модуль вышел из работы (нагрузка перешла на другие модули или ИБП был выключен).","“Unit N operating” sinyali söndü – modül devreden çıktı (yük diğer modüllere geçti veya UPS kapatıldı)."],["Profilaktik xidmət vaxtı çatıb (Common preventive)","Preventive maintenance due (Common preventive)","Наступил срок профилактического обслуживания (Common preventive)","Önleyici bakım zamanı geldi (Common preventive)"],["UPS profilaktik texniki xidmət xəbərdarlığı verib – planlı servis aparılmalıdır.","The UPS issued a preventive maintenance warning – scheduled service should be performed.","ИБП выдал предупреждение о профилактическом обслуживании – необходимо провести плановое ТО.","UPS önleyici bakım uyarısı verdi – planlı servis yapılmalıdır."],["Proqram versiyası uyğunsuzluğu","Software version mismatch","Несоответствие версий ПО","Yazılım sürümü uyumsuzluğu"],["DSP və idarəetmə kartının proqram versiyaları uyğun deyil – proşivka yenilənməsi tələb oluna bilər.","The DSP and control board software versions do not match – a firmware update may be required.","Версии ПО DSP и платы управления не совпадают – может потребоваться обновление прошивки.","DSP ve kontrol kartı yazılım sürümleri uyumsuz – yazılım (firmware) güncellemesi gerekebilir."],["Təsviri məlum olmayan kodlar","Codes without known description","Коды без известного описания","Açıklaması bilinmeyen kodlar"],["Bu kodların adı nümunə lüğətdə yoxdur. Eyni faylın Socomec CSV çevirməsini də yükləsəniz, adlar oradan götürüləcək.","These codes are not in the sample dictionary. If you also load the Socomec CSV conversion of the same file, the names will be taken from it.","Этих кодов нет в образцовом словаре. Если загрузить также CSV-конвертацию Socomec того же файла, названия будут взяты из неё.","Bu kodlar örnek sözlükte yok. Aynı dosyanın Socomec CSV dönüşümünü de yüklerseniz adlar oradan alınır."],["Batareya boşalmaları (UPS statistikası)","Battery discharges (UPS statistics)","Разряды батареи (статистика ИБП)","Akü deşarjları (UPS istatistiği)"],["Batareya temperaturu yüksəkdir","Battery temperature high","Высокая температура батареи","Akü sıcaklığı yüksek"],["Jurnal endirilən anda aktiv olan alarmlar","Alarms active when the log was downloaded","Аварии, активные на момент выгрузки журнала","Kayıt indirildiği anda aktif olan alarmlar"],["Bu alarmlar jurnalın sonunda hələ də aktiv idi.","These alarms were still active at the end of the log.","Эти аварии были ещё активны в конце журнала.","Bu alarmlar kaydın sonunda hâlâ aktifti."],["(dövrün əvvəlindən)","(from the start of the period)","(с начала периода)","(dönemin başından)"],["Bypass (şəbəkə)","Bypass (mains)","Байпас (сеть)","Baypas (şebeke)"],["ECO / bypass (əmr ilə)","ECO / bypass (by command)","ECO / байпас (по команде)","ECO / baypas (komutla)"],["(ilkin vəziyyət)","(initial state)","(начальное состояние)","(başlangıç durumu)"],["(dövrün əvvəli)","(start of period)","(начало периода)","(dönem başı)"],["Yük qidasız qalıb","Load left unsupplied","Нагрузка осталась без питания","Yük beslemesiz kaldı"],["UPS yükü nə invertordan, nə bypass-dan, nə də əl bypass-ından qidalandırmayıb. Hər halın planlı olub-olmadığı dəqiqləşdirilməlidir.","The UPS supplied the load neither from the inverter, nor from bypass, nor from the manual bypass. Whether each case was planned should be clarified.","ИБП не питал нагрузку ни от инвертора, ни от байпаса, ни от ручного байпаса. Необходимо уточнить, был ли каждый случай плановым.","UPS yükü ne invertörden, ne baypastan ne de manuel baypastan besledi. Her durumun planlı olup olmadığı netleştirilmelidir."],["Yük bypass-a keçib (qorunmasız qida)","Load transferred to bypass (unprotected supply)","Нагрузка переведена на байпас (незащищённое питание)","Yük baypasa geçti (korumasız besleme)"],["İnvertor dayanıb və yük birbaşa şəbəkədən (bypass) qidalanıb. Qısa (1–2 san) keçidlər invertor nasazlığı, yüklənmə və ya cərəyan sıçrayışlarının əlamətidir.","The inverter stopped and the load was supplied directly from the mains (bypass). Short (1–2 s) transfers indicate an inverter fault, overload or current surges.","Инвертор остановился, нагрузка питалась напрямую от сети (байпас). Короткие (1–2 с) переходы – признак неисправности инвертора, перегрузки или бросков тока.","İnvertör durdu ve yük doğrudan şebekeden (baypas) beslendi. Kısa (1–2 sn) geçişler invertör arızası, aşırı yük veya akım sıçramalarının işaretidir."],["ECO rejimi dövrləri","ECO mode periods","Периоды режима ECO","ECO modu dönemleri"],["ECO rejimində yük normal halda bypass-dan qidalanır (enerji qənaəti); şəbəkə pozulanda invertora keçir.","In ECO mode the load is normally supplied from bypass (energy saving); when the mains is disturbed it transfers to the inverter.","В режиме ECO нагрузка обычно питается от байпаса (энергосбережение); при нарушениях сети переходит на инвертор.","ECO modunda yük normalde baypastan beslenir (enerji tasarrufu); şebeke bozulduğunda invertöre geçer."],["Yük əl (texniki) bypass-ında olub","Load was on manual (maintenance) bypass","Нагрузка была на ручном (сервисном) байпасе","Yük manuel (bakım) baypasındaydı"],["Əl bypass-ı servis işləri üçün bağlanır; bu müddətdə yük qorunmur və UPS söndürülə bilər.","The manual bypass is closed for service work; during this time the load is not protected and the UPS may be switched off.","Ручной байпас замыкают для сервисных работ; в это время нагрузка не защищена и ИБП может быть выключен.","Manuel baypas servis çalışmaları için kapatılır; bu süre boyunca yük korunmaz ve UPS kapatılabilir."],["aktiv","active","активно","aktif"],["Batareya rejimində işləmə (şəbəkə itkisi)","Operation on battery (mains loss)","Работа от батареи (пропадание сети)","Akü modunda çalışma (şebeke kaybı)"],["UPS giriş şəbəkəsi itdiyi üçün batareyadan işləyib.","The UPS ran on battery because the input mains was lost.","ИБП работал от батареи из-за пропадания входной сети.","UPS giriş şebekesi kaybolduğu için aküden çalıştı."],["Batareya yoxlaması (Battery Check) ilə batareya rejimi","Battery mode during Battery Check","Режим батареи во время проверки (Battery Check)","Akü kontrolü (Battery Check) sırasında akü modu"],["Bu dövrlərdə UPS batareya yoxlaması (Battery Check) aparıb və giriş şəbəkəsi “yox” göstərilib. Bu, planlı/avtomatik batareya testi və ya test anında baş verən qısa şəbəkə itkisi ola bilər – gecə saatlarında olanlar adətən avtomatik testdir.","During these periods the UPS performed a Battery Check and the input mains was shown as “absent”. This can be a scheduled/automatic battery test or a short mains loss during the test – those at night are usually the automatic test.","В эти периоды ИБП выполнял проверку батареи (Battery Check), и входная сеть отображалась как «нет». Это может быть плановый/автоматический тест батареи или кратковременное пропадание сети во время теста – ночные случаи обычно являются автоматическим тестом.","Bu dönemlerde UPS akü kontrolü (Battery Check) yaptı ve giriş şebekesi “yok” gösterildi. Bu, planlı/otomatik akü testi veya test sırasında yaşanan kısa bir şebeke kaybı olabilir – gece saatlerindekiler genellikle otomatik testtir."],["Giriş şəbəkəsi itkisi (Mains OK = yox)","Input mains loss (Mains OK = no)","Пропадание входной сети (Mains OK = нет)","Giriş şebekesi kaybı (Mains OK = yok)"],["Giriş şəbəkəsi olmayıb (kəsinti, tolerans xaricində gərginlik və ya giriş açarı açıq).","There was no input mains (failure, voltage out of tolerance or input switch open).","Входная сеть отсутствовала (отключение, напряжение вне допуска или разомкнут входной выключатель).","Giriş şebekesi yoktu (kesinti, tolerans dışı gerilim veya giriş anahtarı açık)."],["Texniki xidmət (servis) prosedurları","Maintenance (service) procedures","Процедуры технического обслуживания (сервис)","Bakım (servis) prosedürleri"],["Yük əmr ilə bypass-a ötürülüb, əl bypass-ı bağlanıb və UPS servis üçün dayandırılıb. Bu pəncərələrdə yaranan alarmlar ayrıca, “servis zamanı” kimi göstərilir.","The load was transferred to bypass by command, the manual bypass was closed and the UPS was stopped for service. Alarms raised within these windows are shown separately as “during service”.","Нагрузка по команде переведена на байпас, замкнут ручной байпас и ИБП остановлен для обслуживания. Аварии, возникшие в эти интервалы, показаны отдельно как «во время сервиса».","Yük komutla baypasa aktarıldı, manuel baypas kapatıldı ve UPS servis için durduruldu. Bu aralıklarda oluşan alarmlar ayrıca “servis sırasında” olarak gösterilir."],["jurnalın sonu","end of log","конец журнала","kaydın sonu"],["(əl bypass-ı)","(manual bypass)","(ручной байпас)","(manuel baypas)"],["Servis işləri zamanı yaranan alarmlar (gözləniləndir)","Alarms raised during service work (expected)","Аварии во время сервисных работ (ожидаемые)","Servis çalışmaları sırasında oluşan alarmlar (beklenen)"],["UPS servis üçün dayandırılarkən / yenidən işə salınarkən yaranan alarmlar (batareya açarı açıq, batareya boşalıb, qida bloku və s.). İşin sonunda hamısının aradan qalxdığını yoxlayın.","Alarms raised while the UPS was being stopped / restarted for service (battery switch open, battery discharged, power supply unit, etc.). Check that all of them have cleared at the end of the work.","Аварии, возникшие при останове / повторном пуске ИБП для обслуживания (разомкнут выключатель батареи, батарея разряжена, блок питания и т. п.). По окончании работ убедитесь, что все они сброшены.","UPS servis için durdurulurken / yeniden başlatılırken oluşan alarmlar (akü şalteri açık, akü boşaldı, güç kaynağı vb.). İşin sonunda hepsinin temizlendiğini kontrol edin."],["Batareya tam boşalıb (Battery end / discharged)","Battery fully discharged (Battery end / discharged)","Батарея полностью разряжена (Battery end / discharged)","Akü tamamen boşaldı (Battery end / discharged)"],["Batareyalar tam boşalma həddinə çatıb. Ehtiyat vaxtı yük üçün yetərsizdir və ya batareyalar zəifləyib.","The batteries reached the end-of-discharge limit. The backup time is insufficient for the load or the batteries have weakened.","Батареи достигли порога полного разряда. Время автономии недостаточно для нагрузки либо батареи ослабли.","Aküler tam deşarj sınırına ulaştı. Yedekleme süresi yük için yetersiz veya aküler zayıflamış."],["Batareya dövrəsi, qoruyucular və qida blokları ilə bağlı kritik alarmlar (servis işlərindən kənarda).","Critical alarms related to the battery circuit, fuses and power supply units (outside service work).","Критические аварии, связанные с цепью батарей, предохранителями и блоками питания (вне сервисных работ).","Akü devresi, sigortalar ve güç kaynakları ile ilgili kritik alarmlar (servis çalışmaları dışında)."],["Köməkçi (bypass) şəbəkə problemləri","Auxiliary (bypass) mains problems","Проблемы вспомогательной сети (байпас)","Yardımcı (baypas) şebeke sorunları"],["Bypass xəttinin gərginliyi/tezliyi tolerans xaricində olub – bu zaman yük bypass-a ötürülə bilməz.","The bypass line voltage/frequency was out of tolerance – during this time the load cannot be transferred to bypass.","Напряжение/частота линии байпаса были вне допуска – в это время нагрузку нельзя перевести на байпас.","Baypas hattının gerilimi/frekansı tolerans dışındaydı – bu sırada yük baypasa aktarılamaz."],["batareya yoxlaması zamanı","during battery check","во время проверки батареи","akü kontrolü sırasında"],["Çıxış gərginliyinin forması/qiyməti icazə verilən maskadan çıxıb.","The output voltage waveform/value went outside the permitted mask.","Форма/значение выходного напряжения вышли за допустимую маску.","Çıkış geriliminin dalga şekli/değeri izin verilen maskenin dışına çıktı."],["Batareya gərginliyi alarmları","Battery voltage alarms","Аварии напряжения батареи","Akü gerilimi alarmları"],["Batareya gərginliyi həddən yüksək olub – şarj parametrləri və batareya blokları yoxlanmalıdır.","Battery voltage was too high – charging parameters and battery blocks should be checked.","Напряжение  длительно не была защищена (Load not protected – bypass)","Yük uzun süre korunmadı (Load not protected – bypass)"],["Yük qorunmayıb (Load not protected – bypass)","Load not protected (Load not protected – bypass)","Нагрузка не была защищена (Load not protected – bypass)","Yük korunmadı (Load not protected – bypass)"],["UPS yükü invertordan qidalandırmayıb (bypass və ya invertor dayanıb). Bu müddətdə şəbəkə kəsintisi və pozuntuları yükə birbaşa təsir edir – saatlarla/günlərlə davam edən hallar var, təcili müdaxilə tələb olunur.","The UPS did not supply the load from the inverter (bypass or inverter stopped). During this time mains failures and disturbances affect the load directly – there are cases lasting hours/days, urgent action is required.","ИБП не питал нагрузку от инвертора (байпас или инвертор остановлен). В это время отключения и нарушения сети напрямую воздействуют на нагрузку – есть случаи длительностью в часы/сутки, требуется срочное вмешательство.","UPS yükü invertörden beslemedi (baypas veya invertör durdu). Bu süre boyunca şebeke kesintileri ve bozulmaları yükü doğrudan etkiler – saatler/günler süren durumlar var, acil müdahale gerekli."],["UPS yükü invertordan qidalandırmayıb (bypass və ya invertor dayanıb). Bu müddətdə şəbəkə kəsintisi və pozuntuları yükə birbaşa təsir edir.","The UPS did not supply the load from the inverter (bypass or inverter stopped). During this time mains failures and disturbances affect the load directly.","ИБП не питал нагрузку от инвертора (байпас или инвертор остановлен). В это время отключения и нарушения сети напрямую воздействуют на нагрузку.","UPS yükü invertörden beslemedi (baypas veya invertör durdu). Bu süre boyunca şebeke kesintileri ve bozulmaları yükü doğrudan etkiler."],["UPS dayandırılıb (UPS stop → start)","UPS stopped (UPS stop → start)","ИБП остановлен (UPS stop → start)","UPS durduruldu (UPS stop → start)"],["UPS tam dayandırılıb. Servis işləri üçün idisə normaldır; əks halda səbəb araşdırılmalıdır.","The UPS was completely stopped. This is normal if it was for service work; otherwise the cause should be investigated.","ИБП был полностью остановлен. Если это было для сервисных работ – норма; в противном случае причину нужно выяснить.","UPS tamamen durduruldu. Servis çalışması içinse normaldir; aksi halde neden araştırılmalıdır."],["Batareya rejimində işləmə (Load on battery)","Operation on battery (Load on battery)","Работа от батареи (Load on battery)","Akü modunda çalışma (Load on battery)"],["UPS əsas şəbəkə itdiyi üçün batareyadan işləyib.","The UPS ran on battery because the main mains was lost.","ИБП работал от батареи из-за пропадания основной сети.","UPS ana şebeke kaybolduğu için aküden çalıştı."],["Batareya testləri (Battery test in progress)","Battery tests (Battery test in progress)","Тесты батареи (Battery test in progress)","Akü testleri (Battery test in progress)"],["UPS-in avtomatik/əl ilə batareya testləri. Testlər adətən aylıq aparılır.","Automatic/manual battery tests of the UPS. Tests are usually performed monthly.","Автоматические/ручные тесты батареи ИБП. Обычно тесты проводятся ежемесячно.","UPS'in otomatik/manuel akü testleri. Testler genellikle aylık yapılır."],["Batareya enerjisi tükənib (End of battery power)","Battery energy exhausted (End of battery power)","Энергия батареи исчерпана (End of battery power)","Akü enerjisi tükendi (End of battery power)"],["Batareya rejimində batareyalar tam boşalıb – UPS yükü saxlaya bilməyib. Batareyaların tutumu yük üçün yetərsizdir və ya batareyalar köhnəlib.","In battery mode the batteries were fully discharged – the UPS could not sustain the load. Battery capacity is insufficient for the load or the batteries have aged.","В режиме батареи батареи полностью разрядились – ИБП не смог удержать нагрузку. Ёмкость батарей недостаточна для нагрузки либо батареи состарились.","Akü modunda aküler tamamen boşaldı – UPS yükü taşıyamadı. Akü kapasitesi yük için yetersiz veya aküler eskimiş."],["Batareya aşağı xəbərdarlığı (Low battery warning)","Low battery warning (Low battery warning)","Предупреждение о низком заряде (Low battery warning)","Akü düşük uyarısı (Low battery warning)"],["Batareya rejimində ehtiyat vaxtı xəbərdarlıq həddinə düşüb.","In battery mode the remaining runtime dropped to the warning level.","В режиме батареи оставшееся время автономии опустилось до порога предупреждения.","Akü modunda kalan yedekleme süresi uyarı seviyesine düştü."],["Əsas şəbəkə gərginliyinin itməsi","Loss of main mains voltage","Пропадание напряжения основной сети","Ana şebeke geriliminin kaybı"],["Əsas (rektifikator) girişində gərginlik olmayıb.","There was no voltage at the main (rectifier) input.","На основном входе (выпрямителя) отсутствовало напряжение.","Ana (doğrultucu) girişte gerilim yoktu."],["servis zamanı","during service","во время сервиса","servis sırasında"],["Əsas şəbəkənin keyfiyyəti (gərginlik/tezlik tolerans xaricində)","Main mains quality (voltage/frequency out of tolerance)","Качество основной сети (напряжение/частота вне допуска)","Ana şebeke kalitesi (gerilim/frekans tolerans dışında)"],["Əsas şəbəkənin gərginliyi və ya tezliyi tez-tez tolerans xaricinə çıxıb – şəbəkə keyfiyyəti analizatorla ölçülməlidir (generator varsa, onun tənzimlənməsi yoxlanmalıdır).","Main mains voltage or frequency frequently went out of tolerance – mains quality should be measured with an analyser (if there is a generator, its regulation should be checked).","Напряжение или частота основной сети часто выходили за допуск – качество сети необходимо измерить анализатором (при наличии генератора – проверить его регулировку).","Ana şebeke gerilimi veya frekansı sık sık tolerans dışına çıktı – şebeke kalitesi analizörle ölçülmelidir (jeneratör varsa ayarı kontrol edilmelidir)."],["Bypass xəttinin gərginliyi/tezliyi tolerans xaricində olub və ya invertor bypass ilə sinxronlaşa bilməyib – bu zaman yük bypass-a ötürülə bilməz.","The bypass line voltage/frequency was out of tolerance or the inverter could not synchronise with bypass – during this time the load cannot be transferred to bypass.","Напряжение/частота линии байпаса были вне допуска или инвертор не смог синхронизироваться с байпасом – в это время нагрузку нельзя перевести на байпас.","Baypas hattının gerilimi/frekansı tolerans dışındaydı veya invertör baypas ile senkronize olamadı – bu sırada yük baypasa aktarılamaz."],["Servis işləri zamanı yaranan alarmlar","Alarms raised during service work","Аварии во время сервисных работ","Servis çalışmaları sırasında oluşan alarmlar"],["UPS servis üçün dayandırılarkən, batareya açarı (QF1) açılarkən və ya texniki xidmət vəziyyətində yaranan alarmlar. Əksəriyyəti gözləniləndir, amma işin sonunda aradan qalxdığı yoxlanmalıdır.","Alarms raised while the UPS was stopped for service, the battery switch (QF1) was opened or in maintenance status. Most are expected, but it should be checked that they have cleared at the end of the work.","Аварии, возникшие при останове ИБП для обслуживания, размыкании выключателя батареи (QF1) или в режиме техобслуживания. Большинство ожидаемы, но по окончании работ нужно проверить, что они сброшены.","UPS servis için durdurulurken, akü şalteri (QF1) açılırken veya bakım durumunda oluşan alarmlar. Çoğu beklenen alarmlardır ancak işin sonunda temizlendikleri kontrol edilmelidir."],["Kritik nasazlıqlar","Critical faults","Критические неисправности","Kritik arızalar"],["UPS böyük nasazlıq, şarj qurğusu və ya PFC nasazlığı qeydə alıb (servis işlərindən kənarda).","The UPS recorded a major fault, charger fault or PFC fault (outside service work).","ИБП зарегистрировал серьёзную неисправность, неисправность зарядного устройства или PFC (вне сервисных работ).","UPS büyük arıza, şarj cihazı veya PFC arızası kaydetti (servis çalışmaları dışında)."],["Kiçik nasazlıqlar və daxili rabitə xətaları","Minor faults and internal communication errors","Незначительные неисправности и ошибки внутренней связи","Küçük arızalar ve dahili iletişim hataları"],["Məhdud iş rejimi, daxili rabitə və şarj dövrəsi xəbərdarlıqları.","Downgraded operation, internal communication and charging circuit warnings.","Ограниченный режим работы, предупреждения внутренней связи и цепи заряда.","Kısıtlı çalışma modu, dahili iletişim ve şarj devresi uyarıları."],["QF1 batareya açarı açılıb","QF1 battery switch opened","Разомкнут выключатель батареи QF1","QF1 akü şalteri açıldı"],["Batareya açarı açıq olduqda şəbəkə itəndə UPS yükü saxlaya bilməz.","With the battery switch open, the UPS cannot sustain the load when the mains is lost.","При разомкнутом выключателе батареи ИБП не сможет удержать нагрузку при пропадании сети.","Akü şalteri açıkken şebeke kesildiğinde UPS yükü taşıyamaz."],["QF1 batareya açarı açıq","QF1 battery switch open","Выключатель батареи QF1 разомкнут","QF1 akü şalteri açık"],["Komponentlərin xidmət müddəti bitib (UPS-in öz xəbərdarlığı)","Component service life expired (UPS's own warning)","Истёк срок службы компонентов (собственное предупреждение ИБП)","Bileşenlerin kullanım ömrü doldu (UPS'in kendi uyarısı)"],["UPS daxili sayğaclarına görə aşağıdakı komponentlərin tövsiyə olunan xidmət müddəti başa çatıb – dəyişdirilməsi planlaşdırılmalıdır.","According to the UPS internal counters, the recommended service life of the following components has ended – their replacement should be planned.","По внутренним счётчикам ИБП рекомендованный срок службы следующих компонентов истёк – необходимо запланировать их замену.","UPS dahili sayaçlarına göre aşağıdaki bileşenlerin önerilen kullanım ömrü doldu – değiştirilmeleri planlanmalıdır."],["jurnalın sonunda AKTİV","ACTIVE at the end of the log","АКТИВНО в конце журнала","kaydın sonunda AKTİF"],["Texniki xidmət / UPS dayandırılması dövrləri","Maintenance / UPS stop periods","Периоды техобслуживания / останова ИБП","Bakım / UPS durdurma dönemleri"],["Servis işləri, UPS-in dayandırılıb yenidən işə salınması və texniki xidmət vəziyyəti.","Service work, UPS stop and restart, and maintenance status.","Сервисные работы, останов и повторный пуск ИБП, режим техобслуживания.","Servis çalışmaları, UPS'in durdurulup yeniden başlatılması ve bakım durumu."],["(əvvəl)","(before)","(ранее)","(önce)"],["texniki xidmət vəziyyəti","maintenance status","режим техобслуживания","bakım durumu"],["Batareya rejimində işləmə","Operation on battery","Работа от батареи","Akü modunda çalışma"],["UPS şəbəkə problemi səbəbindən batareyaya keçib.","The UPS transferred to battery due to a mains problem.","ИБП перешёл на батарею из-за проблемы сети.","UPS şebeke sorunu nedeniyle aküye geçti."],["Batareyaların dəyişdirilməsi tələb olunur","Battery replacement required","Требуется замена батарей","Akü değişimi gerekiyor"],["Uğursuz batareya testləri","Failed battery tests","Неудачные тесты батареи","Başarısız akü testleri"],["Batareya tam boşalıb","Battery fully discharged","Батарея полностью разряжена","Akü tamamen boşaldı"],["Həddən artıq yüklənmə","Overload","Перегрузка","Aşırı yük"],["UPS çıxışı sönüb","UPS output off","Выход ИБП отключён","UPS çıkışı kapandı"],["Nasazlıqlar","Faults","Неисправности","Arızalar"],["Bypass hadisələri","Bypass events","События байпаса","Baypas olayları"],["Giriş şəbəkəsi problemləri","Input mains problems","Проблемы входной сети","Giriş şebekesi sorunları"],["Rabitə problemləri","Communication problems","Проблемы связи","İletişim sorunları"],["Batareya testləri","Battery tests","Тесты батареи","Akü testleri"],["APC jurnalında hadisə mətninə görə təsnif olunub.","Classified by the event text in the APC log.","Классифицировано по тексту события в журнале APC.","APC kaydındaki olay metnine göre sınıflandırıldı."],["Təsnif olunmamış hadisələr","Unclassified events","Неклассифицированные события","Sınıflandırılmamış olaylar"],["Bu hadisələrin mətni tanınmadı – cədvəldə orijinal mətnlə göstərilir.","The text of these events was not recognised – they are shown with the original text in the table.","Текст этих событий не распознан – в таблице ые аварии в конце","Sonda aktif alarmlar"],["jurnalın son anında","at the last moment of the log","на момент окончания журнала","kaydın son anında"],["Batareya yoxlamaları","Battery checks","Проверки батареи","Akü kontrolleri"],["Batareya boşalmaları","Battery discharges","Разряды батареи","Akü deşarjları"],["statistika yoxdur","no statistics","нет статистики","istatistik yok"],["Operator əmrləri","Operator commands","Команды оператора","Operatör komutları"],["panel / uzaqdan","panel / remote","панель / удалённо","panel / uzaktan"],["Qrafiklər","Charts","Графики","Grafikler"],["Başlanğıc","Start","Начало","Başlangıç"],["Son","End","Конец","Bitiş"],["Müddət","Duration","Длительность","Süre"],["Yükün qidalanma rejimləri","Load supply modes","Режимы питания нагрузки","Yük besleme modları"],["Rejim","Mode","Режим","Mod"],["Qeyd","Note","Примечание","Not"],["dövrün əvvəli","start of period","начало периода","dönem başı"],["jurnalın əvvəlindəki vəziyyət","state at the start of the log","состояние в начале журнала","kaydın başındaki durum"],["əl bypass-ı zamanı","during manual bypass","во время ручного байпаса","manuel baypas sırasında"],["əl bypass-ı açıldıqdan sonra","after the manual bypass was opened","после размыкания ручного байпаса","manuel baypas açıldıktan sonra"],["servis / ECO əmri","service / ECO command","сервис / команда ECO","servis / ECO komutu"],["Bu dövrdə yük rejimi dəyişməyib.","The load supply mode did not change in this period.","В этом периоде режим питания нагрузки не менялся.","Bu dönemde yük besleme modu değişmedi."],["Batareya rejimi dövrləri","Battery mode periods","Периоды работы от батареи","Akü modu dönemleri"],["Yoxdur.","None.","Нет.","Yok."],["Batareya yoxlaması (Battery Check) dövrləri","Battery Check periods","Периоды проверки батареи (Battery Check)","Akü kontrolü (Battery Check) dönemleri"],["Batareya boşalma statistikası","Battery discharge statistics","Статистика разрядов батареи","Akü deşarj istatistiği"],["UPS-in öz qeydləri","UPS's own records","собственные записи ИБП","UPS'in kendi kayıtları"],["Verilən Ah","Ah delivered","Отдано, Ач","Verilen Ah"],["Batareya temp. °C","Battery temp. °C","Темп. батареи, °C","Akü sıc. °C"],["Alarmsız boşalma sayğacı","Discharges without alarm (counter)","Счётчик разрядов без аварии","Alarmsız deşarj sayacı"],["Əmr","Command","Команда","Komut"],["Alarm və vəziyyət siqnallarının xülasəsi","Summary of alarm and status signals","Сводка сигналов аварий и состояний","Alarm ve durum sinyallerinin özeti"],["Aktivləşmə","Activations","Срабатывания","Etkinleşme"],["Cəmi müddət","Total duration","Общая длительность","Toplam süre"],["Sonda","At end","В конце","Sonda"],["yalnız keçid","edge only","только фронт","yalnız geçiş"],["sönük","off","неактивно","pasif"],["Hadisə jurnalı","Event log","Журнал событий","Olay kaydı"],["Hadisə","Event","Событие","Olay"],["Cədvəl / qrup","Table / group","Таблица / группа","Tablo / grup"],["AKTİV","ACTIVE","АКТИВНО","AKTİF"],["sönüb","cleared","сброшено","söndü"],["qənaətbəxş deyil – təcili yoxlama tələb olunur","unsatisfactory – urgent inspection required","неудовлетворительное – требуется срочная проверка","yetersiz – acil kontrol gerekli"],["işləkdir, diqqət tələb edən məsələlər var","operational, with issues requiring attention","работоспособно, есть вопросы, требующие внимания","çalışır durumda, dikkat gerektiren konular var"],["normal","normal","нормальное","normal"],["Jurnalda ciddi uyğunsuzluq aşkar edilməmişdir.","No significant deviations were found in the log.","Существенных несоответствий в журнале не выявлено.","Kayıtta ciddi bir uygunsuzluk tespit edilmedi."],["Jurnal endirilən anda <b>aktiv alarmlar</b> var – servis zamanı aradan qaldırılmalı və təsdiqlənməlidir.","There were <b>active alarms</b> when the log was downloaded – they should be cleared and confirmed during service.","На момент выгрузки журнала есть <b>активные аварии</b> – их необходимо устранить и подтвердить во время обслуживания.","Kayıt indirildiğinde <b>aktif alarmlar</b> vardı – servis sırasında giderilmeli ve onaylanmalıdır."],["“Transfer impossible / Insufficient resources / Redundancy loss” alarmları olub – modulların sayı və vəziyyəti yükü ehtiyatla təmin etmir; modullar yoxlanmalıdır.","“Transfer impossible / Insufficient resources / Redundancy loss” alarms occurred – the number and condition of modules do not cover the load with redundancy; the modules should be checked.","Были аварии «Transfer impossible / Insufficient resources / Redundancy loss» – количество и состояние модулей не обеспечивают нагрузку с резервом; модули необходимо проверить.","“Transfer impossible / Insufficient resources / Redundancy loss” alarmları oluştu – modül sayısı ve durumu yükü yedekli karşılamıyor; modüller kontrol edilmelidir."],["Şəbəkə normal olduğu halda batareyada işləmə halları var – rektifikatorun söndürülmə səbəbi (əl ilə, start proseduru, nasazlıq) dəqiqləşdirilməlidir.","There were cases of running on battery with normal mains – the reason the rectifier was off (manual, start procedure, fault) should be clarified.","Были случаи работы от батареи при нормальной сети – необходимо выяснить причину отключения выпрямителя (вручную, процедура пуска, неисправность).","Şebeke normalken aküden çalışma durumları var – doğrultucunun kapanma nedeni (manuel, başlatma prosedürü, arıza) netleştirilmelidir."],["Giriş/bypass şəbəkəsində kəsintilər və tolerans pozuntuları var – şəbəkə keyfiyyəti analizatorla ölçülməsi tövsiyə olunur.","There are failures and tolerance violations on the input/bypass mains – measuring the mains quality with an analyser is recommended.","На входной сети/сети байпаса есть отключения и выходы за допуск – рекомендуется измерить качество сети анализатором.","Giriş/baypas şebekesinde kesintiler ve tolerans ihlalleri var – şebeke kalitesinin analizörle ölçülmesi önerilir."],["Batareya temperaturu yüksək olub – batareya otağının soyudulması təmin edilməlidir.","Battery temperature was high – cooling of the battery room should be ensured.","Температура батареи была высокой – необходимо обеспечить охлаждение аккумуляторной.","Akü sıcaklığı yüksekti – akü odasının soğutması sağlanmalıdır."],["<b>Batareyalar tam boşalıb</b> – batareyaların tutumu və daxili müqaviməti yoxlanmalı, ehtiyat vaxtı yükə görə hesablanmalıdır.","<b>The batteries were fully discharged</b> – battery capacity and internal resistance should be checked and the backup time calculated for the load.","<b>Батареи полностью разрядились</b> – необходимо проверить ёмкость и внутреннее сопротивление батарей и рассчитать время автономии для нагрузки.","<b>Aküler tamamen boşaldı</b> – akülerin kapasitesi ve iç direnci kontrol edilmeli, yedekleme süresi yüke göre hesaplanmalıdır."],["Çıxış gərginliyi maska xaricinə çıxıb – invertor və yükün xarakteri (qeyri-xətti yük, start cərəyanları) yoxlanmalıdır.","Output voltage went out of mask – the inverter and the nature of the load (non-linear load, inrush currents) should be checked.","Выходное напряжение вышло за маску – необходимо проверить инвертор и характер нагрузки (нелинейная нагрузка, пусковые токи).","Çıkış gerilimi maske dışına çıktı – invertör ve yükün karakteri (doğrusal olmayan yük, kalkış akımları) kontrol edilmelidir."],["Batareya gərginliyi alarmları olub – şarj gərginliyi parametrləri və batareya bloklarının gərginlikləri ölçülməlidir.","Battery voltage alarms occurred – charge voltage settings and battery block voltages should be measured.","Были аварии напряжения батареи – необходимо проверить параметры напряжения заряда и измерить напряжения блоков.","Akü gerilimi alarmları oluştu – şarj gerilimi parametreleri ve akü blok gerilimleri ölçülmelidir."],["E-Service alarmı verilib – profilaktik xidmət tələbləri yoxlanmalıdır.","An E-Service alarm was issued – preventive maintenance requirements should be checked.","Выдана авария E-Service – необходимо проверить требования к профилактическому обслуживанию.","E-Service alarmı verildi – önleyici bakım gereksinimleri kontrol edilmelidir."],["UPS <b>profilaktik xidmət</b> xəbərdarlığı verib – planlı texniki xidmət aparılmalı və sayğac sıfırlanmalıdır.","The UPS issued a <b>preventive maintenance</b> warning – scheduled maintenance should be performed and the counter reset.","ИБП выдал предупреждение о <b>профилактическом обслуживании</b> – необходимо провести плановое ТО и сбросить счётчик.","UPS <b>önleyici bakım</b> uyarısı verdi – planlı bakım yapılmalı ve sayaç sıfırlanmalıdır."],["DSP/idarəetmə proqram versiyası uyğunsuzluğu var – proşivkanın eyniləşdirilməsi tövsiyə olunur.","There is a DSP/control software version mismatch – aligning the firmware versions is recommended.","Есть несоответствие версий ПО DSP/управления – рекомендуется привести прошивки к одной версии.","DSP/kontrol yazılım sürümü uyumsuzluğu var – yazılım sürümlerinin eşitlenmesi önerilir."],["<b>QF1 batareya açarı</b> servis işlərindən kənarda açılıb – açarın vəziyyəti və səbəbi yoxlanmalıdır.","The <b>QF1 battery switch</b> was opened outside service work – the switch condition and the reason should be checked.","<b>Выключатель батареи QF1</b> размыкался вне сервисных работ – необходимо проверить его состояние и причину.","<b>QF1 akü şalteri</b> servis çalışmaları dışında açıldı – şalterin durumu ve nedeni kontrol edilmelidir."],["Əsas şəbəkənin gərginliyi/tezliyi tez-tez tolerans xaricinə çıxır – şəbəkə (və ya generator) keyfiyyəti ölçülməlidir.","Main mains voltage/frequency frequently goes out of tolerance – the mains (or generator) quality should be measured.","Напряжение/частота основной сети часто выходят за допуск – необходимо измерить качество сети (или генератора).","Ana şebeke gerilimi/frekansı sık sık tolerans dışına çıkıyor – şebeke (veya jeneratör) kalitesi ölçülmelidir."],["Kiçik nasazlıqlar və daxili rabitə xətaları qeydə alınıb – UPS-in diaqnostikası (servis proqramı) ilə ətraflı yoxlanmalıdır.","Minor faults and internal communication errors were recorded – the UPS should be checked in detail with diagnostics (service software).","Зарегистрированы незначительные неисправности и ошибки внутренней связи – ИБП необходимо подробно проверить диагностикой (сервисной программой).","Küçük arızalar ve dahili iletişim hataları kaydedildi – UPS teşhis (servis yazılımı) ile ayrıntılı kontrol edilmelidir."],["Batareya rejimində “Low battery” xəbərdarlığı olub – batareyaların ehtiyat vaxtı yük üçün kifayət etmir.","A “Low battery” warning occurred in battery mode – the battery backup time is not sufficient for the load.","В режиме батареи было предупреждение «Low battery» – времени автономии батарей недостаточно для нагрузки.","Akü modunda “Low battery” uyarısı oluştu – akülerin yedekleme süresi yük için yeterli değil."],["Yükün qidalanma rejimi – zaman xətti","Load supply mode – timeline","Режим питания нагрузки – временная шкала","Yük besleme modu – zaman çizelgesi"],["məlum deyil","unknown","неизвестно","bilinmiyor"],["Hadisələr günlər üzrə","Events per day","События по дням","Günlere göre olaylar"],["məlumat","info","информация","bilgi"],["Batareya boşalmaları – müddət və verilən Ah","Battery discharges – duration and Ah delivered","Разряды батареи – длительность и отданные Ач","Akü deşarjları – süre ve verilen Ah"],["Ən çox aktivləşən alarmlar","Most frequent alarms","Наиболее частые аварии","En sık etkinleşen alarmlar"],["Güc modullarının alarmları","Power module alarms","Аварии силовых модулей","Güç modülü alarmları"],["Hesabatı PDF faylına çevir","Export report to PDF","Сохранить отчёт в PDF","Raporu PDF'e dönüştür"],["Dövr:","Period:","Период:","Dönem:"],["Daxil ediləcək bölmələr","Sections to include","Включаемые разделы","Eklenecek bölümler"],["Cihaz məlumatı və ümumi qiymət","Device information and overall assessment","Сведения об оборудовании и общая оценка","Cihaz bilgisi ve genel değerlendirme"],["Ümumi nəticə","General conclusion","Общее заключение","Genel sonuç"],["Ehtimal olunan nasazlıqlar","Probable faults","Вероятные неисправности","Ol
